        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Shares.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistSharePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }
    post:
      operationId: createPlaylistShare
      tags: [playlists]
      summary: Shares the playlist with one person. Only its owner shares it.
      description: |
        The owner shares with someone they see on the calling device, as
        listShareCandidates lists them. Anyone else, the owner
        themselves, or write access for a kid answers 400; a person it is
        already shared with answers 409, as does a station's own
        playlist. A share with someone the owner no longer sees stays,
        and its access may still be changed or the share removed.
      x-replayable: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaylistShareInput" }
      responses:
        "201":
          description: Shared.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistShare" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /profiles/{profileId}/playlists/{playlistId}/shares/{shareProfileId}:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
      - $ref: "#/components/parameters/PlaylistId"
      - $ref: "#/components/parameters/ShareProfileId"
    get:
      operationId: getPlaylistShare
      tags: [playlists]
      summary: One share, by the profile it is shared with. Owner only, as listPlaylistShares.
      responses:
        "200":
          description: Share.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistShare" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }
    put:
      operationId: replacePlaylistShare
      tags: [playlists]
      summary: Changes a share's access. Owner only; write for a kid answers 400.
      x-replayable: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaylistShareChange" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistShare" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }
    delete:
      operationId: deletePlaylistShare
      tags: [playlists]
      summary: Stops sharing with that profile. Owner only. Their stations that play the playlist are deleted with the share, unless a household share still reaches them.
      x-replayable: true
      responses:
        "204": { description: No longer shared. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /profiles/{profileId}/playlists/{playlistId}/household-shares:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
      - $ref: "#/components/parameters/PlaylistId"
    get:
      operationId: listPlaylistHouseholdShares
      tags: [playlists]
      summary: Which households the playlist is shared with, by name. Only its owner reads them; anyone it reaches answers 403.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Household shares.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistHouseholdSharePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }
    post:
      operationId: createPlaylistHouseholdShare
      tags: [playlists]
      summary: Shares the playlist with everyone in one household. Only its owner shares it.
      description: |
        The owner shares with a household they are in, their own or one
        they were shared into. It reaches whoever is in the household at
        the time: someone who joins later sees it, someone who leaves no
        longer does. A kid in it only reads, whatever the access. A
        profile reached by several shares gets the strongest. Any other
        household answers 400; one it is already shared with answers
        409, as does a station's own playlist.
      x-replayable: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaylistHouseholdShareInput" }
      responses:
        "201":
          description: Shared.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistHouseholdShare" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "501": { $ref: "#/components/responses/NotImplemented" }

