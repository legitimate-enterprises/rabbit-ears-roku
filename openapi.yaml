    parameters:
      - name: householdId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/Id" }
    get:
      operationId: getHousehold
      tags: [admin]
      security:
        - device: [admin]
      responses:
        "200":
          description: Household.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Household" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: replaceHousehold
      tags: [admin]
      summary: Renames a household. Its adult is fixed.
      security:
        - device: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HouseholdInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Household" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteHousehold
      tags: [admin]
      security:
        - device: [admin]
      responses:
        "204":
          description: >-
            Deleted with its devices and the kids and adults only it holds.
            Its adult stays, without a household, as do the profiles another
            household holds: a kid among them takes another of its
            households as `householdId`.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /households/{householdId}/members/{accountId}:
    parameters:
      - name: householdId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/Id" }
      - $ref: "#/components/parameters/AccountId"
    put:
      operationId: putHouseholdMember
      tags: [admin]
      summary: >-
        Puts a kid or a joined, unrevoked adult into a household besides
        those it is in, as an accepted offer does. A kid stands in it as in
        any other; an adult is only present there and manages nothing. A
        profile in it already is left as it is. Anyone else answers 409.
      security:
        - device: [admin]
      responses:
        "204": { description: In the household. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteHouseholdMember
      tags: [admin]
      summary: >-
        Takes a profile out of a household, as leaving it does: devices
        there acting as it go back to Who's watching, and an adult's own
        devices there sign out. A kid leaving the household its
        `householdId` names gets another it is in as that; an adult leaving
        their own household is left without one, as their household's
        deletion leaves its owner. A profile's only household answers 409;
        deleting the profile is deleteAccount. A profile not in it is 404.
      security:
        - device: [admin]
      responses:
        "204": { description: Out of the household. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

