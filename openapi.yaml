        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /profiles/{profileId}/playlists:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    get:
      operationId: listPlaylists
      tags: [playlists]
      summary: The profile's own playlists and those shared with it, by name.
      description: |
        A playlist belongs to one adult's profile and holds one library
        kind: movies, tv or music. Its owner may share it with other
        profiles (listPlaylistShares) and with households
        (listPlaylistHouseholdShares); it is then listed for everyone it
        reaches too, with access and ownerName. A kid owns none, so a
        kid's page holds only playlists shared with the kid or a
        household of theirs. A playlist a station owns is
        not listed. Another household's
        profile is not found, and other profiles answer 403 while a kid is
        active.
      parameters:
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/PlaylistKind" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Playlists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }
    post:
      operationId: createPlaylist
      tags: [playlists]
      summary: Makes an empty playlist. A kid's profile, or any while a kid is active, answers 403.
      x-replayable: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaylistInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Playlist" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /profiles/{profileId}/playlists/{playlistId}:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
      - $ref: "#/components/parameters/PlaylistId"
    get:
      operationId: getPlaylist
      tags: [playlists]
      description: A playlist neither the profile's own nor shared with it is not found.
      responses:
        "200":
          description: Playlist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Playlist" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }
    put:
      operationId: replacePlaylist
      tags: [playlists]
      summary: Renames a playlist. Changing the kind of one that has entries answers 409; anyone but its owner answers 403.
      x-replayable: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaylistInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Playlist" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "501": { $ref: "#/components/responses/NotImplemented" }
    delete:
      operationId: deletePlaylist
      tags: [playlists]
      summary: Deletes a playlist with its entries and shares, and the stations of those it was shared with that play it. One the owner's own station plays answers 409; delete the station, or give it another playlist, first. Anyone but its owner answers 403.
      x-replayable: true
      responses:
        "204": { description: Deleted with its entries. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /profiles/{profileId}/playlists/{playlistId}/entries:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
      - $ref: "#/components/parameters/PlaylistId"
    get:
      operationId: listPlaylistEntries
      tags: [playlists]
      summary: The playlist's entries in order, as the owner arranged them; play from listPlaylistPlayOrder. A kid gets only the entries that stand for something the kid may play.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Entries by position.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistEntryPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }
    post:
      operationId: addPlaylistEntry
      tags: [playlists]
      summary: Add to playlist. Absent position appends. The owner and those it is shared with for write may; read access answers 403.
      description: |
        A movies playlist takes movies and collections; a tv playlist takes
        shows, seasons and episodes; a music playlist takes artists, albums
        and songs. Another kind, YouTube channels and videos among them,
        answers 400; an item or collection the profile may not see answers
        404. The same item may
        appear more than once, and a show may sit beside its own episodes.

        A movie, episode or song entry plays one edition. editionId names
        it; without one, a title with a single edition is stored with that
        edition, and a title with several answers 400 with the field
        editionId. An editionId of another item, or on a show, season,
        album, artist or collection, answers 400. The entry keeps its
        edition when the title gains another.
      x-replayable: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaylistEntryInput" }
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /profiles/{profileId}/playlists/{playlistId}/play-order:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
      - $ref: "#/components/parameters/PlaylistId"
    get:
      operationId: listPlaylistPlayOrder
      tags: [playlists]
      summary: What playing the playlist plays, first to last.
      description: |
        Every movie, episode or song the entries stand for, in entry order.
        A single item stands for itself. A show expands to its episodes by
        season number, specials (season 0) last as Up next orders them,
        then episode number; a
        season to its episodes by episode number; a collection to its
        movies the profile may see, as listCollectionMovies orders them; an
        album to its songs by
        disc then track; an artist to the songs on its albums or performed
        by it, by album year newest first (no year last), then album
        title, then disc and track. Containers are expanded at read time,
        so new episodes and songs appear with no edit. Nothing is
        deduplicated. A client plays each row with startPlayback, passing
        its itemId and the playlistId, and never expands a container
        itself. Paging and errors are as listPlaylistEntries.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: The play order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistPlayOrderPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /profiles/{profileId}/playlists/{playlistId}/entries/{entryId}:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
      - $ref: "#/components/parameters/PlaylistId"
      - $ref: "#/components/parameters/PlaylistEntryId"
    get:
      operationId: getPlaylistEntry
      tags: [playlists]
      responses:
        "200":
          description: Entry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }
    put:
      operationId: replacePlaylistEntry
      tags: [playlists]
      summary: Reorder. Moves the entry to position, shifting the others; absent position moves it to the end. Access as addPlaylistEntry.
      description: The body names the entry's own item or collection; any other answers 400.
      x-replayable: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaylistEntryInput" }
      responses:
        "200":
          description: The entry at its new position.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }
    delete:
      operationId: removePlaylistEntry
      tags: [playlists]
      summary: Access as addPlaylistEntry.
      x-replayable: true
      responses:
        "204": { description: Removed; later entries move up. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /profiles/{profileId}/playlists/{playlistId}/shares:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
      - $ref: "#/components/parameters/PlaylistId"
    get:
      operationId: listPlaylistShares
      tags: [playlists]
      summary: Who the playlist is shared with, by name. Only its owner reads them; anyone it is shared with answers 403.
      parameters:
