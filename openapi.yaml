        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /collections/{collectionId}/movies/{itemId}:
    parameters:
      - $ref: "#/components/parameters/CollectionId"
      - $ref: "#/components/parameters/ItemId"
    put:
      operationId: addCollectionMovie
      tags: [collections]
      summary: Adds a movie to a custom collection.
      description: |
        Anything but a movie answers 400; an item the profile may not see
        answers 404; a TMDB collection, or any while a kid is active,
        answers 403.
      x-replayable: true
      responses:
        "204": { description: Added; idempotent. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }
    delete:
      operationId: removeCollectionMovie
      tags: [collections]
      summary: Removes a movie from a custom collection; a movie not in it answers 404. Writes are refused as addCollectionMovie.
      x-replayable: true
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /collections/{collectionId}/movies/{itemId}/position:
    parameters:
      - $ref: "#/components/parameters/CollectionId"
      - $ref: "#/components/parameters/ItemId"
    put:
      operationId: replaceCollectionMoviePosition
      tags: [collections]
      summary: Reorder. Moves the movie to position, shifting the others; absent position or one past the end moves it last. Writes are refused as addCollectionMovie.
      description: |
        The first move of a collection in release order gives every movie a
        position from that order, then moves this one; the collection is
        then hand-ordered (customOrder) and listCollectionMovies, a playlist
        holding it and a movie's related collections follow that order. A
        movie added later goes last. A movie not in the collection answers
        404.
      x-replayable: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollectionMoviePositionInput" }
      responses:
        "200":
          description: The collection, hand-ordered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /collections/{collectionId}/order:
    parameters:
      - $ref: "#/components/parameters/CollectionId"
    delete:
      operationId: resetCollectionOrder
      tags: [collections]
      summary: Returns the collection to release order, clearing every position. Writes are refused as addCollectionMovie.
      x-replayable: true
      responses:
        "200":
          description: The collection, no longer hand-ordered; idempotent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /collections/{collectionId}/artwork/{kind}:
    parameters:
      - $ref: "#/components/parameters/CollectionId"
      - name: kind
        in: path
        required: true
        schema: { $ref: "#/components/schemas/ArtworkKind" }
    get:
      operationId: getCollectionArtwork
      tags: [collections]
      summary: The collection's image.
      description: |
        A TMDB collection's own poster or backdrop. A custom collection, or
        a TMDB one without that image, shows its first movie's, in
        listCollectionMovies order for the active profile. 404 when none
        has one. The image Collection.posterUrl or backdropUrl names,
        cached for a day and revalidated; kept because released clients
        use it.
      deprecated: true
      parameters:
        - name: If-None-Match
          in: header
          schema: { type: string }
      responses:
        "200":
          description: Image bytes, cached by the server from the metadata provider.
          headers:
            ETag:
              required: true
              schema: { type: string }
            Cache-Control:
              required: true
              schema: { type: string }
          content:
            image/*:
              schema: { type: string, format: binary }
        "304":
          description: The client's copy, named by If-None-Match, is current.
          headers:
            ETag:
              required: true
              schema: { type: string }
            Cache-Control:
              required: true
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /watch-together:
    post:
      operationId: openWatchTogether
      tags: [together]
      summary: Watch together. The active profile opens a 5-minute window on a movie, episode or YouTube video.
      description: |
        Another profile of the device household, adult or kid, who may see
        the title and opens it in the window sees Join and may join. The
        opener is the host. Opening again ends any Watch together the
        active profile is in. Another kind of item answers 400; one the
        profile may not see, as a kid's filters decide, 404.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WatchTogetherInput" }
      responses:
        "201":
          description: Waiting for someone to join.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatchTogether" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }
    get:
      operationId: listWatchTogethers
      tags: [together]
      summary: Open Watch togethers the active profile finds, newest first, for Join on a details screen.
      description: |
        Those of the device household, and those opened by someone the
        active profile sees (an adult an admin linked them with, on a TV
        only by a link set for TVs; a member of another household of a
        shared kid), that are still waiting or that the active profile is
        in, and have not ended. Others answer 404 throughout Watch
        together. Only titles the active profile may see count: a kid is
        never told of one on a title their filters keep from them. A
        details screen asks with its `itemId` when it opens and every 5
        seconds while shown; a waiting one hosted by someone else shows
        "Join <host name> · m:ss" from `joinMsLeft`.
      parameters:
        - name: itemId
          in: query
          schema: { $ref: "#/components/schemas/Id" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Watch togethers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatchTogetherPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /watch-together/{watchTogetherId}:
    parameters:
      - $ref: "#/components/parameters/WatchTogetherId"
    get:
      operationId: getWatchTogether
      tags: [together]
      summary: The shared state. Members ask again, with `after`, as soon as each answer arrives, while waiting, on details and in the player.
      description: |
        Plain HTTP long polling, so every client can follow along, Roku
        included. With `after`, the answer waits until `version` passes it
        or the Watch together ends, at most 25 seconds, then answers the
        state as it stands; without, it answers at once. Each poll by a
        member marks that member present; a member unseen for 30 seconds is
        not present, and a Watch together none of whose members has polled
        for 60 seconds ends.

        Every play, pause and seek takes effect on both members at one
        instant, `effectiveAtMs`, a lead after it was sent: from then the
        player is at `effectivePositionMs`, advancing while `playing`. The
        lead is what the slowest present member needs to hear of the change
        and act on it, at least 0.3 second and at most 1 second; it need
        not be a whole second, and a client must not assume one. A member
        says what it needs with `rttMs` and `floorMs` on each poll and each
        action, and one that sends neither, as a client written before them
        does, needs the full second. A client
        estimates its offset from the server's clock from the
        `serverTimeMs` of a few answers without `after`, taking the one
        with the shortest round trip as answered at its midpoint. A change
        whose instant is still ahead is applied at that instant on the
        client's estimate of the server's clock, the sender's own player
        included; one already past is applied at once at the position it
        has run on to. While playing, a player more than 0.5 seconds from
        the shared position seeks to it. A member who is not in the player
        opens it, and starts its own playback session at the shared
        position, when `playing` turns true. `version` rises with every
        change. Only the household's profiles that may see its title see
        it; others get 404. A member who may no longer see the title gets
        404 too, and it ends for the other.
      parameters:
        - name: after
          in: query
          description: The `version` the client holds; the answer waits for a later one.
          schema: { type: integer, minimum: 0 }
        - $ref: "#/components/parameters/WatchTogetherRttMs"
        - $ref: "#/components/parameters/WatchTogetherFloorMs"
      responses:
        "200":
          description: Watch together.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatchTogether" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }
    delete:
      operationId: leaveWatchTogether
      tags: [together]
      summary: Leave, or cancel while waiting. It ends for both; the other's next poll reads ended and plays on alone.
      responses:
        "204": { description: Ended. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /watch-together/{watchTogetherId}/join:
    parameters:
      - $ref: "#/components/parameters/WatchTogetherId"
    post:
      operationId: joinWatchTogether
      tags: [together]
      summary: The second profile joins on this device.
      description: |
        Two profiles at most: one that is already joined, ended or past its
        window answers 409, as does the host's device joining its own. The
        host's profile on another device may join. One on a title the
        active profile may not see answers 404.
      responses:
        "200":
          description: Joined.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatchTogether" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /watch-together/{watchTogetherId}/state:
    parameters:
      - $ref: "#/components/parameters/WatchTogetherId"
    put:
      operationId: setWatchTogetherState
      tags: [together]
      summary: Play, pause or seek from either side; it applies to both.
      description: |
        A member sends this the moment its viewer plays, pauses or seeks,
        with its own position; the answer is the new shared state, which
        takes effect at its `effectiveAtMs`. Play together on details sends
        a play at the shared position. Pausing records who paused. A member that is not joined, or one that has
        ended, answers 409; a household profile that is not a member, 403.
      parameters:
        - $ref: "#/components/parameters/WatchTogetherRttMs"
        - $ref: "#/components/parameters/WatchTogetherFloorMs"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WatchTogetherStateInput" }
      responses:
        "200":
          description: The new shared state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatchTogether" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /stations:
    get:
      operationId: listStations
      tags: [stations]
      summary: The stations the active profile may see, by name, each with what is on.
      description: |
        A station is continuous programming, in the manner of a broadcast
        channel, from exactly one playlist of its owner, whose kind it
        takes: movies, tv or music. The server alone decides its order and
        what is on; nobody pauses or seeks a station, and tuning in joins
        what is on at its live position.

        A private station is seen by its owner only; a household one by
        every profile of the owner's household; a server one by every
        household. While a kid is active, a station is listed only when
        the kid may watch or hear every item of its play order now; its
        rating does not decide it.

        Each station carries onAir, so a tile is drawn from this one call.
      parameters:
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/PlaylistKind" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Stations.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StationPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createStation
      tags: [stations]
      summary: Makes a station owned by the active adult, and schedules it at once.
      description: |
        Without playlistId the station owns a new empty playlist of kind,
        which no playlist listing shows; the owner fills it through the
        playlist entry operations under their profile. A playlistId that
        is neither one of the active adult's playlists nor shared with
        them answers 400 on playlistId. While a kid is active this answers 403. The
        schedule is written through the end of the next day and the rating
        calculated before the answer, so onAir is already filled.
      x-replayable: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StationInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Station" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /stations/{stationId}:
    parameters:
      - $ref: "#/components/parameters/StationId"
    get:
      operationId: getStation
      tags: [stations]
      description: A station listStations would not list is not found.
      responses:
        "200":
          description: Station.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Station" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: replaceStation
      tags: [stations]
      summary: Edits a station. Only its owner, active, edits; any other profile that sees it gets 403.
      description: |
        What is already scheduled stays: a change shows from where the
        daily task next extends the schedule, the next day's, unless the
        owner then calls rescheduleStation. An editing client asks
        "Reschedule now?" after the owner saves a station or changes its
        playlist; Now calls rescheduleStation, Later nothing. A new
        playlist or order starts a new loop there. The rating is recalculated only by the daily
        task and rescheduleStation.

        visibility absent keeps the station's. On a server station a
        visibility answers 403: only an admin changes it, through
        setStationServerWide.
      x-replayable: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StationInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Station" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteStation
      tags: [stations]
      summary: Deletes a station with its schedule, and the playlist it owns. Only its owner, active, deletes; any other profile that sees it gets 403.
      x-replayable: true
      responses:
        "204": { description: Deleted. A session tuned in plays on to the end of its program. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /stations/{stationId}/schedule:
    parameters:
      - $ref: "#/components/parameters/StationId"
    get:
      operationId: listStationSchedule
      tags: [stations]
      summary: One day's programs, by start.
      description: |
        Every program that overlaps the day, in the server's local time, so
        the first may have started the day before. The schedule is written
        through the end of the next day; later days are empty, and so are
        days more than one before today. A program the active profile may
        not see is left out.
      parameters:
        - name: date
          in: query
          description: The day, in the server's local time; absent is today.
          schema: { type: string, format: date }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Programs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StationProgramPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /stations/{stationId}/reschedule:
    parameters:
      - $ref: "#/components/parameters/StationId"
    post:
      operationId: rescheduleStation
      tags: [stations]
      summary: Reschedule now. What is on plays to its end; the schedule is rebuilt from there with the station as it is now, and the rating recalculated.
      description: Only the owner, active; any other profile that sees it gets 403.
      x-replayable: true
      responses:
        "200":
          description: The station with its new onAir.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Station" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /stations/{stationId}/playback:
    parameters:
      - $ref: "#/components/parameters/StationId"
    post:
      operationId: startStationPlayback
      tags: [stations]
      summary: Tune in. Starts a playback session for the active profile on what the station plays now.
      description: |
        The session is an ordinary playback session: every
        /playback/sessions operation applies to it, and it ends any other
        session of the device. A station session marks nothing watched,
        saves no position and counts as no play, whatever position reports
        it sends.

        Without live, and always on a music station, the session is on
        the one program on now: the server picks its file for this device
        as startPlayback does, the stream's positionMs is the live
        position, where the client starts, and the client offers no pause
        or seek. The program ends at onAir.now.endsAt, which is where its
        stream ends. Then the client ends the session and calls this
        again: the next program may start at once (always on a music
        station, and on a movies or tv station when one ends exactly on
        its boundary), or the call answers 409 off_air with resumesAt,
        when the client shows the station's identity image and calls
        again at resumesAt.

        With live, a movies or tv station answers one stream with live
        set: the station's programs one after another, each from the file
        the server picks for this device, and the station's ident
        wherever the schedule leaves a gap of an hour or less. The client
        plays it from its live edge, offers no pause or seek, and does
        not call again when a program ends; what is on is getStation's
        onAir. Tuned in to an ident, onAir has no now. The stream has no
        sidecars and no previews, and a track choice holds for the
        program on. It ends when nothing more is on within the hour, or
        when what comes next is not for the profile or cannot be played
        to the device; the client then ends the session and calls this
        again, which answers that program or says why not.

        Errors: 404 for a station the profile may not see. 409 with code
        off_air when nothing is on, and with live nothing starts within
        the hour either, with resumesAt when the next program starts,
        absent when none is scheduled. 403 when the program on now fails
        the active kid's filter. 409 with code conflict, as
        startPlayback, when the program's edition has no file on disk,
        nothing the client reported can play it, or the encoder is busy.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StationPlaybackRequest" }
      responses:
        "201":
          description: Tuned in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StationPlayback" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/stations:
    get:
      operationId: listAdminStations
