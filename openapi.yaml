        - device: [admin]
      parameters:
        - name: active
          in: query
          description: Only sessions still playing.
          schema: { type: boolean, default: false }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Sessions, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: getSession
      tags: [admin]
      security:
        - device: [admin]
      responses:
        "200":
          description: Session with its plan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteSession
      tags: [admin]
      security:
        - device: [admin]
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /logs:
    get:
      operationId: listLogs
      tags: [admin]
      security:
        - device: [admin]
      summary: Server log entries, newest first.
      parameters:
        - $ref: "#/components/parameters/LogLevel"
        - $ref: "#/components/parameters/LogSource"
        - $ref: "#/components/parameters/LogSince"
        - $ref: "#/components/parameters/LogUntil"
        - $ref: "#/components/parameters/LogQuery"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: One page of entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogEntryPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /logs/download:
    get:
      operationId: downloadLogs
      tags: [admin]
      security:
        - device: [admin]
      summary: The filtered entries as plain text, one line each, oldest first.
      parameters:
        - $ref: "#/components/parameters/LogLevel"
        - $ref: "#/components/parameters/LogSource"
        - $ref: "#/components/parameters/LogSince"
        - $ref: "#/components/parameters/LogUntil"
        - $ref: "#/components/parameters/LogQuery"
      responses:
        "200":
          description: Text file.
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            text/plain:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /tasks:
    get:
      operationId: listTasks
      tags: [admin]
      security:
        - device: [admin]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Tasks by name, each with its last run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createTask
      tags: [admin]
      security:
        - device: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /tasks/{taskId}:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    get:
      operationId: getTask
      tags: [admin]
      security:
        - device: [admin]
      responses:
        "200":
          description: Task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: replaceTask
      tags: [admin]
      security:
        - device: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteTask
      tags: [admin]
      security:
        - device: [admin]
      responses:
        "204": { description: Deleted with its runs. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tasks/{taskId}/runs:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    get:
      operationId: listTaskRuns
      tags: [admin]
      security:
        - device: [admin]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Runs, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskRunPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: requestTaskRun
      tags: [admin]
      security:
        - device: [admin]
      summary: Run now.
      description: |
        Queues a run that the scheduler starts within seconds, even while
        tasks are paused or the task is disabled. Runs are recorded by the
        scheduler only; this does not create one directly.
      responses:
        "202":
          description: Queued; the task carries runRequestedAt until its run starts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tasks/{taskId}/runs/{runId}:
    parameters:
      - $ref: "#/components/parameters/TaskId"
      - name: runId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/Id" }
    get:
      operationId: getTaskRun
      tags: [admin]
      security:
        - device: [admin]
      responses:
        "200":
          description: Run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskRun" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /settings:
    get:
      operationId: getSettings
      tags: [admin]
      security:
        - device: [admin]
      responses:
        "200":
          description: Settings with the read-only facts the Settings cards show.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: replaceSettings
      tags: [admin]
      security:
        - device: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettingsInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /stats:
    get:
      operationId: getStats
      tags: [admin]
      security:
        - device: [admin]
      summary: The Dashboard gauges; CPU is sampled at most every 5 seconds.
      responses:
        "200":
          description: Current load.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerStats" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /transcode-cache:
    delete:
      operationId: clearTranscodeCache
      tags: [admin]
      security:
        - device: [admin]
      summary: Danger zone. Deletes cached segments and sidecars, except those of active sessions.
      responses:
        "204": { description: Cleared. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /metadata/refresh:
    post:
      operationId: refreshAllMetadata
      tags: [admin]
      security:
        - device: [admin]
      summary: Danger zone. Makes every item's metadata due and queues the Refresh metadata task.
      description: The task re-fetches due items in batches of 200 per run.
      responses:
        "202": { description: Queued. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /music/artists:
    get:
      operationId: listMusicArtists
      tags: [music]
      summary: Artists of Music libraries A to Z by sort name, as the Artists view and CarPlay's Artists tab list them.
      description: |
        An artist's image is its posterUrl. While a kid is
        active an artist with no song but explicit ones is left out, and
        its counts leave out explicit songs and the albums holding only them.
      parameters:
        - name: libraryId
          in: query
          description: One Music library; absent spans every Music library.
          schema: { $ref: "#/components/schemas/Id" }
        - name: genreId
          in: query
          schema: { $ref: "#/components/schemas/Id" }
        - $ref: "#/components/parameters/MusicLetter"
        - name: q
          in: query
          description: Case-insensitive substring of the name.
          schema: { type: string, minLength: 1, maxLength: 200 }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Artists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicArtistPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /music/artists/{artistId}:
    parameters:
      - $ref: "#/components/parameters/ArtistId"
    get:
      operationId: getMusicArtist
      tags: [music]
      summary: An artist with counts, genres and bio, for Artist details.
      description: |
        Its albums are `listMusicAlbums` with `artistId`; Popular is
        `listMusicSongs` with `artistId`, `sort=popular` and `limit=5`.
        Not found while a kid is active when listMusicArtists leaves it out.
      responses:
        "200":
          description: Artist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicArtist" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /music/albums:
    get:
      operationId: listMusicAlbums
      tags: [music]
      summary: Albums of Music libraries, for the Albums view, Artist details, More by and CarPlay's Albums tab.
      description: |
        Recently added (Home and CarPlay's Recent tab) is `sort=added`. An
        album's art is its posterUrl. While a kid is active
        an album whose every song is explicit is left out, and the counts,
        duration and lossless of the rest cover only their clean songs.
      parameters:
        - name: libraryId
          in: query
          description: One Music library; absent spans every Music library.
          schema: { $ref: "#/components/schemas/Id" }
        - name: artistId
          in: query
          description: Only albums whose album artist this is.
          schema: { $ref: "#/components/schemas/Id" }
        - name: genreId
          in: query
          schema: { $ref: "#/components/schemas/Id" }
        - $ref: "#/components/parameters/MusicLetter"
        - name: q
          in: query
          description: Case-insensitive substring of the title.
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: sort
          in: query
          schema: { $ref: "#/components/schemas/MusicAlbumSort" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Albums.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicAlbumPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /music/albums/{albumId}:
    parameters:
      - $ref: "#/components/parameters/AlbumId"
    get:
      operationId: getMusicAlbum
      tags: [music]
      summary: An album for Album details; its songs are `listMusicSongs` with `albumId`.
      description: Not found while a kid is active when listMusicAlbums leaves it out.
      responses:
        "200":
          description: Album.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicAlbum" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /music/songs:
    get:
      operationId: listMusicSongs
      tags: [music]
      summary: Songs, for the Songs view, an album's track list and an artist's Popular.
      description: |
        With `albumId` and no `sort`, songs come in disc then track order.
        While a kid is active songs tagged explicit, or not yet read for
        the tag, are left out.
      parameters:
        - name: libraryId
          in: query
          description: One Music library; absent spans every Music library.
          schema: { $ref: "#/components/schemas/Id" }
        - name: albumId
          in: query
          schema: { $ref: "#/components/schemas/Id" }
        - name: artistId
          in: query
          description: Songs this artist performs or whose album is theirs.
          schema: { $ref: "#/components/schemas/Id" }
        - name: genreId
          in: query
          schema: { $ref: "#/components/schemas/Id" }
        - name: q
          in: query
          description: Case-insensitive substring of the title.
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: sort
          in: query
          schema: { $ref: "#/components/schemas/MusicSongSort" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Songs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicSongPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /music/songs/{songId}:
    parameters:
      - $ref: "#/components/parameters/SongId"
    get:
      operationId: getMusicSong
      tags: [music]
      summary: One song, for Now playing and the mini player. Not found while a kid is active when listMusicSongs leaves it out.
      responses:
        "200":
          description: Song.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicSong" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /music/letters:
    get:
      operationId: listMusicLetters
      tags: [music]
      summary: How many albums or artists file under each letter, for CarPlay's index letters and letter rows.
      description: |
        Letters are A to Z by the first letter of the sort name (a leading
        "The " ignored), then `#` for anything else; letters with nothing
        under them are absent. The counts' sum is the whole list's length,
        as the active profile sees it.
      parameters:
        - name: libraryId
          in: query
          description: One Music library; absent spans every Music library.
          schema: { $ref: "#/components/schemas/Id" }
        - name: of
          in: query
          required: true
          schema: { $ref: "#/components/schemas/MusicLetterGroup" }
      responses:
        "200":
          description: Letter counts, A to Z then #.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicLetterCountList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /music/search:
    get:
      operationId: searchMusic
      tags: [music]
      summary: Artists, albums and songs matching a query, for search results and Siri.
      description: Each list holds at most `limit` matches, best first, as the music lists filter them for the active profile.
      parameters:
        - name: q
          in: query
          required: true
          description: Case-insensitive substring of a name or title.
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: libraryId
          in: query
          schema: { $ref: "#/components/schemas/Id" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Matches.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicSearchResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /profiles/{profileId}/music/recently-played:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    get:
      operationId: listRecentlyPlayedMusic
      tags: [music, profiles]
      summary: What the profile played last, newest first, for Home's Recently played and CarPlay's Recent tab.
      description: |
        A song's play counts for its album and artist; a song started with
        `playlistId` counts for that music playlist too. Without `kind` the
        page mixes albums and music playlists. `kind=album` and
        `kind=artist` give the 12 most recently played that CarPlay shows
        when the car limits lists. A kid's page holds no playlists and
        only what the kid may hear; another household's profile is not
        found, and other profiles answer 403 while a kid is active.
      parameters:
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/MusicRecentKind" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Recently played.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicRecentPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /youtube/channels:
    get:
      operationId: listYouTubeChannels
      tags: [youtube]
      summary: Channels of YouTube libraries, for the Channels view and the Channel select.
      description: |
        Every channel folder with videos in the library. A channel's avatar
        is its posterUrl. While a kid is active only the
        channels the kid may see are listed: under rating ceilings those
        forKids, on a manual allow list those on it. An adult with
        hideKidsContent is not listed channels forKids.
      parameters:
        - name: libraryId
          in: query
          description: One YouTube library; absent spans every YouTube library.
          schema: { $ref: "#/components/schemas/Id" }
        - name: q
          in: query
          description: Case-insensitive substring of the title.
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: sort
          in: query
          schema: { $ref: "#/components/schemas/YouTubeChannelSort" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Channels.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/YouTubeChannelPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /youtube/channels/{channelId}:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    get:
      operationId: getYouTubeChannel
      tags: [youtube]
      summary: A channel for Channel details. Not found while a kid is active who may not see it.
      responses:
        "200":
          description: Channel.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/YouTubeChannel" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /youtube/channels/{channelId}/for-kids:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    put:
      operationId: setYouTubeChannelForKids
      tags: [youtube]
      summary: Marks a channel as for kids or not.
      description: Any adult; while a kid is active this answers 403.
      x-replayable: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/YouTubeChannelForKidsInput" }
      responses:
        "200":
          description: The channel.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/YouTubeChannel" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /youtube/videos:
    get:
      operationId: listYouTubeVideos
      tags: [youtube]
      summary: Videos of YouTube libraries with the active profile's watch state.
      description: |
        Home's New from your channels is `sort=newest` with
        `unwatched=true`; its Continue watching takes
        `inProgress=true` with `sort=played`. A video's thumbnail is
        its posterUrl. Only videos of the channels
        listYouTubeChannels lists to the active profile are listed.
      parameters:
        - name: libraryId
          in: query
          description: One YouTube library; absent spans every YouTube library.
          schema: { $ref: "#/components/schemas/Id" }
        - name: channelId
          in: query
          schema: { $ref: "#/components/schemas/Id" }
        - name: unwatched
          in: query
          description: Only videos the active profile has not watched.
          schema: { type: boolean, default: false }
        - name: inProgress
          in: query
          description: Only videos with a resume position, watched or not.
          schema: { type: boolean, default: false }
        - name: q
          in: query
          description: Case-insensitive substring of the title.
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: sort
          in: query
          schema: { $ref: "#/components/schemas/YouTubeVideoSort" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Videos.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/YouTubeVideoPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /youtube/videos/{videoId}:
    parameters:
      - $ref: "#/components/parameters/VideoId"
    get:
      operationId: getYouTubeVideo
      tags: [youtube]
      summary: A video for Video details; its file, chapters and subtitles are `listMediaFiles` with its id.
      description: Not found while a kid is active who may not see its channel.
      responses:
        "200":
          description: Video.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/YouTubeVideo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /profiles/{profileId}/youtube/channels/{channelId}/watch-state:
