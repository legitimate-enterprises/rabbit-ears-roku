        editionId: { $ref: "#/components/schemas/Id", description: "From a playlist, the edition its row plays; absent for the default." }
        index: { type: integer, description: "From a playlist, the row's index in the play order, which the next getUpNext passes." }
        item: { $ref: "#/components/schemas/Item" }
        video: { $ref: "#/components/schemas/YouTubeVideo" }

    ShowProgressPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ShowProgress" }
        nextOffset: { type: integer }

