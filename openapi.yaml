          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }
    delete:
      operationId: deleteCollection
      tags: [collections]
      summary: Deletes a custom collection. A TMDB collection answers 403, as does any while a kid is active.
      x-replayable: true
      responses:
        "204": { description: "Deleted, with every playlist entry that held it; later entries move up on the playlist's next write." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /collections/{collectionId}/movies:
