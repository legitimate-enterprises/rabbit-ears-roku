  /playback/sessions:
    post:
      operationId: startPlayback
      tags: [playback]
      summary: Starts playing an item for a profile on this device.
      description: |
        The request carries the full current capability snapshot, never a
        reference to a stored one. The server builds an ordered plan and
        answers with the entry in use and its stream.

        A song plays as an audio-only session with the same plan model and
        no quality menu: no rungs, no previews, a negotiated width and
        height of 0, and audioCodec and lossless set. At home a song the
        client can play is copied as it is, else converted to AAC at
        256 kb/s. Away from home a lossless song converts to AAC at 256 kb/s
        and a lossy one is copied. On a metered or low-data path every song
        is AAC at 128 kb/s. A kid starting a song or YouTube video their
        filter hides gets 404.

        The session plays one edition of the item, editionId or else the
        default, and the server picks its file: of the edition's copies,
        the one whose plan starts with the cheapest verdict (direct play,
        remux, audio transcode, video transcode), then the tallest picture
        the display shows, then HDR the display keeps, then the least
        picture beyond the display, then the higher bitrate. A copy holding
        audioTrackId or subtitleTrackId is taken outright. The session's
        mediaFileId names the file picked. An editionId of another item
        answers 404; an edition without files answers 409.

        Only files on disk when the call is made are picked from, whatever
        MediaFile.missingAt says: a file found there loses its mark and one
        found gone gains it. An edition none of whose files is on disk
        answers 409 with code conflict; the title is unavailable.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaybackRequest" }
      responses:
        "201":
          description: Session started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaybackStream" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    get:
      operationId: listPlaybackSessions
      tags: [playback]
      summary: What the active profile is playing now, on any device, newest first.
      description: |
        The profile's open sessions on a movie, episode or YouTube video
        that reported a position or telemetry within the last 30 seconds,
        on every device of the household, this one included (`thisDevice`).
        Station sessions and songs are left out. A client asks with the
        title's `itemId` when its viewer presses Play or Resume: a session
        on another device is offered as "Playing on <deviceName> at m:ss"
        with Move here, Watch together and Cancel.
      parameters:
        - name: itemId
          in: query
          description: Only sessions playing this item.
          schema: { $ref: "#/components/schemas/Id" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Sessions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaybackSessionPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /playback/sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: getPlaybackSession
      tags: [playback]
      summary: One session of the active profile, open or ended, on any device of the household.
      description: |
        A player whose session a `playback` event reports as `moved` reads
        it for `movedToDeviceName`, closes and says "Moved to
        <movedToDeviceName>". Another profile's session answers 404.
      responses:
        "200":
          description: Session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaybackSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: endPlayback
      tags: [playback]
      parameters:
        - name: positionMs
          in: query
          description: The final position, recorded as a position report is before the session ends.
          schema: { type: integer, format: int64, minimum: 0 }
      responses:
        "204": { description: Ended; the server stops any encoder. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /playback/sessions/{sessionId}/move:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: movePlaybackSession
      tags: [playback]
      summary: Move here. Ends the active profile's session on another device so this one takes the title over.
      description: |
        The session ends as moved to the calling device, which the other
        device hears as a `playback` event with change `moved`. Its last
        reported position is already on the profile's watch state. The
        answer is the ended session; the caller then starts its own with
        startPlayback at its `positionMs`. A session of this device, a
        station session or one already ended answers 409; another
        profile's, 404.
      responses:
        "200":
          description: Ended there.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaybackSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /playback/sessions/{sessionId}/display:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    put:
      operationId: updatePlaybackDisplay
      tags: [playback]
      summary: The display changed mid-playback.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DisplayCapabilities" }
      responses:
        "200": { $ref: "#/components/responses/PlaybackUpdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /playback/sessions/{sessionId}/audio-route:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    put:
      operationId: updatePlaybackAudioRoute
      tags: [playback]
      summary: The audio route changed mid-playback.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AudioRouteCapabilities" }
      responses:
        "200": { $ref: "#/components/responses/PlaybackUpdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /playback/sessions/{sessionId}/network:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    put:
      operationId: updatePlaybackNetwork
      tags: [playback]
      summary: The network path or the user's quality cap changed mid-playback.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NetworkPathCapabilities" }
      responses:
        "200": { $ref: "#/components/responses/PlaybackUpdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /playback/sessions/{sessionId}/throughput:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    put:
      operationId: reportPlaybackThroughput
      tags: [playback]
      summary: Telemetry, sent every 10 seconds and on every stall.
      description: >-
        A position in the body is recorded as a position report is, before
        the floor decision. Telemetry, like a position report, keeps the
        session live: one with neither for 30 minutes is ended.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ThroughputTelemetry" }
      responses:
        "200": { $ref: "#/components/responses/PlaybackUpdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /playback/sessions/{sessionId}/tracks:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    put:
      operationId: selectPlaybackTracks
      tags: [playback]
      summary: The viewer picked another audio or subtitle track.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrackSelection" }
      responses:
        "200": { $ref: "#/components/responses/PlaybackUpdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /playback/sessions/{sessionId}/events:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: reportPlaybackEvent
      tags: [playback]
      summary: A stall, or a client failure that marks the entry in use bad and moves down the plan.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaybackEvent" }
      responses:
        "200": { $ref: "#/components/responses/PlaybackUpdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /playback/sessions/{sessionId}/position:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    put:
      operationId: reportPlaybackPosition
      tags: [playback]
      description: >-
        A position at or past 90% of the file's duration marks the item
        watched as setting watched does: the play count rises if it was not
        watched and the position returns to 0. A file of unknown duration is
        never marked this way. A position on an item already watched keeps it
        watched.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PositionReport" }
      responses:
        "204": { description: Recorded on the session and the profile's watch state. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /accounts:
    get:
      operationId: listAccounts
      tags: [admin]
      security:
        - device: [admin]
