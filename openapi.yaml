openapi: 3.1.0
info:
  title: Rabbit Ears API
  version: 0.24.0
  description: |
    REST API of the Rabbit Ears media server. This document's version is the
    server's. A breaking change takes a new path; additive changes bump the
    minor version.

    Authentication is a bearer token issued to one device at sign in, first
    run or join. A device shows one household: that of the adult who signed
    in on it, or another they are in that it moved to with moveDevice; a
    TV linked by code shows the household of the device that approved it.
    Kid accounts have no token: they are addressed as profiles through
    their adult's device token. Operations whose security lists the `admin`
    scope require the device's adult to be an admin. A device locked at
    Who's watching answers 403 `device_locked` to every operation not marked
    `x-while-locked`. An operation marked `x-replayable` may also run later,
    queued by a client while offline, through replaySyncActions.

    Every error response carries the Error schema. Lists are paged with
    `limit` and `offset`; a page carries `nextOffset` only when more follow.
    A request body over 1 MiB, or 16 MiB on an operation marked `x-upload`,
    answers 413 with code `payload_too_large`. A request body's member sent
    as null is taken as absent.

    Every id is an Id: a UUIDv7 in canonical lowercase form. A malformed id
    in a path, query or body answers 400. A create whose input has an
    optional `id` takes the client's choice, so a client can refer to the
    row before the server has answered; an id already in use answers 409.
    Ids are opaque: their order is not creation order.

    An image is fetched at the posterUrl, backdropUrl or headshotUrl the
    data carries; see getArtwork.
  license:
    name: MIT
    identifier: MIT
  contact:
    email: dev@legitimate.enterprises
servers:
  - url: /api/v2
security:
  - device: []

tags:
  - name: system
  - name: auth
  - name: profiles
  - name: libraries
  - name: items
  - name: people
  - name: media
  - name: playback
  - name: music
  - name: youtube
  - name: playlists
  - name: collections
  - name: together
  - name: stations
  - name: events
  - name: sync
  - name: downloads
  - name: admin

paths:
  /health:
    get:
      operationId: getHealth
      tags: [system]
      security: []
      responses:
        "200":
          description: Server is up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /attribution:
    get:
      operationId: getAttribution
      tags: [system]
      security: []
      summary: Credit text metadata providers require on an About screen.
      responses:
        "200":
          description: Attribution notice.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attribution" }

  /setup:
    post:
      operationId: setup
      tags: [auth]
      summary: First run. Creates the only admin, names the server, signs this device in.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupRequest" }
      responses:
        "201": { $ref: "#/components/responses/SignedIn" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /auth/sign-in:
    post:
      operationId: signIn
      tags: [auth]
      description: >-
        Ten failed sign-ins from one source address (an IPv6 source counts by
        its /64), or for one email from any sources, within ten minutes
        answer 429 to that source or for that email, even with the right
        password, until the oldest failure is ten minutes old. An email no
        account has counts the same. Devices signed in already are unaffected.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignInRequest" }
      responses:
        "201": { $ref: "#/components/responses/SignedIn" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/sign-out:
    post:
      operationId: signOut
      tags: [auth]
      summary: Revokes the calling device's token.
      x-while-locked: true
      responses:
        "204": { description: Signed out. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/sso-providers:
    get:
      operationId: listSsoOptions
      tags: [auth]
      summary: The enabled single sign-on providers, by name, for the sign-in page's buttons.
      security: []
      responses:
        "200":
          description: Providers.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SsoOption" }

  /auth/sso/{providerId}/start:
    parameters:
      - $ref: "#/components/parameters/SsoProviderId"
    get:
      operationId: startSso
      tags: [auth]
      summary: Sends the browser to the provider to sign in with the authorization code flow and PKCE.
      description: >-
        The redirect URI sent to the provider is this server's
        `/api/v2/auth/sso/callback` at the host the request names, over https
        when the connection is TLS or a reverse proxy on this host sent
        `X-Forwarded-Proto: https`. The cookie binds the sign-in to this
        browser for 10 minutes. A provider that is unknown, disabled or does
        not answer sends the browser back to the sign-in page with
        `#sso_error=provider_error`. When too many sign-ins are in flight,
        the one closest to expiring is dropped.
      security: []
      parameters:
        - name: returnTo
          in: query
          schema: { $ref: "#/components/schemas/SsoReturnTo" }
      responses:
        "302":
          description: To the provider, or back to the sign-in page.
          headers:
            Location:
              required: true
              schema: { type: string }
            Set-Cookie:
              required: true
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }

  /auth/sso/callback:
    get:
      operationId: finishSso
      tags: [auth]
      summary: Where every provider returns the browser after sign in.
      description: >-
        Redirects to `/` or `/admin/`, as the sign-in started, with
        `#sso=<code>`, a code for exchangeSsoCode that works once within a
        minute, and only from this browser, which the cookie now binds to it.
        On failure the fragment is `#sso_error=<reason>`: `expired`
        (unknown, used or expired state, or a browser other than the one
        that started), `provider_error` (the provider refused or its tokens
        failed verification), `not_allowed` (the required group is missing,
        or the account may not sign in) or `no_account` (no account is
        linked and none could be). Single sign-on never creates an account.
      security: []
      parameters:
        - name: state
          in: query
          schema: { type: string }
        - name: code
          in: query
          schema: { type: string }
        - name: error
          in: query
          schema: { type: string }
        - name: rabbit_ears_sso
          in: cookie
          schema: { type: string }
      responses:
        "302":
          description: Back to the sign-in page with the result in the fragment. The cookie binds a code to this browser; on failure it is cleared.
          headers:
            Location:
              required: true
              schema: { type: string }
            Set-Cookie:
              required: true
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }

  /auth/sso/exchange:
    post:
      operationId: exchangeSsoCode
      tags: [auth]
      summary: Exchanges a callback's one-time code for a device token, as signIn does.
      description: >-
        The code works only with the cookie the callback left this browser.
        An unknown, spent or expired code, or one sent without its cookie,
        answers 401 and is spent. Either way the cookie is cleared.
      security: []
      parameters:
        - name: rabbit_ears_sso
          in: cookie
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SsoExchangeRequest" }
      responses:
        "201":
          description: Device signed in.
          headers:
            Set-Cookie:
              required: true
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignInResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: The code or its cookie is wrong.
          headers:
            Set-Cookie:
              required: true
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /join/{code}:
    parameters:
      - $ref: "#/components/parameters/JoinCodeParam"
    get:
      operationId: getJoin
      tags: [auth]
      summary: Who sent this join link, before the invitee accepts.
      description: >-
        A code that is not usable answers 404 and counts toward the limit of
        `signIn`, as `acceptJoin`'s do, so ten from one source within ten
        minutes answer 429.
      security: []
      responses:
        "200":
          description: The pending account behind the code.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JoinPreview" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      operationId: acceptJoin
      tags: [auth]
      summary: Sets the password, consumes the code and signs this device in.
      description: >-
        A code that is not usable answers 404 and counts toward the limit of
        `signIn`, as `getJoin`'s do, so ten from one source within ten
        minutes answer 429.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcceptRequest" }
      responses:
        "201": { $ref: "#/components/responses/SignedIn" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /me:
    get:
      operationId: getMe
      tags: [auth]
      x-while-locked: true
      responses:
        "200":
          description: The calling device, its adult and household, and the profiles it may switch to.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/household:
    put:
      operationId: moveDevice
      tags: [profiles]
      summary: Moves the calling device to another household its signed-in adult is in.
      description: >-
        The device then shows that household: its Who's watching, its
        household stations, custom collections and devices. It acts as its
        signed-in adult again, unlocked, and its playback and Watch together
        end. That adult must be the active profile (403) and in the
        household (404); `SignInResult.households` lists theirs. In a
        household not their own they are `present` and manage nothing of it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceHouseholdInput" }
      responses:
        "204": { description: Moved. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /me/lock:
    post:
      operationId: lockDevice
      tags: [profiles]
      summary: Locks the calling device at Who's watching.
      description: |
        Called as Who's watching is shown. Until a profile is unlocked on
        this device, every operation not marked `x-while-locked` answers 403
        device_locked, whichever profile was active, so a profile with a PIN
        is reached only by entering it. Its open playback sessions and Watch
        together end, as on sign-out, so their stream URLs stop serving. The
        household's other devices are unaffected. Signing in starts unlocked.
      x-while-locked: true
      responses:
        "204": { description: Locked. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/password:
    put:
      operationId: changePassword
      tags: [auth]
      summary: Changes the password of the adult signed in on this device.
      description: |
        A wrong current password answers 403 and counts toward the limit of
        `signIn`, so ten failures from one source within ten minutes answer
        429. Every other device of the adult is signed out at once: its open
        playback sessions end and its next call answers 401. This device
        stays signed in.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChange" }
      responses:
        "204": { description: Changed. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /me/deletion:
    get:
      operationId: getAccountDeletion
      tags: [auth]
      summary: Says what deleting the active adult's own account takes with it.
      responses:
        "200":
          description: What goes with the account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountDeletion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: deleteOwnAccount
      tags: [auth]
      summary: Deletes the active adult's own account, as getAccountDeletion describes.
      description: |
        Needs the account's password again; a wrong one answers 403 and
        counts toward the limit of `signIn`, so ten failures from one source
        within ten minutes answer 429. A kid is refused. The server's only
        admin is refused with 409 until another account is an admin. Every
        device of the account, and every device acting as it, is signed out
        at once: its open playback sessions end and its next call, a held
        `listEvents` poll included, answers 401.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordConfirmation" }
      responses:
        "204": { description: Deleted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /local-checks:
    post:
      operationId: startLocalCheck
      tags: [playback]
      summary: Opens a check that the calling device is on the server's own network.
      description: |
        For a device that reaches the server at a public address. The check
        carries a one-time key and the addresses the server has on its own
        network; the device then calls `confirmLocalCheck` at one of those
        addresses. A check lives 60 seconds and confirms once. A device that
        confirmed within the last 15 minutes and sends
        `discoveredLocally: true` plays as at home, and may request its
        stream URLs at the address that confirmed.
      x-while-locked: true
      responses:
        "201":
          description: The open check.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalCheck" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /local-checks/{checkId}/confirmation:
    post:
      operationId: confirmLocalCheck
      tags: [playback]
      summary: Proves the device holds a check's key, from the server's own network.
      description: |
        Sent to one of the check's addresses, never through a proxy: the
        request must arrive from an address on the server's own network, or
        it answers 403 and the check stays open. It carries no token, so
        none crosses that network unencrypted. `proof` is the lowercase hex
        HMAC-SHA256, under the check's key, of `client:` followed by
        `nonce`. The reply's `proof` is the same over `server:` followed by
        `nonce`; a client that verifies it knows this is the server it
        signed in to.
      security: []
      parameters:
        - name: checkId
          in: path
          required: true
          schema: { type: string, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocalCheckProof" }
      responses:
        "200":
          description: Confirmed; the server's proof.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalCheckConfirmation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /device-links:
    post:
      operationId: createDeviceLink
      tags: [auth]
      summary: Link a TV. A device asks for a code that an adult signed in elsewhere approves.
      description: |
        The device shows the code and the QR image of `link`, then polls the
        link with its poll token every 5 seconds. A code lives 10 minutes and
        works once. At most 5 links from one source address are pending at a
        time; more answer 429.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceLinkInput" }
      responses:
        "201":
          description: The pending link and its poll token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceLinkCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    get:
      operationId: listDeviceLinks
      tags: [admin]
      security:
        - device: [admin]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Every household's links, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceLinkPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /device-links/{linkId}:
    parameters:
      - $ref: "#/components/parameters/DeviceLinkId"
    get:
      operationId: pollDeviceLink
      tags: [auth]
      summary: The device polls its link until an adult decides or the code expires.
      description: |
        The first poll after approval creates the device and carries its
        token, exactly once; from then on the link answers 404 to polls, so
        the token cannot be read twice. A device that loses that answer asks
        for a new link. A wrong poll token answers 404.
      security: []
      parameters:
        - $ref: "#/components/parameters/LinkToken"
      responses:
        "200":
          description: Where the link stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceLinkPoll" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteDeviceLink
      tags: [admin]
      summary: Deletes a link; a pending one stops working. A device it linked stays signed in.
      security:
        - device: [admin]
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /device-links/{linkId}/qr:
    parameters:
      - $ref: "#/components/parameters/DeviceLinkId"
    get:
      operationId: getDeviceLinkQr
      tags: [auth]
      summary: A QR code of the web `/link` URL carrying the code, for the device to show.
      security: []
      parameters:
        - $ref: "#/components/parameters/LinkToken"
      responses:
        "200":
          description: PNG image.
          content:
            image/png:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /link/{code}:
    parameters:
      - $ref: "#/components/parameters/JoinCodeParam"
    get:
      operationId: getDeviceLinkByCode
      tags: [auth]
      summary: The device behind a code, for an adult to recognize before approving.
      description: |
        Only the adult who signed in on the calling device, while their
        own profile is active; while a kid or another adult is active this
        and approving or denying answer 403. A code that is unknown, expired or already decided
        answers 404 and counts as a miss for the calling adult, as do
        misses on approve and deny. After 10 misses within 10 minutes that
        adult gets 429 until the window passes, so a code cannot be guessed
        within its life.
      responses:
        "200":
          description: The pending link behind the code.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceLinkPreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /link/{code}/approve:
    parameters:
      - $ref: "#/components/parameters/JoinCodeParam"
    post:
      operationId: approveDeviceLink
      tags: [auth]
      summary: >-
        Approves the code. The device's next poll signs it in as this adult,
        showing the household of the approving device; PINs still apply. An
        adult present in that household may not approve or deny.
      responses:
        "200":
          description: The approved link.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceLink" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /link/{code}/deny:
    parameters:
      - $ref: "#/components/parameters/JoinCodeParam"
    post:
      operationId: denyDeviceLink
      tags: [auth]
      summary: Refuses the code; the device's next poll reads denied.
      responses:
        "204": { description: Denied. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /household/adults:
    post:
      operationId: addHouseholdAdult
      tags: [profiles]
      summary: >-
        The household's owner adds an adult to it. They join with the code, then
        sign in to this household with their email and password.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HouseholdAdultInput" }
      responses:
        "201":
          description: The pending adult and the code to hand them.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HouseholdInvite" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /household/device-links:
    get:
      operationId: listHouseholdDeviceLinks
      tags: [profiles]
      summary: Links that adults of the device household approved or denied, newest first. Kids get 403.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Links.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceLinkPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /household/device-links/{linkId}:
    parameters:
      - $ref: "#/components/parameters/DeviceLinkId"
    delete:
      operationId: deleteHouseholdDeviceLink
      tags: [profiles]
      summary: An adult deletes one of the household's links. A device it linked stays signed in.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /household/linked-adults:
    get:
      operationId: listLinkedAdults
      tags: [profiles]
      summary: >-
        The adults an admin linked the active adult with, by name, whom they
        may offer profiles to. On a TV, only the links set for TVs. Kids get
        403. `email` and `householdId` are left out.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Linked adults.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /household/offers:
    get:
      operationId: listProfileOffers
      tags: [profiles]
      summary: >-
        The offers made to the active adult, and, to an adult of the device
        household who is not only present there, the offers of its profiles.
        Newest first. Kids get 403.
      responses:
        "200":
          description: Offers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileOfferList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createProfileOffer
      tags: [profiles]
      summary: Offers a profile of the device household to a linked adult, for their own household.
      description: >-
        An adult of the device household, not only present there, offers any
        profile of it: a kid in it, themself, or another adult whose own
        household it is; once the other adult accepts, the kid stands in
        their household too, or the adult is present there. The two must be
        linked by an admin, on a TV by a link set for TVs (403). A profile
        not in the household is 404; an adult only present in it, or a kid
        as the active profile, is 403. A profile already in the other adult's own
        household, a pending or revoked one, or a second offer of a profile
        to one adult is 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileOfferInput" }
      responses:
        "201":
          description: Offered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileOffer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /household/offers/{offerId}:
    parameters:
      - $ref: "#/components/parameters/OfferId"
    delete:
      operationId: deleteProfileOffer
      tags: [profiles]
      summary: >-
        The adult offered to declines, or an adult of the offering household,
        not only present there, withdraws. An offer the active profile does
        not list is 404.
      responses:
        "204": { description: Declined or withdrawn. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /household/offers/{offerId}/accept:
    parameters:
      - $ref: "#/components/parameters/OfferId"
    post:
      operationId: acceptProfileOffer
      tags: [profiles]
      summary: >-
        The adult offered to accepts: the profile joins their own household,
        and the offer goes. Only they accept (403); an offer they do not list
        is 404. A link no longer holding on this TV is 403; a profile no
        longer to be had, as one revoked, is 409.
      responses:
        "204": { description: In their household. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /profiles:
    get:
      operationId: listProfiles
      tags: [profiles]
      summary: Everyone in the device household, owner first, then adults, then kids.
      description: |
        A profile may be in several households: a kid shared with another
        household stands in each alike, and an adult of another household
        may be `present` here. Pending adults are listed only while the
        owner is the active profile, with the expiry of their usable join
        code. What the active profile may do follows from
        `Me.household.adultId` and kinds: any adult of the household edits
        kids and their PINs; each adult sets their own PIN; only the owner
        adds adults, resends a pending adult's code, removes any member
        other than themselves, and makes a kid an adult. No adult is ever
        made a kid. A kid may do none of it, and neither may a present
        adult: every operation that changes another profile, the
        household's adults and invites, its device links, its profile
        offers or its custom collections answers them 403, while their own
        PIN, preferences, watch state and playlists stay theirs.
      responses:
        "200":
          description: Profiles.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createProfile
      tags: [profiles]
      summary: Adds a kid to the device household. Missing ceilings under ratings are suggested from the birthday.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileInput" }
      responses:
        "201":
          description: Created kid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /profiles/{profileId}:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    get:
      operationId: getProfile
      tags: [profiles]
      description: A pending adult is not found unless the owner is the active profile.
      responses:
        "200":
          description: Profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: replaceProfile
      tags: [profiles]
      summary: Replaces a kid's name, birthday and filter. Adults edit themselves through admin.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileInput" }
      responses:
        "200":
          description: Updated kid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteProfile
      tags: [profiles]
      summary: >-
        Deletes a kid and their watch history. Only the owner deletes another
        adult, which signs their devices out; the owner cannot be deleted here.
      description: >-
        A profile another household holds too only leaves the device
        household, as deleteHouseholdMember does, and keeps all its data:
        devices here acting as it go back to Who's watching, and an adult's
        own devices here sign out. Any adult of the household removes an
        adult `present` in it, and a present adult may remove themself. A
        profile deleted from its last household is deleted.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /profiles/{profileId}/pin:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    put:
      operationId: setProfilePin
      tags: [profiles]
      summary: Sets or resets the PIN of the active adult or a kid in the device household.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PinRequest" }
      responses:
        "204": { description: PIN set; failures and lock cleared. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: clearProfilePin
      tags: [profiles]
      responses:
        "204": { description: PIN removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /profiles/{profileId}/unlock:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    post:
      operationId: unlockProfile
      tags: [profiles]
      summary: Switches the device to a profile of its household.
      description: |
        Listings, details and playback then answer as that profile. A profile
        with a PIN needs it (403 pin_required without one); five wrong PINs
        lock it for 15 minutes (403 pin_locked). While a kid is active, only
        that kid's profile is reachable and adult-only operations answer 403.
        Success also unlocks a device locked at Who's watching; a refusal
        leaves it locked.
      x-while-locked: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnlockRequest" }
      responses:
        "204": { description: Unlocked on this device. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /profiles/{profileId}/join-code:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    post:
      operationId: resendProfileJoinCode
      tags: [profiles]
      summary: The owner gives a pending adult a new 7-day code, revoking their unused ones.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JoinCodeResendInput" }
      responses:
        "201":
          description: The pending adult and the new code to hand them.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HouseholdInvite" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /profiles/{profileId}/make-adult:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    post:
      operationId: makeProfileAdult
      tags: [profiles]
      summary: >-
        The owner turns a kid into a pending adult of the same household,
        keeping their watch state. They join with the code like any added adult.
        A kid shared with other households leaves them: the device household
        becomes their own and only one.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MakeAdultInput" }
      responses:
        "201":
          description: The pending adult and the code to hand them.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HouseholdInvite" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /profiles/{profileId}/preferences:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    put:
      operationId: setProfilePreferences
      tags: [profiles]
      summary: Sets a profile's color and autoplay, and the active adult's own hideKidsContent.
      description: >-
        The active adult sets their own color, autoplay and
        hideKidsContent, and the color and autoplay of any kid of the
        household. An active kid sets their own autoplay only. Another
        adult's profile, a kid's hideKidsContent, and anything else while
        a kid is active answer 403.
      x-replayable: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfilePreferences" }
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /profiles/{profileId}/avatar:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    get:
      operationId: getProfileAvatar
      tags: [profiles]
      summary: An adult's Gravatar picture, which Account.avatarUrl points at.
      description: >-
        The server keeps a copy and refreshes it daily. Not found for a
        kid, for an adult without a Gravatar, and while the gravatar
        setting is off. Any profile of the device household, or an adult
        linked with the active profile; it answers while the device is
        locked, for Who's watching.
      x-while-locked: true
      responses:
        "200":
          description: Image bytes.
          headers:
            Cache-Control:
              required: true
              schema: { type: string }
          content:
            image/*:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /ratings/suggestion:
    get:
      operationId: suggestCeilings
      tags: [profiles]
      summary: Rating ceilings suggested for a kid born on this date, for the Add a kid form.
      parameters:
        - name: birthday
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Suggested ceilings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CeilingSuggestion" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /profiles/{profileId}/allowed-items:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    get:
      operationId: listAllowedItems
      tags: [profiles]
      summary: A kid's manual allow list. An allowed show or season allows its episodes, an allowed YouTube channel its videos.
      responses:
        "200":
          description: Allowed item IDs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AllowList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /profiles/{profileId}/allowed-items/{itemId}:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
      - $ref: "#/components/parameters/ItemId"
    put:
      operationId: allowItem
      tags: [profiles]
      x-replayable: true
      responses:
        "204": { description: Allowed; idempotent. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: disallowItem
      tags: [profiles]
      x-replayable: true
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /profiles/{profileId}/favorites:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
      - $ref: "#/components/parameters/Limit"
      - $ref: "#/components/parameters/Offset"
    get:
      operationId: listFavorites
      tags: [profiles]
      summary: The profile's favorites, most recently favorited first, then by item id.
      description: >-
        Only items the profile browses: a favorite hidden from it, as by a
        kid's ceilings, is kept and listed again once it may be seen. An
        adult with hideKidsContent is not listed kids' content
        (Item.kidsContent, YouTubeChannel.forKids).
      parameters:
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/FavoriteKind" }
      responses:
        "200":
          description: Favorites.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FavoritePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /profiles/{profileId}/favorites/{itemId}:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
      - $ref: "#/components/parameters/ItemId"
    put:
      operationId: putFavorite
      tags: [profiles]
      summary: Favorite an item of a FavoriteKind the profile may see.
      x-replayable: true
      parameters:
        - name: at
          in: query
          description: >-
            When it was favorited, as a device that was offline knows it;
            absent is now, and a time ahead of the server's is taken as now.
            An item already a favorite keeps its createdAt.
          schema: { type: string, format: date-time }
      responses:
        "204": { description: Favorited; idempotent. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteFavorite
      tags: [profiles]
      x-replayable: true
      parameters:
        - name: at
          in: query
          description: >-
            When it was unfavorited, as a device that was offline knows it; a
            time ahead of the server's is taken as now. A favorite made later
            stays, and the answer is still 204.
          schema: { type: string, format: date-time }
      responses:
        "204": { description: "Removed; idempotent, also for an item that is gone or hidden." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /profiles/{profileId}/watch-state:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
      - $ref: "#/components/parameters/Limit"
      - $ref: "#/components/parameters/Offset"
    get:
      operationId: listWatchStates
      tags: [profiles]
      summary: The profile's watch state, most recently played first.
      description: An adult with hideKidsContent is not listed kids' content (Item.kidsContent, YouTubeChannel.forKids).
      parameters:
        - name: parentId
          in: query
          description: >-
            Only the states of items under this one: a show's seasons and
            episodes, or a season's episodes.
          schema: { $ref: "#/components/schemas/Id" }
      responses:
        "200":
          description: Watch states.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatchStatePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /profiles/{profileId}/watch-state/{itemId}:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
      - $ref: "#/components/parameters/ItemId"
    get:
      operationId: getWatchState
      tags: [profiles]
      responses:
        "200":
          description: Watch state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatchState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: putWatchState
      tags: [profiles]
      summary: Mark watched or unwatched, or set a resume position.
      x-replayable: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WatchStateInput" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatchState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteWatchState
      tags: [profiles]
      x-replayable: true
      parameters:
        - name: at
          in: query
          description: >-
            When it was forgotten, as a device that was offline knows it; a
            time ahead of the server's is taken as now. A state that changed
            later stays, and the answer is still 204.
          schema: { type: string, format: date-time }
      responses:
        "204": { description: Forgotten. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /profiles/{profileId}/watch-state/{itemId}/plays:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
      - $ref: "#/components/parameters/ItemId"
    post:
      operationId: recordPlay
      tags: [profiles]
      summary: Count one finished play the server did not see.
      description: >-
        For a play the server did not stream, such as of a downloaded file,
        sent once per play when it ends. playCount goes up by one, and
        lastPlayedAt becomes the latest play, in whatever order plays and
        putWatchState arrive. Over a state that changed no later than at,
        the item is watched and resumes from the start of the edition
        played; a state that changed later stays. Playback the server
        streams counts a play only when it marks the item watched, so a
        client sends no putWatchState with watched true for a play it
        records.
      x-replayable: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlayInput" }
      responses:
        "200":
          description: The state with the play counted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatchState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /profiles/{profileId}/show-progress:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
      - $ref: "#/components/parameters/Limit"
      - $ref: "#/components/parameters/Offset"
    get:
      operationId: listShowProgress
      tags: [profiles]
      summary: The profile's progress through each show it may see, by Item.sortTitle.
      description: >-
        Counts and the next episode cover only the seasons and episodes the
        profile may see. Episodes play in season order, specials (season 0
        or none) last, then by episode number. An adult with hideKidsContent is not listed kids' content (Item.kidsContent, YouTubeChannel.forKids).
      responses:
        "200":
          description: Show progress.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShowProgressPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /profiles/{profileId}/up-next/{itemId}:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
      - $ref: "#/components/parameters/ItemId"
    get:
      operationId: getUpNext
      tags: [profiles]
      summary: What plays when a movie, episode or video ends.
      description: >-
        From a playlist, the next row of its play order (listPlaylistPlayOrder):
        after row index when given, else after the item's first row. Otherwise
        an episode's next episode in play order, seasons by number with
        specials (season 0 or none) last, then by episode number; a movie's
        next movie in its TMDB collection as listCollectionMovies orders
        them; a video's next video in its channel by publish date, oldest
        first. Only what the active profile may see and with a file on disk
        counts; anything else is skipped. A client asks for neither a
        station nor a Watch together, which close at their end.
      parameters:
        - name: playlistId
          in: query
          description: The playlist the item was played from, a row of its play order.
          schema: { $ref: "#/components/schemas/Id" }
        - name: index
          in: query
          description: The row of the play order playing, counted from 0; with playlistId only.
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: The next item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpNext" }
        "204": { description: Nothing follows. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # Bulk actions on a selection: one request for many items.
  /profiles/{profileId}/watch-state/batch:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    put:
      operationId: putWatchStates
      tags: [profiles]
      summary: Mark many watched, or unwatched, at once.
      description: >-
        Marks each item as `putWatchState` does with positionMs 0: a movie,
        episode or YouTube video itself, a show or season every episode of
        it the profile may see, a channel every video of it. Another kind
        answers 400 with the field itemIds; an item the profile may not see
        is not found. Nothing is marked unless every item may be.
      x-replayable: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WatchStateBatchInput" }
      responses:
        "204": { description: Every item marked. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /items/kids-content/batch:
    put:
      operationId: setKidsContents
      tags: [items]
      summary: Marks many movies, shows and YouTube channels as kids' content or not.
      description: >-
        A movie or show is set as `setKidsContent` sets it, a channel as
        `setYouTubeChannelForKids` does. Any adult; while a kid is active
        this answers 403. Any other kind of item is not found, and nothing
        is set unless every item may be.
      x-replayable: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KidsContentBatchInput" }
      responses:
        "204": { description: Every item set. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /profiles/{profileId}/playlists/{playlistId}/entries/batch:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
      - $ref: "#/components/parameters/PlaylistId"
    post:
      operationId: addPlaylistEntries
      tags: [playlists]
      summary: Add many to a playlist, appended in order.
      description: >-
        Each entry is checked as `addPlaylistEntry` checks it, and its
        position and rank are ignored: the entries take the ranks of
        generateNKeysBetween after the last entry's; a title of several editions without an
        editionId takes its default edition. A station's own playlist is
        written through its owner's profile, as `addPlaylistEntry` writes
        it. Nothing is added unless every entry may be.
      x-replayable: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaylistEntriesInput" }
      responses:
        "204": { description: Every entry added. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /libraries:
    get:
      operationId: listLibraries
      tags: [libraries]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Libraries by name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createLibrary
      tags: [libraries, admin]
      security:
        - device: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LibraryInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Library" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /libraries/{libraryId}:
    parameters:
      - $ref: "#/components/parameters/LibraryId"
    get:
      operationId: getLibrary
      tags: [libraries]
      responses:
        "200":
          description: Library.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Library" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: replaceLibrary
      tags: [libraries, admin]
      security:
        - device: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LibraryInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Library" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteLibrary
      tags: [libraries, admin]
      description: |
        Deletes the library and every title in it as deleteItem does each:
        their files' records, watch state, allow-list entries and playlist,
        collection and station entries go, and so do the seek previews and
        chapter thumbnails made from the files. The files in its folders
        stay on disk, and no other library changes.
      security:
        - device: [admin]
      responses:
        "204": { description: Deleted with its items. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /libraries/{libraryId}/folders:
    parameters:
      - $ref: "#/components/parameters/LibraryId"
    get:
      operationId: listLibraryFolders
      tags: [libraries, admin]
      security:
        - device: [admin]
      responses:
        "200":
          description: The library's folders by path.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FolderPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: addLibraryFolder
      tags: [libraries, admin]
      description: Requests the library's scan, which reads the new path.
      security:
        - device: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FolderInput" }
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Folder" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /libraries/{libraryId}/folders/{folderId}:
    parameters:
      - $ref: "#/components/parameters/LibraryId"
      - name: folderId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/Id" }
    get:
      operationId: getLibraryFolder
      tags: [libraries, admin]
      security:
        - device: [admin]
      responses:
        "200":
          description: Folder.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Folder" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: replaceLibraryFolder
      tags: [libraries, admin]
      description: |
        Gives the folder a new path. Its files stay until the library's
        scan, which this requests, reads the new path and marks those it
        does not find missing.
      security:
        - device: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FolderInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Folder" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: removeLibraryFolder
      tags: [libraries, admin]
      description: Requests the library's scan, which marks the folder's files missing.
      security:
        - device: [admin]
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /search:
    get:
      operationId: search
      tags: [items]
      summary: Everything matching a query, for the Search page.
      description: |
        Movies and shows by their parsed or provider title, episodes by
        their provider title, people by name, artists, albums and songs by
        name or title, YouTube channels and videos by title: each a
        case-insensitive substring, a prefix match before the rest, then
        by title. Every list is filtered as its own listing is for the
        active profile: a kid's filter, an adult's hideKidsContent.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: limit
          in: query
          description: The most matches in each list.
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Matches.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /items:
    get:
      operationId: listItems
      tags: [items]
      description: |
        Movies, shows, seasons and episodes. Music and YouTube items are
        served by the music and youtube operations; every operation on
        `/items/{itemId}` that answers an Item finds only these four kinds,
        while artwork, watch state, playlists and playback take any item.
        An adult with hideKidsContent is not listed kids' content (Item.kidsContent, YouTubeChannel.forKids).
      parameters:
        - name: libraryId
          in: query
          schema: { $ref: "#/components/schemas/Id" }
        - name: parentId
          in: query
          schema: { $ref: "#/components/schemas/Id" }
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/ItemKind" }
        - name: q
          in: query
          description: >-
            Case-insensitive substring of a movie's or show's parsed or provider
            title, or of an episode's provider title. Seasons never match.
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: genreId
          in: query
          schema: { $ref: "#/components/schemas/Id" }
        - name: personId
          in: query
          description: Items crediting this person in cast or crew.
          schema: { $ref: "#/components/schemas/Id" }
        - name: occasionId
          in: query
          description: Members of this occasion (listOccasionMembers).
          schema: { $ref: "#/components/schemas/Id" }
        - name: resolution
          in: query
          description: >-
            uhd, the 4K chip: only movies and episodes with a file whose video
            is at least 3200 wide or 2000 tall, and shows and seasons with
            such an episode.
          schema: { $ref: "#/components/schemas/Resolution" }
        - name: sort
          in: query
          schema: { $ref: "#/components/schemas/ItemSort" }
        - name: kidsContent
          in: query
          description: >-
            true lists only kids' content (Item.kidsContent), and does so
            for an adult with hideKidsContent too. A kid's own ceilings and
            allow list still apply. Omit it otherwise; false is the same.
          schema: { type: boolean }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Items in `sort` order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createItem
      tags: [items, admin]
      security:
        - device: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ItemInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /items/{itemId}:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    get:
      operationId: getItem
      tags: [items]
      responses:
        "200":
          description: Item with its provider metadata when matched.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: replaceItem
      tags: [items, admin]
      security:
        - device: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ItemInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteItem
      tags: [items, admin]
      security:
        - device: [admin]
      responses:
        "204": { description: Deleted with its children and files. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /items/{itemId}/metadata:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    put:
      operationId: putItemMetadata
      tags: [items, admin]
      summary: Sets provider metadata by hand (a manual match), stored as the item's remote data.
      description: |
        A providerId other than the one the item had is a rematch: its
        identity reviews end, a show's episodes lose their remote data, and
        the metadata task then fetches the title's own details, artwork,
        rating, genres, credits and episodes over what was sent.
      security:
        - device: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ItemMetadata" }
      responses:
        "200":
          description: Item with its metadata as the metadata settings show it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteItemMetadata
      tags: [items, admin]
      summary: Unmatches an item, dropping its remote data; the next lookup fetches again while the settings use remote data.
      security:
        - device: [admin]
      responses:
        "204": { description: Unmatched. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /artwork/{store}/{name}:
    parameters:
      - name: store
        in: path
        required: true
        schema: { $ref: "#/components/schemas/ArtworkStore" }
      - name: name
        in: path
        required: true
        schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,128}\.(jpg|png|webp)$' }
    get:
      operationId: getArtwork
      tags: [items]
      summary: The image a posterUrl, backdropUrl or headshotUrl names.
      description: >-
        An address names one image and never another, so the answer is
        cached for a year, immutable; when what a title, collection or
        person shows changes, the data carries a new address. Clients never
        build one. Any device of the server may fetch any address; which
        profile is shown an address is decided by the data that carries it.
      parameters:
        - name: If-None-Match
          in: header
          schema: { type: string }
      responses:
        "200":
          description: Image bytes.
          headers:
            ETag:
              required: true
              schema: { type: string }
            Cache-Control:
              required: true
              schema: { type: string }
          content:
            image/*:
              schema: { type: string, format: binary }
        "304":
          description: The client's copy, named by If-None-Match, is current.
          headers:
            ETag:
              required: true
              schema: { type: string }
            Cache-Control:
              required: true
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /items/{itemId}/artwork/{kind}:
    parameters:
      - $ref: "#/components/parameters/ItemId"
      - name: kind
        in: path
        required: true
        schema: { $ref: "#/components/schemas/ArtworkKind" }
    get:
      operationId: getItemArtwork
      tags: [items]
      summary: The item's image, or its nearest ancestor's when it has none.
      deprecated: true
      description: >-
        The image Item.posterUrl or backdropUrl names, cached for a day and
        revalidated; kept because released clients use it.
      parameters:
        - name: If-None-Match
          in: header
          schema: { type: string }
      responses:
        "200":
          description: Image bytes, cached by the server from the metadata provider.
          headers:
            ETag:
              required: true
              schema: { type: string }
            Cache-Control:
              required: true
              schema: { type: string }
          content:
            image/*:
              schema: { type: string, format: binary }
        "304":
          description: The client's copy, named by If-None-Match, is current.
          headers:
            ETag:
              required: true
              schema: { type: string }
            Cache-Control:
              required: true
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /items/{itemId}/credits:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    get:
      operationId: getItemCredits
      tags: [items, people]
      responses:
        "200":
          description: Cast in billing order and key crew (directors and writers of a movie, creators of a show).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemCredits" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: replaceItemCredits
      tags: [items, people, admin]
      summary: Replaces an item's credits by hand; the next metadata refresh of a matched item replaces them again.
      security:
        - device: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ItemCreditsInput" }
      responses:
        "200":
          description: The new credits.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemCredits" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /items/{itemId}/related:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    get:
      operationId: getItemRelated
      tags: [items]
      responses:
        "200":
          description: What relates to a movie or episode, as the active profile browses; other kinds have empty lists and no neighbors.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemRelated" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /items/{itemId}/playability:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    post:
      operationId: checkPlayability
      tags: [playback]
      summary: How this device would play a movie, episode, YouTube video or song now, as the active profile.
      description: |
        Decides exactly as starting playback does from the same snapshot, but
        opens no session and takes no transcode slot, so it ignores how busy
        the server is.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CapabilitySnapshot" }
      responses:
        "200":
          description: The verdict play would start with.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Playability" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /items/{itemId}/kids-content:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    put:
      operationId: setKidsContent
      tags: [items]
      summary: Marks a movie or show as kids' content or not, whatever its rating.
      description: Any adult; while a kid is active this answers 403. Any other kind of item is not found.
      x-replayable: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KidsContentInput" }
      responses:
        "200":
          description: The item with kidsContent and kidsContentOverride.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }
    delete:
      operationId: clearKidsContent
      tags: [items]
      summary: Clears the override, so the rating decides again.
      description: Any adult; while a kid is active this answers 403. Any other kind of item is not found.
      x-replayable: true
      responses:
        "204": { description: Cleared; idempotent. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /items/{itemId}/allowed-for:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    get:
      operationId: listAllowedFor
      tags: [profiles]
      summary: Which kids on a manual allow list allow this movie, show or YouTube channel, for an item menu's Allow for.
      description: >-
        Pair with allowItem and disallowItem per kid. While a kid is active
        this answers 403.
      responses:
        "200":
          description: Kid profile ids.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AllowedFor" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /genres:
    get:
      operationId: listGenres
      tags: [items]
      summary: Genres by name. A kid sees only genres of items visible to them.
      parameters:
        - name: libraryId
          in: query
          description: Only genres of items in this library.
          schema: { $ref: "#/components/schemas/Id" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Genres by name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenrePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createGenre
      tags: [items, admin]
      security:
        - device: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenreInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Genre" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
