  # Offline downloads: a device resolves what a request covers, claims each
  # title's file, fetches it with its text subtitles, and syncs what it
  # keeps.
  /profiles/{profileId}/downloads/resolve:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    post:
      operationId: resolveDownloads
      tags: [downloads]
      summary: What downloading the targets at a quality would keep on this device.
      description: |
        A movie, episode, song or YouTube video stands for itself, playing
        editionId or else its default edition; a show, season, artist,
        album or channel for its episodes, songs or videos as they are now,
        in play order, a channel's by publish date, oldest first; a
        collection for its movies in release order; a playlist the profile
        owns or is shared for its play order. Titles come once each, in
        target order, and only those the profile may see; a target it may
        not see answers 404, as one that does not exist does. A request
        covering more than 5000 titles answers 400 with the field targets.

        Each title says what this device, as snapshot describes it, would
        keep at quality: the file itself when it plays it (direct_play,
        sizeBytes exact), else one MP4, or an M4A for a song, that the
        server converts (sizeBytes estimated). The snapshot's network group
        is not read. A size converts the picture to that rung, never above
        the source, with stereo AAC; a size no smaller than the source is
        original. For a song every quality but original is aac256: a
        lossless song becomes AAC at 256 kb/s and a lossy one stays itself.
        original is the file itself, converted only when the device does
        not play it, as is aac256 asked of a video. A title with no file on
        disk, or none the device plays in any form, is available false.

        A client confirms a large request with sizeBytes, and keeps a
        standing request, such as a show's next unwatched episodes or a
        playlist, by resolving it again and comparing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DownloadResolveInput" }
      responses:
        "200":
          description: The titles.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DownloadResolution" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /profiles/{profileId}/downloads/sync:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    post:
      operationId: syncDownloads
      tags: [downloads]
      summary: Which of the titles a device keeps for the profile it may still keep.
      description: |
        Every id given is in keep or in remove. A title the profile may no
        longer see, under its kid filters as they are now, or that no
        longer exists, is in remove, and the device deletes its file. A
        client syncs each profile's downloads whenever it is online with
        that profile active. A 404 for the profile itself means it is gone,
        and a 401 that the device is signed out: either way the device
        deletes every download the profile, or the device, keeps.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DownloadSyncInput" }
      responses:
        "200":
          description: The titles to keep and to remove.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DownloadSync" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /profiles/{profileId}/downloads:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    get:
      operationId: listDownloads
      tags: [downloads]
      summary: This device's downloads for the profile, oldest first.
      description: Only downloads of titles the profile may still see are listed.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Downloads.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DownloadPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createDownload
      tags: [downloads]
      summary: Claims one title's file for the profile on this device.
      description: |
        The item is a movie, episode, song or YouTube video the profile may
        see; its file is decided as resolveDownloads decides it, with
        audioTrackId or else the default audio track. The file itself is
        ready at once. A conversion is queued: the client polls getDownload
        every few seconds until status is ready, then fetches url, or
        fetches the file with wait=1 at once, as Download describes. Asked
        again for the same file, the answer is the same download.

        Conversions are made one at a time, and only while no live video
        transcode is encoding: one running pauses for live playback, and
        none takes a live transcode slot. The devices with conversions
        queued take turns, the one served longest ago first, each served in
        the order it claimed; a conversion several devices claim is a turn
        for each. A conversion that failed is status failed with an error;
        asking again queues it again. One a restart interrupted starts
        again.

        A download goes 3 days after it was made or its conversion finished,
        whichever is later, or when deleted; its conversion goes when no
        download needs it. A title with no file on disk this device can
        keep answers 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DownloadInput" }
      responses:
        "201":
          description: The download.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Download" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /profiles/{profileId}/downloads/batch:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    post:
      operationId: createDownloads
      tags: [downloads]
      summary: Claims many titles' files for the profile on this device, in order.
      description: |
        Claims each title as createDownload claims it, at the one quality
        and snapshot given, in request order, so the conversions they need
        queue in that order for this device. A title already claimed
        answers the same download, in its place in the queue.

        Each title answers on its own, in request order: download, or error
        with the code and message createDownload would answer: not_found
        for a title the profile may not see or that does not exist, or an
        edition of another item, bad_request for an item that is no title,
        conflict for a title with no file on disk this device can keep.
        One title's error claims the others all the same.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DownloadBatchInput" }
      responses:
        "200":
          description: What each title answered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DownloadBatch" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /profiles/{profileId}/downloads/{downloadId}:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
      - $ref: "#/components/parameters/DownloadId"
    get:
      operationId: getDownload
      tags: [downloads]
      summary: One of this device's downloads for the profile.
      description: A download of another device, or of a title the profile may no longer see, is not found.
      responses:
        "200":
          description: The download.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Download" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteDownload
      tags: [downloads]
      summary: The device is done with a download, fetched or not.
      description: >-
        The server forgets it, and stops and removes its conversion when no
        other download needs it. What the device keeps is its own.
      responses:
        "204": { description: Forgotten. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /conversions:
    get:
      operationId: listConversions
      tags: [admin]
      security:
        - device: [admin]
      summary: The files the server is making or has made for downloads, newest first.
      parameters:
        - name: active
          in: query
