        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: replaceAccount
      tags: [admin]
      summary: Edits, promotes, revokes or restores an account. Kind is fixed at creation; the last active admin cannot be demoted or revoked (409).
      security:
        - device: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteAccount
      tags: [admin]
      security:
        - device: [admin]
      responses:
        "204": { description: Deleted with everything it owns. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /accounts/{accountId}/password:
    parameters:
      - name: accountId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/Id" }
    put:
      operationId: setAccountPassword
      tags: [admin]
      summary: Replaces an adult's password, such as with a temporary one after they forgot theirs. Kids, pending and revoked adults answer 409.
      description: >-
        Every device of the adult is signed out at once, but the calling one
        when the adult is the caller: its open playback sessions end and its
        next call answers 401.
      security:
        - device: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordInput" }
      responses:
        "204": { description: Set. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /accounts/{accountId}/identities:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    get:
      operationId: listAccountIdentities
