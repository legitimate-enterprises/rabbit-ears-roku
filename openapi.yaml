        kind: { type: string, minLength: 1 }
        intervalSeconds: { type: integer, minimum: 1 }
        enabled: { type: boolean, default: true }
        nextRunAt: { type: string, format: date-time }

    TaskPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Task" }
        nextOffset: { type: integer }

    LogLevel:
      type: string
