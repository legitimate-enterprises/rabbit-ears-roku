      properties:
        id: { $ref: "#/components/schemas/Id" }
        at: { type: string, format: date-time }
        level: { $ref: "#/components/schemas/LogLevel" }
        source: { type: string, description: "Subsystem: scan, tmdb, playback, transcode, task, auth, http or server." }
        message: { type: string }
        sessionId: { $ref: "#/components/schemas/Id" }
        itemId: { $ref: "#/components/schemas/Id" }
        ffmpegCommand: { type: string, description: The exact command line an encoder was started with. }
        transcodeReason: { type: string, description: Why the playback decision was not direct play. }

    LogEntryPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/LogEntry" }
        nextOffset: { type: integer }

    TaskRun:
      type: object
      required: [id, taskId, status, progress, startedAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        taskId: { $ref: "#/components/schemas/Id" }
        status: { $ref: "#/components/schemas/TaskRunStatus" }
        progress: { type: number, format: double, minimum: 0, maximum: 1 }
        error: { type: string }
        summary: { type: string, description: "One line on what the run did, such as 3 movies added. Absent when the task reports none." }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }

    TaskRunPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/TaskRun" }
        nextOffset: { type: integer }

    Session:
      type: object
      required: [id, deviceId, accountId, itemId, mediaFileId, positionMs, currentEntry, plan, encoder, startedAt, modifiedAt, createdAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        deviceId: { $ref: "#/components/schemas/Id" }
        accountId: { $ref: "#/components/schemas/Id" }
        itemId: { $ref: "#/components/schemas/Id" }
        mediaFileId: { $ref: "#/components/schemas/Id" }
        positionMs: { type: integer, format: int64 }
        currentEntry: { type: integer, description: Position of the plan entry in use. }
        plan:
          type: array
          items: { $ref: "#/components/schemas/PlanEntry" }
        encoder:
          type: string
          enum: [videotoolbox, software, none]
          description: Video encoder of the entry in use; none for direct play and copied video.
        transcodeReason:
          type: string
          description: Why the entry in use is not direct play. Known only for sessions this server process started.
        startedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        modifiedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }

    Settings:
      type: object
      description: |
        Server settings. Only serverName, tasksPaused, gravatar, the
        read-ahead, the transcode limit and cache cap, the metadata source
        and mode, and the write-only TMDB key are editable.
      required: [serverName, tasksPaused, dataDir, port, databasePath, storage, hardware, metadata, maxTranscodes, transcodeCacheCapBytes, readAheadSeconds]
      properties:
        serverName: { type: string }
        tasksPaused:
          type: boolean
          description: Pause all. While true, scheduled and file-change task runs wait; running tasks finish and Run now still runs.
        dataDir: { type: string, description: "Where caches, artwork and thumbnails live; RABBIT_EARS_DATA sets it at start-up." }
        port: { type: integer, description: The TCP port the server listens on; RABBIT_EARS_PORT sets it at start-up. }
        databasePath: { type: string, description: The database file; RABBIT_EARS_DB sets it at start-up. }
        storage: { $ref: "#/components/schemas/StorageFacts" }
        hardware: { $ref: "#/components/schemas/HardwareFacts" }
        metadata: { $ref: "#/components/schemas/MetadataSources" }
        maxTranscodes:
          type: integer
          minimum: 1
          maximum: 8
          description: >-
            Simultaneous video transcodes. It starts at 3. Lowering it stops
            none running; new ones wait until fewer run than it allows.
        transcodeCacheCapBytes:
          type: integer
          format: int64
          minimum: 1000000000
          maximum: 1000000000000
          description: >-
            Bytes the transcode cache holds before the segments of sessions
            not converting are deleted, oldest first; the same value as
            storage.transcodeCacheCapBytes. It starts at 20 GB, 20000000000 bytes.
        readAheadSeconds:
          type: integer
          minimum: 30
          maximum: 600
          description: >-
            How far past the newest segment a player fetched a converted
            or remuxed stream is prepared before its encoder pauses, and the
            forward buffer players are asked to hold
            (PlaybackStream.bufferGoalSeconds). It starts at 300. A station's
            stream, which lists only what airs next, and a download's
            conversion, which runs to its end, do not follow it.
        gravatar:
          type: boolean
          description: >-
            Always present. Whether adults with a Gravatar show it as their
            picture (Account.avatarUrl). The server fetches and caches each
            picture; clients never contact gravatar.com.

    SettingsInput:
      type: object
      required: [serverName]
      properties:
        serverName: { type: string, minLength: 1, maxLength: 100 }
        tasksPaused: { type: boolean, description: "True pauses all tasks, false resumes them, and absent keeps the stored value." }
        gravatar: { type: boolean, description: Absent keeps the setting; it starts off. }
        readAheadSeconds:
          type: integer
          minimum: 30
          maximum: 600
          description: Absent keeps the setting. Streams playing now follow it from their next segment.
        maxTranscodes:
          type: integer
          minimum: 1
          maximum: 8
          description: Absent keeps the setting. Transcodes running now continue.
        transcodeCacheCapBytes:
          type: integer
          format: int64
          minimum: 1000000000
          maximum: 1000000000000
          description: Absent keeps the setting. A lower cap is applied at once.
        tmdbKey:
          type: string
          maxLength: 256
          description: |
            The TMDB API key. Absent leaves the key as it is, an empty string
            removes it, anything else replaces it once TMDB accepts it; a key
            TMDB rejects is a bad_request on tmdbKey. While TMDB cannot be
            reached the key is stored unchecked. It is never returned; see
            MetadataSources.tmdbConfigured.
        metadataSource:
          $ref: "#/components/schemas/MetadataSource"
          description: Absent keeps the setting. Saving or removing tmdbKey never changes it.
        metadataMode:
          $ref: "#/components/schemas/MetadataMode"
          description: Absent keeps the setting.

    StorageFacts:
      type: object
      required: [transcodeCacheBytes, transcodeCacheCapBytes, diskFreeBytes, diskTotalBytes]
      properties:
        transcodeCacheBytes: { type: integer, format: int64 }
        transcodeCacheCapBytes: { type: integer, format: int64 }
        diskFreeBytes: { type: integer, format: int64, description: Of the volume holding the data directory. }
        diskTotalBytes: { type: integer, format: int64 }

    HardwareFacts:
      type: object
      required: [cpuModel, cores, memoryBytes, videoToolbox]
      properties:
        cpuModel: { type: string }
        cores: { type: integer }
        memoryBytes: { type: integer, format: int64 }
        videoToolbox: { type: boolean, description: VideoToolbox hardware encoding is available. }

    MetadataSources:
      type: object
      required: [tmdbConfigured]
      properties:
        tmdbConfigured:
          type: boolean
          description: A TMDB key is in use, saved in Settings or else from the server's environment; the key itself is never served.
        source:
          $ref: "#/components/schemas/MetadataSource"
          description: Always present.
        mode:
          $ref: "#/components/schemas/MetadataMode"
          description: Always present.

    MetadataSource:
      type: string
      enum: [local, remote]
      description: |
        Where titles' metadata and artwork come from, for every library
        kind. local is what the files say: movies' and episodes' tags and
        attached pictures, else a frame of the video; music's tags and
        covers; YouTube's sidecars and folder posters. remote is TMDB for
        movies and TV, MusicBrainz and the Cover Art Archive for music,
        and YouTube channel avatars. Every server starts local.

    MetadataMode:
      type: string
      enum: [only, preferred]
      description: |
        only uses the source alone; under local only the server calls no
        metadata provider. preferred takes each field from the source and
        fills what it lacks from the other. Data stored from a source not
        in use is kept, not shown, and shown again at once when it is.

    ServerStats:
      type: object
      required: [cpuPercent, memoryUsedBytes, memoryTotalBytes, storageUsedBytes, storageTotalBytes, activeTranscodes, maxTranscodes]
      properties:
        cpuPercent: { type: number, format: double, minimum: 0, maximum: 100 }
        memoryUsedBytes: { type: integer, format: int64 }
        memoryTotalBytes: { type: integer, format: int64 }
        storageUsedBytes: { type: integer, format: int64, description: Of the volume holding the data directory. }
        storageTotalBytes: { type: integer, format: int64 }
        activeTranscodes: { type: integer, description: Sessions holding a video transcode slot. }
        maxTranscodes: { type: integer }

    SessionPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Session" }
        nextOffset: { type: integer }

    # Capability snapshot. Each group is its own schema so a mid-playback
    # update carries the one group that changed.
    CapabilitySnapshot:
      type: object
      description: Groups A to D on every play request, with the latest throughput when known.
      required: [decoder, display, audioRoute, network]
      properties:
        decoder: { $ref: "#/components/schemas/DecoderCapabilities" }
        display: { $ref: "#/components/schemas/DisplayCapabilities" }
        audioRoute: { $ref: "#/components/schemas/AudioRouteCapabilities" }
        network: { $ref: "#/components/schemas/NetworkPathCapabilities" }
        throughput: { $ref: "#/components/schemas/ThroughputTelemetry" }

    StreamProtocol:
      type: string
      enum: [http, hls, dash]

    DecoderCapabilities:
      type: object
      description: Group A. Probed once per launch; never re-sent mid-playback.
      required: [protocols, containers, videoCodecs, audioCodecs, subtitleFormats]
      properties:
        protocols:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/StreamProtocol" }
        containers:
          type: array
          description: Containers playable as a plain file, such as mp4, mkv, webm, ts.
          items: { type: string }
        videoCodecs:
          type: array
          items: { $ref: "#/components/schemas/VideoDecoder" }
        audioCodecs:
          type: array
          description: Decodable audio codecs, such as aac, ac3, eac3, flac, opus.
          items: { type: string }
        subtitleFormats:
          type: array
          description: Subtitle formats the client renders itself, such as webvtt, srt, ass, pgs.
          items: { type: string }
        segmentFormats:
          type: array
          minItems: 1
          description: HLS segment formats the client plays; absent means fmp4 only.
          items: { $ref: "#/components/schemas/SegmentFormat" }

    SegmentFormat:
      type: string
      description: Fragmented MP4 or MPEG-TS.
      enum: [fmp4, ts]

    VideoDecoder:
      type: object
      description: One codec and profile the client decodes, with its limits.
      required: [codec, hardware, maxWidth, maxHeight, maxFrameRate, maxBitDepth]
      properties:
        codec: { type: string, description: "ffprobe codec name: h264, hevc, av1, vp9." }
        profiles:
          type: array
          description: ffprobe profile names; empty means any.
          items: { type: string }
        maxLevel: { type: integer, description: "ffprobe level number, such as 41 for H.264 4.1." }
        hardware: { type: boolean }
        maxWidth: { type: integer, minimum: 1 }
        maxHeight: { type: integer, minimum: 1 }
        maxFrameRate: { type: number, format: double, exclusiveMinimum: 0 }
        maxBitDepth: { type: integer, minimum: 8 }
        hdrFormats:
          type: array
          items: { $ref: "#/components/schemas/HdrFormat" }

    DisplayCapabilities:
      type: object
      description: Group B. Re-sent when the screen changes.
      required: [width, height, refreshRate, hdrFormats]
      properties:
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        refreshRate: { type: number, format: double, exclusiveMinimum: 0 }
        hdrFormats:
          type: array
          description: Empty for an SDR display.
          items: { $ref: "#/components/schemas/HdrFormat" }

    AudioRouteCapabilities:
      type: object
      description: Group C. Re-sent on a headphone, Bluetooth, HDMI or AirPlay route change.
      required: [channels, passthroughCodecs]
      properties:
        channels: { type: integer, minimum: 1, maximum: 16 }
        passthroughCodecs:
          type: array
          description: Bitstreams the route carries undecoded; empty means PCM only.
          items: { type: string }
        maxSampleRate: { type: integer, minimum: 8000 }

    NetworkPathCapabilities:
      type: object
      description: Group D. Re-sent on a path change or when the viewer picks a quality.
      required: [discoveredLocally, metered, lowData, vpn]
      properties:
        discoveredLocally:
          type: boolean
          description: The client found the server by local discovery, or a local check it opened is confirmed.
        metered: { type: boolean }
        lowData: { type: boolean }
        vpn: { type: boolean }
        auto:
          type: boolean
          description: |
            The viewer wants Auto: away from home the stream is the Auto
            ladder and the player moves between its rungs; at home, where
            there is no Auto, it plays as Original. maxBitrate must then be
            absent (400). Clients send true until the viewer picks Original
            or a rung, then false. Absent marks a v1 client, which gets v1
            rules: a cap tops a ladder, nothing is blocked, and the stream
            has no away or auto.
        maxBitrate:
          type: integer
          format: int64
          minimum: 1
          description: The viewer's quality cap in bits per second; absent means Original, or Auto when auto is true.

    ThroughputTelemetry:
      type: object
      description: Group E. Telemetry, not capability.
      required: [measuredBitrate, bufferMs, stallCount]
      properties:
        measuredBitrate: { type: integer, format: int64, minimum: 0, description: Bits per second. }
        bufferMs: { type: integer, format: int64, minimum: 0 }
        stallCount: { type: integer, minimum: 0 }
        currentRung: { type: integer, minimum: 0, description: Index into the stream's rungs. }
        rungHeight:
          type: integer
          minimum: 1
          description: Height of the variant the player is on. With rungBitrate it names the rung in use, which in Auto the player picks itself.
        rungBitrate: { type: integer, format: int64, minimum: 1, description: "That variant's bits per second, as its playlist declares it." }
        positionMs: { type: integer, format: int64, minimum: 0, description: "The playback position, recorded as a position report." }

    PlaybackRequest:
      type: object
      required: [profileId, itemId, snapshot]
      properties:
        profileId: { $ref: "#/components/schemas/Id" }
        itemId: { $ref: "#/components/schemas/Id" }
        editionId:
          $ref: "#/components/schemas/Id"
          description: An edition of the item; absent plays the default. The server picks the file.
        audioTrackId: { $ref: "#/components/schemas/Id" }
        subtitleTrackId: { $ref: "#/components/schemas/Id" }
        positionMs: { type: integer, format: int64, minimum: 0, description: Absent resumes from watch state. }
        playlistId:
          $ref: "#/components/schemas/Id"
          description: The playlist, the profile's own or shared with it, this item plays from, as a row of its play order; it stamps the playlist's lastPlayedAt for Recently played.
        snapshot: { $ref: "#/components/schemas/CapabilitySnapshot" }

    TrackSelection:
      type: object
      properties:
        audioTrackId: { $ref: "#/components/schemas/Id" }
        subtitleTrackId:
          $ref: "#/components/schemas/Id"
          description: Absent turns subtitles off, except a forced track.

    PlaybackEventKind:
      type: string
      enum: [stall, client_failure]

    PlaybackEvent:
      type: object
      required: [kind, positionMs]
      properties:
        kind: { $ref: "#/components/schemas/PlaybackEventKind" }
        positionMs: { type: integer, format: int64, minimum: 0 }
        reason: { type: string, maxLength: 500, description: The player's own error text. }

    PositionReport:
      type: object
      required: [positionMs]
      properties:
        positionMs: { type: integer, format: int64, minimum: 0 }
        paused: { type: boolean, default: false }

    Verdict:
      type: string
      enum: [direct_play, remux, audio_transcode, video_transcode]

    PlanEntry:
      type: object
      required: [position, verdict, videoAction, audioAction, subtitleAction, bad]
      properties:
        position: { type: integer }
        verdict: { $ref: "#/components/schemas/Verdict" }
        videoAction: { type: string, enum: [copy, convert] }
        audioAction: { type: string, enum: [copy, convert] }
        subtitleAction: { type: string, enum: [none, sidecar, convert, burn] }
        bad: { type: boolean }
        badReason: { type: string }

    Negotiated:
      type: object
      description: What the player pill reads, such as 4K HDR, Direct play, 38 Mb/s. Width and height are 0 for a song.
      required: [verdict, width, height, bitrate]
      properties:
        verdict: { $ref: "#/components/schemas/Verdict" }
        width: { type: integer }
        height: { type: integer }
        hdrFormat: { $ref: "#/components/schemas/HdrFormat" }
        bitrate: { type: integer, format: int64, description: Bits per second. }
        encoder: { type: string, enum: [hardware, software], description: Absent unless video converts. }
        audioCodec:
          type: string
          description: "Audio-only sessions: the ffprobe name of the codec delivered, such as flac or aac, for the status line Lossless · FLAC · Direct play."
        lossless: { type: boolean, description: "Audio-only sessions: what is delivered is lossless. Absent means false." }

    AudioSource:
      type: object
      description: "The file on the server, as probed. Each field is absent when the probe did not read it."
      required: [lossless]
      properties:
        container: { type: string, description: "ffprobe format name, such as flac or mp3." }
        codec: { type: string, description: "ffprobe name of the audio track's codec, such as flac or mp3." }
        bitrate: { type: integer, format: int64, description: "Bits per second: the audio track's, else the file's." }
        sampleRateHz: { type: integer }
        bitDepth: { type: integer, description: "Bits per sample, as probed." }
        channels: { type: integer }
        sizeBytes: { type: integer, format: int64 }
        lossless: { type: boolean }

    AudioDelivered:
      type: object
      description: "What this session streams. Equals the source for direct play and remux; an audio transcode is AAC at a bitrate of the server's choosing."
      required: [verdict, codec, lossless]
      properties:
        verdict: { $ref: "#/components/schemas/Verdict" }
        codec: { type: string, description: "ffprobe name of the codec delivered, such as flac or aac." }
        bitrate: { type: integer, format: int64, description: "Bits per second; absent when the server has none for a copied file." }
        lossless: { type: boolean }

    AudioDetails:
      type: object
      description: "What the details panel of a song shows: the source file and what is delivered."
      required: [source, delivered]
      properties:
        source: { $ref: "#/components/schemas/AudioSource" }
        delivered: { $ref: "#/components/schemas/AudioDelivered" }

    Playability:
      type: object
      required: [verdict, negotiated]
      properties:
        verdict: { $ref: "#/components/schemas/Verdict" }
        negotiated: { $ref: "#/components/schemas/Negotiated" }

    Rung:
      type: object
      description: One quality the viewer may pick. The first is Original; Auto is not a rung.
      required: [width, height, bitrate, verdict]
      properties:
        width: { type: integer }
        height: { type: integer }
        bitrate: { type: integer, format: int64 }
        verdict: { $ref: "#/components/schemas/Verdict" }
        blocked:
          type: boolean
          description: |
            Listed but not playable on this network path: above 4 Mb/s when
            metered, above 1.5 Mb/s in low data. Clients show it disabled as
            Wi-Fi only. Absent means false.

    Sidecar:
      type: object
      description: A text subtitle served beside the stream.
      required: [trackId, format, forced, url]
      properties:
        trackId: { $ref: "#/components/schemas/Id" }
        language: { type: string }
        title: { type: string }
        format: { type: string, enum: [webvtt, srt] }
        forced: { type: boolean }
        url: { type: string }

    PreviewFrames:
      type: object
      description: The file's seek preview frames, JPEGs at a fixed interval.
      required: [intervalMs, count, width, height, frameUrl, bifUrl]
      properties:
        intervalMs: { type: integer, minimum: 1, description: Frame n is the last keyframe within half an interval of n times intervalMs. }
        count: { type: integer, minimum: 1 }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        frameUrl:
          type: string
          examples: ["/api/v2/streams/k/0/previews/{n}.jpg"]
          description: Server-relative URL of one frame with `{n}` standing for its index from 0. It carries its own authorization like streamUrl.
        bifUrl: { type: string, description: "Server-relative URL of every frame as one Roku BIF file, authorized the same way." }

    PlaybackStream:
      type: object
      required: [sessionId, mediaFileId, entry, streamUrl, streamKind, positionMs, negotiated, rungs, sidecars]
      properties:
        sessionId: { $ref: "#/components/schemas/Id" }
        mediaFileId:
          $ref: "#/components/schemas/Id"
          description: The file in play; the audio and subtitle menus list its tracks.
        entry: { $ref: "#/components/schemas/PlanEntry" }
        streamUrl:
          type: string
          description: Server-relative and opaque. It carries its own authorization; clients add no headers.
        streamKind: { type: string, enum: [file, hls] }
        positionMs: { type: integer, format: int64, description: Where the player starts. }
        negotiated: { $ref: "#/components/schemas/Negotiated" }
        audio:
          $ref: "#/components/schemas/AudioDetails"
          description: "Audio-only sessions (songs): the source file and the delivered stream, for the details panel. Absent for video and for stations."
        rungs:
          type: array
          items: { $ref: "#/components/schemas/Rung" }
        sidecars:
          type: array
          items: { $ref: "#/components/schemas/Sidecar" }
        away:
          type: boolean
          description: The session is away from home, so the client offers Auto first. Absent means false.
        auto:
          type: boolean
          description: "Auto is in effect; the pill reads the rung in use, Auto and its bitrate, as 1080p · Auto · 8 Mb/s. Absent means false."
        previews:
          $ref: "#/components/schemas/PreviewFrames"
          description: Absent when the file has none.
        live:
          type: boolean
          description: >-
            The stream is a station's, without end: the client plays it
            from its live edge, ignores positionMs and offers no pause or
            seek. Absent means false.
        bufferGoalSeconds:
          type: integer
          minimum: 1
          description: >-
            How much of the stream past the playhead the player aims to
            hold, as far as its platform lets it: Settings.readAheadSeconds.
            Absent on a file stream, a live one and a song's, where the
            player keeps its own buffer.

    PlaybackUpdate:
      type: object
      required: [action, stream]
      properties:
        action:
          type: string
          enum: [continue, restart]
          description: On restart the client switches to the new stream at its positionMs.
        stream: { $ref: "#/components/schemas/PlaybackStream" }

    # Music. Artists, albums and songs are items (kinds artist, album and
    # song) served through these views; the scanner alone writes them from
    # tags, MusicBrainz and the Cover Art Archive, as the prober alone writes
    # tracks, so they have no create or update. Artwork, watch state and
    # playback take their ids as any item's.
    MusicArtist:
      type: object
      required: [id, libraryId, name, sortName, albumCount, songCount, genres, addedAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        libraryId: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        sortName: { type: string, description: "The name without a leading \"The \", which Artists sort and file letters by." }
        albumCount: { type: integer, description: Albums whose album artist this is. }
        songCount: { type: integer, description: Songs on those albums or performed by the artist. }
        overview: { type: string, description: The bio. }
        genres:
          type: array
          items: { $ref: "#/components/schemas/Genre" }
        musicBrainzId: { type: string, description: The MusicBrainz artist MBID when matched. }
        addedAt: { type: string, format: date-time }
        posterUrl: { type: string, description: "Server-relative URL of the artist's image, served by getArtwork; it changes exactly when the image does. It is its newest album's that the active profile may hear. Absent when there is none." }

    MusicArtistPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/MusicArtist" }
        nextOffset: { type: integer }
        total: { type: integer, description: "Rows matching the request, ignoring limit and offset." }

    MusicAlbum:
      type: object
      required: [id, libraryId, artistId, artistName, title, songCount, durationMs, lossless, genres, addedAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        libraryId: { $ref: "#/components/schemas/Id" }
        artistId: { $ref: "#/components/schemas/Id", description: The album artist. }
        artistName: { type: string }
        title: { type: string }
        year: { type: integer }
        songCount: { type: integer }
        durationMs: { type: integer, format: int64, description: Every song's duration added up. }
        lossless: { type: boolean, description: "Every song's file is lossless (FLAC, ALAC, WAV or AIFF); the Lossless tag." }
        overview: { type: string }
        genres:
          type: array
          items: { $ref: "#/components/schemas/Genre" }
        musicBrainzId: { type: string, description: The MusicBrainz release MBID when matched. }
        lastPlayedAt: { type: string, format: date-time, description: "When the active profile last played one of its songs; absent when never." }
        addedAt: { type: string, format: date-time }
        posterUrl: { type: string, description: "Server-relative URL of the album's cover, served by getArtwork; it changes exactly when the image does. Absent when there is none." }

    MusicAlbumPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/MusicAlbum" }
        nextOffset: { type: integer }
        total: { type: integer, description: "Rows matching the request, ignoring limit and offset." }

    MusicAlbumSort:
      type: string
      description: |
        title (the default) is A to Z by title without a leading "The ";
        artist is by the album artist's sort name, then year; year is
        newest first; added is newest first, as Recently added.
      enum: [title, artist, year, added]

    MusicSong:
      type: object
      required: [id, libraryId, albumId, albumTitle, albumArtistId, artistId, artistName, title, lossless]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        libraryId: { $ref: "#/components/schemas/Id" }
        albumId: { $ref: "#/components/schemas/Id", description: Its art is the song's art. }
        albumTitle: { type: string }
        albumArtistId: { $ref: "#/components/schemas/Id" }
        artistId: { $ref: "#/components/schemas/Id", description: "Who performs it: the album artist unless the song's tags name another." }
        artistName: { type: string }
        title: { type: string }
        discNumber: { type: integer }
        trackNumber: { type: integer }
        durationMs: { type: integer, format: int64 }
        year: { type: integer }
        codec: { type: string, description: "ffprobe name of the file's audio codec, such as flac or mp3." }
        lossless: { type: boolean }
        unavailable: { type: boolean, description: Its file is marked missing (MediaFile.missingAt); startPlayback answers 409. Absent means false. }
        posterUrl: { type: string, description: "Server-relative URL of the song's art, its album's, served by getArtwork; it changes exactly when the image does. Absent when there is none." }

    MusicSongPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/MusicSong" }
        nextOffset: { type: integer }
        total: { type: integer, description: "Rows matching the request, ignoring limit and offset." }

    MusicSongSort:
      type: string
      description: |
        title is A to Z; artist and album group by artist or album and keep
        disc and track order within an album; added is newest first;
        popular is most played across the server's profiles first.
        Without albumId the default is title.
      enum: [title, artist, album, added, popular]

    MusicLetterGroup:
      type: string
      enum: [albums, artists]

    MusicLetterCount:
      type: object
      required: [letter, count]
      properties:
        letter: { type: string, pattern: "^[A-Z#]$" }
        count: { type: integer, minimum: 1 }

    MusicLetterCountList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/MusicLetterCount" }

    SearchResult:
      type: object
      description: Each list holds at most limit matches, best first.
      required: [movies, shows, episodes, people, artists, albums, songs, channels, videos]
      properties:
        movies:
          type: array
          items: { $ref: "#/components/schemas/Item" }
        shows:
          type: array
          items: { $ref: "#/components/schemas/Item" }
        episodes:
          type: array
          items: { $ref: "#/components/schemas/Item" }
        people:
          type: array
          items: { $ref: "#/components/schemas/Person" }
        artists:
          type: array
          items: { $ref: "#/components/schemas/MusicArtist" }
        albums:
          type: array
          items: { $ref: "#/components/schemas/MusicAlbum" }
        songs:
          type: array
          items: { $ref: "#/components/schemas/MusicSong" }
        channels:
          type: array
          items: { $ref: "#/components/schemas/YouTubeChannel" }
        videos:
          type: array
          items: { $ref: "#/components/schemas/YouTubeVideo" }

    MusicSearchResult:
      type: object
      required: [artists, albums, songs]
      properties:
        artists:
          type: array
          items: { $ref: "#/components/schemas/MusicArtist" }
        albums:
          type: array
          items: { $ref: "#/components/schemas/MusicAlbum" }
        songs:
          type: array
          items: { $ref: "#/components/schemas/MusicSong" }

    MusicRecentKind:
      type: string
      enum: [album, artist, playlist]

    MusicRecent:
      type: object
      description: One recently played thing; the object named by kind is present.
      required: [kind, playedAt]
      properties:
        kind: { $ref: "#/components/schemas/MusicRecentKind" }
        playedAt: { type: string, format: date-time }
        album: { $ref: "#/components/schemas/MusicAlbum" }
        artist: { $ref: "#/components/schemas/MusicArtist" }
        playlist: { $ref: "#/components/schemas/Playlist" }

    MusicRecentPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/MusicRecent" }
        nextOffset: { type: integer }

    # YouTube. Channels and videos are items (kinds channel and video).
    YouTubeChannel:
      type: object
      required: [id, libraryId, title, videoCount, unwatchedCount, addedAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        libraryId: { $ref: "#/components/schemas/Id" }
        title: { type: string }
        overview: { type: string }
        videoCount: { type: integer, description: Videos of the channel in the library. }
        unwatchedCount: { type: integer, description: "Of those, how many the active profile has not watched." }
        lastVideoOn: { type: string, format: date, description: Publish date of its newest video in the library. }
        externalId: { type: string, description: "The YouTube channel id (UC...) or playlist id (PL...) the folder follows, when its tvshow.nfo names one." }
        sourceUrl: { type: string, description: "The channel or playlist on YouTube, for Open on YouTube." }
        forKids:
          type: boolean
          description: >-
            Always present. Set by an adult with setYouTubeChannelForKids; a
            new channel is not. A kid under rating ceilings sees the channels
            for kids and their videos; an adult with hideKidsContent does not
            browse them.
        addedAt: { type: string, format: date-time }
        posterUrl: { type: string, description: "Server-relative URL of the channel's avatar, served by getArtwork; it changes exactly when the image does. Absent when there is none." }

    YouTubeChannelForKidsInput:
      type: object
      required: [forKids]
      properties:
        forKids: { type: boolean }

    YouTubeChannelPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/YouTubeChannel" }
        nextOffset: { type: integer }

    YouTubeChannelSort:
      type: string
      description: title (the default) is A to Z; latest is the channel with the newest video first.
      enum: [title, latest]

    YouTubeVideo:
      type: object
      required: [id, libraryId, channelId, channelTitle, title, watched, positionMs, addedAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        libraryId: { $ref: "#/components/schemas/Id" }
        channelId: { $ref: "#/components/schemas/Id" }
        channelTitle: { type: string }
        title: { type: string }
        overview: { type: string }
        durationMs: { type: integer, format: int64 }
        publishedOn: { type: string, format: date }
        height: { type: integer, description: "The video's height, for the 1080p tag." }
        watched: { type: boolean, description: The active profile's watch state. }
        positionMs: { type: integer, format: int64, description: The active profile's resume position; 0 when none. }
        lastPlayedAt: { type: string, format: date-time }
        externalId: { type: string, description: "YouTube's video id, when a sidecar names it." }
        sourceUrl: { type: string, description: "The video on YouTube, for Open on YouTube." }
        addedAt: { type: string, format: date-time, description: When a scan first found it. }
        unavailable: { type: boolean, description: Its file is marked missing (MediaFile.missingAt); startPlayback answers 409. Absent means false. }
        posterUrl: { type: string, description: "Server-relative URL of the video's thumbnail, else its channel's avatar, served by getArtwork; it changes exactly when the image does. Absent when there is none." }
        channelPosterUrl: { type: string, description: "Server-relative URL of the channel's poster, as that channel's posterUrl, served by getArtwork; it changes exactly when the image does. Absent when there is none." }

    YouTubeVideoPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/YouTubeVideo" }
        nextOffset: { type: integer }

    YouTubeVideoSort:
      type: string
      description: newest (the default) and oldest go by publish date; length is longest first; played is the latest played first.
      enum: [newest, oldest, title, channel, length, played]

    YouTubeChannelWatchInput:
      type: object
      required: [watched]
      properties:
        watched: { type: boolean }
        at:
          type: string
          format: date-time
          description: As WatchStateInput.at, for each video.

    # Playlists.
    PlaylistKind:
      type: string
      description: The library kind a playlist holds. movies takes movies and collections; tv takes shows, seasons and episodes; music takes artists, albums and songs.
      enum: [movies, tv, music]

    Playlist:
      type: object
      required: [id, profileId, name, kind, access, itemCount, durationMs, createdAt, modifiedAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        profileId: { $ref: "#/components/schemas/Id", description: The owner's profile. }
        name: { type: string }
        access: { $ref: "#/components/schemas/PlaylistAccess" }
        shared: { type: boolean, description: "For its owner, whether it is shared with any profile or household; for anyone else, true. Always sent; optional so a copy a client stored before the field existed still reads, as not shared. Clients draw a shared badge from it." }
        ownerName: { type: string, description: "The owner's name, present when the playlist is shared with the profile or a household of theirs, for \"Shared by\"." }
        kind: { $ref: "#/components/schemas/PlaylistKind" }
        itemCount: { type: integer, description: "Rows of the play order now, as 48 songs; a container counts what it expands to." }
        durationMs: { type: integer, format: int64, description: "The play order's rows' edition runtimes added up." }
        artItemId: { $ref: "#/components/schemas/Id", description: "The item whose poster stands for the playlist: the item of its first entry the active profile may see, which may be a show, season, artist or album, or for a collection its first such movie." }
        lastPlayedAt: { type: string, format: date-time, description: When playback last started with this playlistId. }
        posterUrl: { type: string, description: "Server-relative URL of artItemId's poster, as that item's posterUrl, served by getArtwork; it changes exactly when the image does. Absent when there is none." }
        imageUrl:
          type: string
          description: >-
            Server-relative URL of the custom image the owner set, served by
            getPlaylistImage with the device token like artwork; it changes
            whenever the image does. Absent while none is set, and while
            getPlaylistImage would not find it; the client then shows
            artItemId's poster.
        createdAt: { type: string, format: date-time }
        modifiedAt: { type: string, format: date-time }
        createdBy: { $ref: "#/components/schemas/Id", description: "The profile that created it; absent when none did, as for what the server made, or when that profile is gone." }
        modifiedBy: { $ref: "#/components/schemas/Id", description: "The profile that last changed it; absent when none did, as for what the server made, or when that profile is gone." }

    CustomImageInput:
      type: object
      description: >-
        A custom image other than an uploaded file: exactly one of itemId
        and url. itemId names the title of one of the playlist's entries,
        which the owner may see and which has that artwork; the image
        follows the title's artwork, and is not shown while the title is
        out of the playlist, or to a profile that may not see it. url is an
        http or https link the server fetches once, within 10 seconds and
        16 MiB, from a public address: not loopback, link-local, a private
        network or the server's own, before or after a redirect.
      properties:
        itemId: { $ref: "#/components/schemas/Id" }
        kind:
          $ref: "#/components/schemas/ArtworkKind"
          description: With itemId, which of its artwork; poster when absent.
        url: { type: string, minLength: 1, maxLength: 2048 }

    PlaylistAccess:
      type: string
      description: "What the active profile may do with a playlist: owner does everything; write adds, removes and reorders entries; read sees and plays it and makes it a station's source."
      enum: [owner, read, write]

    PlaylistShareAccess:
      type: string
      description: read sees and plays the playlist and makes it a station's source; write also adds, removes and reorders its entries. A kid only reads.
      enum: [read, write]

    PlaylistShare:
      type: object
      required: [playlistId, profileId, name, kind, access, createdAt]
      properties:
        playlistId: { $ref: "#/components/schemas/Id" }
        profileId: { $ref: "#/components/schemas/Id", description: The profile it is shared with. }
        name: { type: string, description: That profile's name. }
        kind: { $ref: "#/components/schemas/AccountKind" }
        access: { $ref: "#/components/schemas/PlaylistShareAccess" }
        createdAt: { type: string, format: date-time }
        color: { $ref: "#/components/schemas/ProfileColor", description: "The profile's shown color, as Account.color reports it. Always sent." }
        householdId: { $ref: "#/components/schemas/Id", description: "The household to label the profile with: the first of the owner's households, their own first, that the profile is in; else the profile's own household. Always sent." }

    PlaylistShareInput:
      type: object
      required: [profileId, access]
      properties:
        profileId: { $ref: "#/components/schemas/Id" }
        access: { $ref: "#/components/schemas/PlaylistShareAccess" }

    PlaylistShareChange:
      type: object
      required: [access]
      properties:
        access: { $ref: "#/components/schemas/PlaylistShareAccess" }

    PlaylistSharePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PlaylistShare" }
        nextOffset: { type: integer }

    PlaylistHouseholdShare:
      type: object
      required: [playlistId, householdId, name, access, createdAt]
      properties:
        playlistId: { $ref: "#/components/schemas/Id" }
        householdId: { $ref: "#/components/schemas/Id", description: The household it is shared with. }
        name: { type: string, description: That household's name. }
        access: { $ref: "#/components/schemas/PlaylistShareAccess" }
        createdAt: { type: string, format: date-time }

    PlaylistHouseholdShareInput:
      type: object
      required: [householdId, access]
      properties:
        householdId: { $ref: "#/components/schemas/Id" }
        access: { $ref: "#/components/schemas/PlaylistShareAccess" }

    PlaylistHouseholdSharePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PlaylistHouseholdShare" }
        nextOffset: { type: integer }

    ShareCandidate:
      type: object
      required: [profileId, name, kind, householdName]
      properties:
        profileId: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        kind: { $ref: "#/components/schemas/AccountKind" }
        householdName: { type: string, description: "The name of householdId's household, which tells two of one name apart." }
        color: { $ref: "#/components/schemas/ProfileColor", description: "The profile's shown color, as Account.color reports it. Always sent." }
        householdId: { $ref: "#/components/schemas/Id", description: "The household to label the profile with: the first of the owner's households, their own first, that the profile is in; else the profile's own household. Always sent." }

    ShareCandidatePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ShareCandidate" }
        nextOffset: { type: integer }

    ShareHousehold:
      type: object
      required: [id, name, profiles]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        profiles: { type: integer, description: "How many profiles are in the household, the adult included: its kids and the adults who have joined it, none revoked." }

    ShareHouseholdList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ShareHousehold" }

    PlaylistInput:
      type: object
      required: [name, kind]
      properties:
        id:
          $ref: "#/components/schemas/Id"
          description: >-
            On createPlaylist: the new playlist's id, a UUIDv7 the client chose; absent, the
            server chooses one. An id already in use answers 409. On replacePlaylist,
            an id other than the path's answers 400.
        name: { type: string, minLength: 1, maxLength: 100 }
        kind: { $ref: "#/components/schemas/PlaylistKind" }

    PlaylistPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Playlist" }
        nextOffset: { type: integer }
        total: { type: integer, description: "Rows matching the request, ignoring limit and offset." }

    PlaylistEntryKind:
      type: string
      description: What an entry is, or what a play order row plays (movie, episode or song only).
      enum: [movie, show, season, episode, artist, album, song, collection]

    PlaylistEntry:
      type: object
      description: |
        One entry: itemId, or collectionId for a collection. The object its
        kind names is present: item for a movie, show, season or episode,
        with show for a season or episode; artist, album or song for music;
        collection for a collection. The row's title is
        item.metadata.title else item.parsedTitle, artist.name,
        album.title, song.title or collection.name; its art is that
        object's posterUrl.
      required: [id, playlistId, position, kind, itemCount, durationMs, addedAt, createdAt, modifiedAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        playlistId: { $ref: "#/components/schemas/Id" }
        position: { type: integer, minimum: 0, description: Order from 0 at the top. }
        rank: { type: string, description: "What orders the playlist's entries, compared bytewise, ties by id: a key of rocicorp/fractional-indexing with its default alphabet. Always sent; optional so a copy a client stored before the field existed still reads." }
        itemId: { $ref: "#/components/schemas/Id", description: Absent for a collection. }
        collectionId: { $ref: "#/components/schemas/Id", description: Present for a collection only. }
        kind: { $ref: "#/components/schemas/PlaylistEntryKind" }
        editionId: { $ref: "#/components/schemas/Id", description: "The edition a movie, episode or song entry plays; absent for a container." }
        editionName: { type: string, description: "The name of that edition; present only while its title has more than one edition with files." }
        itemCount: { type: integer, minimum: 0, description: "Rows of the play order it stands for now: 1 for a movie, episode or song, 0 when its edition has no files left; a container's current episodes or songs." }
        durationMs: { type: integer, format: int64, description: "Those rows' edition runtimes added up." }
        item: { $ref: "#/components/schemas/Item" }
        show: { $ref: "#/components/schemas/Item" }
        artist: { $ref: "#/components/schemas/MusicArtist" }
        album: { $ref: "#/components/schemas/MusicAlbum" }
        song: { $ref: "#/components/schemas/MusicSong" }
        collection: { $ref: "#/components/schemas/Collection" }
        addedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        modifiedAt: { type: string, format: date-time }
        createdBy: { $ref: "#/components/schemas/Id", description: "The profile that created it; absent when none did, as for what the server made, or when that profile is gone." }
        modifiedBy: { $ref: "#/components/schemas/Id", description: "The profile that last changed it; absent when none did, as for what the server made, or when that profile is gone." }

    PlaylistEntryInput:
      type: object
      description: >-
        Exactly one of itemId and collectionId; both or neither answers 400.
        On replacePlaylistEntry an editionId other than the entry's answers
        400 and an absent one keeps it.
      properties:
        id:
          $ref: "#/components/schemas/Id"
          description: >-
            On addPlaylistEntry and addPlaylistEntries: the new entry's id, a
            UUIDv7 the client chose; absent, the server chooses one. An id
            already in use, or given twice in one batch, answers 409. On
            replacePlaylistEntry, an id other than the path's answers 400.
        itemId: { $ref: "#/components/schemas/Id" }
        collectionId: { $ref: "#/components/schemas/Id" }
        position:
          type: integer
          minimum: 0
          description: >-
            Where it goes, from 0; past the end or absent puts it last. It
            takes a rank between its new neighbours', so a late replay can
            land elsewhere; between two of equal rank it goes after both.
        rank:
          type: string
          pattern: "^[A-Za-z][0-9A-Za-z]*$"
          maxLength: 255
          description: >-
            Where it goes, as PlaylistEntry.rank orders it: a key that
            generateKeyBetween of rocicorp/fractional-indexing makes with its
            default alphabet from the neighbours' ranks. Taken as given; not
            with position. A string that is not such a key answers 400.
        editionId:
          $ref: "#/components/schemas/Id"
          description: An edition of itemId; required when that movie, episode or song has more than one.

    PlaylistEntryPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PlaylistEntry" }
        nextOffset: { type: integer }

    PlaylistPlayOrderItem:
      type: object
      description: |
        One row of a playlist's play order: item for a movie or episode,
        with show for an episode, or song. Play it with startPlayback, its
        itemId and its editionId. A title entry's row plays the entry's
        edition and is left out while that edition has no files; a
        container's rows play each member's default edition.
      required: [entryId, itemId, kind]
      properties:
        entryId: { $ref: "#/components/schemas/Id", description: The entry it comes from. }
        itemId: { $ref: "#/components/schemas/Id" }
        kind: { $ref: "#/components/schemas/PlaylistEntryKind" }
        editionId: { $ref: "#/components/schemas/Id", description: The edition it plays; absent for an item with none. }
        editionName: { type: string, description: "The name of that edition; present only while its title has more than one edition with files." }
        durationMs: { type: integer, format: int64, description: "Its edition's runtime, a song's duration; absent when unknown." }
        item: { $ref: "#/components/schemas/Item" }
        show: { $ref: "#/components/schemas/Item" }
        song: { $ref: "#/components/schemas/MusicSong" }

    PlaylistPlayOrderPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PlaylistPlayOrderItem" }
        nextOffset: { type: integer }

    # Collections.
    CollectionSource:
      type: string
      description: tmdb is a TMDB franchise collection, server-wide and read-only; custom is kept by one household.
      enum: [tmdb, custom]

    Collection:
      type: object
      required: [id, source, name, movieCount, createdAt, modifiedAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        source: { $ref: "#/components/schemas/CollectionSource" }
        name: { type: string }
        overview: { type: string, description: "TMDB's overview; a custom collection has none." }
        householdId: { $ref: "#/components/schemas/Id", description: The household of a custom collection; absent for TMDB. }
        tmdbId: { type: integer, format: int64, description: The TMDB collection id; absent for custom. }
        movieCount: { type: integer, minimum: 0, description: Its movies the active profile may see. }
        customOrder: { type: boolean, description: "True while a custom collection's movies are in a hand order, set by replaceCollectionMoviePosition; false for release order, and always for TMDB. Always sent; optional so a copy a client stored before the field existed still reads." }
        posterUrl: { type: string, description: "Server-relative URL of the collection's poster: its own TMDB image, else its first movie's in listCollectionMovies order for the active profile, served by getArtwork; it changes exactly when the image does. Absent when there is none." }
        backdropUrl: { type: string, description: "Server-relative URL of the collection's backdrop, as posterUrl, served by getArtwork; it changes exactly when the image does. Absent when there is none." }
        createdAt: { type: string, format: date-time }
        modifiedAt: { type: string, format: date-time }
        createdBy: { $ref: "#/components/schemas/Id", description: "The profile that created it; absent when none did, as for what the server made, or when that profile is gone." }
        modifiedBy: { $ref: "#/components/schemas/Id", description: "The profile that last changed it; absent when none did, as for what the server made, or when that profile is gone." }

    CollectionMoviePositionInput:
      type: object
      properties:
        position: { type: integer, minimum: 0, description: "Where the movie goes, from 0; past the end or absent puts it last." }

    CollectionInput:
      type: object
      required: [name]
      properties:
        id:
          $ref: "#/components/schemas/Id"
          description: >-
            On createCollection: the new collection's id, a UUIDv7 the client chose; absent, the
            server chooses one. An id already in use answers 409. On replaceCollection,
            an id other than the path's answers 400.
        name: { type: string, minLength: 1, maxLength: 100 }

    CollectionPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Collection" }
        nextOffset: { type: integer }
        total: { type: integer, description: "Rows matching the request, ignoring limit and offset." }

    ItemRelated:
      type: object
      required: [collections, similar]
      properties:
        collections:
          type: array
          description: >-
            A movie's collections, its TMDB collection first, then the
            household's custom ones by name, each with its own other movies
            in collection order, never the movie itself. A collection with
            more than 10 lists the 10 nearest the movie, 5 before and 5
            after it, a side with fewer giving the rest to the other. A
            collection with none is left out.
          items: { $ref: "#/components/schemas/RelatedCollection" }
        similar:
          type: array
          maxItems: 0
          deprecated: true
          description: Always empty; kept because released clients require it.
          items: { $ref: "#/components/schemas/Item" }
        previous:
          $ref: "#/components/schemas/Item"
          description: >-
            A movie's previous film in its TMDB collection, or an episode's
            previous episode of its show in play order (seasons by number,
            specials last, then episodes by number); absent when none.
        next:
          $ref: "#/components/schemas/Item"
          description: The film or episode after it, as previous; absent when none.

    RelatedCollection:
      type: object
      required: [collection, items]
      properties:
        collection: { $ref: "#/components/schemas/Collection" }
        items:
          type: array
          items: { $ref: "#/components/schemas/Item" }

    # Watch together.
    WatchTogetherStatus:
      type: string
      description: |
        waiting until a second profile joins or the 5-minute window passes;
        joined once one has; ended when either leaves, the window passes
        unjoined, or no member has polled for 60 seconds.
      enum: [waiting, joined, ended]

    WatchTogetherRole:
      type: string
      enum: [host, guest]

    WatchTogetherMember:
      type: object
      required: [accountId, name, role, deviceName, platform, present, joinedAt]
      properties:
        accountId: { $ref: "#/components/schemas/Id" }
        name: { type: string, description: As Helga in In sync with Helga. }
        role: { $ref: "#/components/schemas/WatchTogetherRole" }
        deviceName: { type: string, description: "The member's device, as Helga is on her Apple TV." }
        platform: { $ref: "#/components/schemas/Platform" }
        present: { type: boolean, description: Polled within the last 30 seconds. }
        joinedAt: { type: string, format: date-time }
        thisDevice:
          type: boolean
          description: >-
            The member is on the calling device. One profile may be both
            members, on two devices; the other is then named by its
            `deviceName`.

    WatchTogether:
      type: object
      required: [id, itemId, status, members, joinBy, joinMsLeft, playing, positionMs, version, serverTime, openedAt, serverTimeMs,
        effectiveAtMs, effectivePositionMs]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        itemId: { $ref: "#/components/schemas/Id" }
        status: { $ref: "#/components/schemas/WatchTogetherStatus" }
        members:
          type: array
          description: The host, then the guest once joined.
          items: { $ref: "#/components/schemas/WatchTogetherMember" }
        joinBy: { type: string, format: date-time, description: The end of the 5-minute window to join. }
        joinMsLeft:
          type: integer
          format: int64
          minimum: 0
          description: Milliseconds of the window left at serverTime, for the m:ss countdown without trusting the client's clock.
        playing: { type: boolean }
        positionMs: { type: integer, format: int64, minimum: 0, description: The shared position at serverTime. }
        pausedById: { $ref: "#/components/schemas/Id", description: "Who paused last, while paused, as Helga paused." }
        pausedByName: { type: string }
        version: { type: integer, minimum: 1, description: "Rises on every join, play, pause, seek and end." }
        serverTime: { type: string, format: date-time, description: When the server answered. }
        openedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        serverTimeMs: { type: integer, format: int64, description: "serverTime in Unix milliseconds, for estimating the offset from the server's clock." }
        effectiveAtMs:
          type: integer
          format: int64
          description: When `playing` and `effectivePositionMs` take effect on every member, in Unix milliseconds on the server's clock. It may be ahead of serverTimeMs.
        effectivePositionMs: { type: integer, format: int64, minimum: 0, description: The shared position at effectiveAtMs. }

    WatchTogetherInput:
      type: object
      required: [itemId]
      properties:
        itemId: { $ref: "#/components/schemas/Id" }
        fromSessionId:
          $ref: "#/components/schemas/Id"
          description: >-
            Watch together from "Playing on": the active profile's session
            on another device, open on this item. The Watch together opens
            at that session's position, and its device, told by a
            watch_together event naming the session, joins from its player
            and plays for both. Any other session answers 400.

    WatchTogetherStateInput:
      type: object
      required: [playing, positionMs]
      properties:
        playing: { type: boolean }
        positionMs: { type: integer, format: int64, minimum: 0, description: The sender's position when its viewer acted. }

    WatchTogetherPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/WatchTogether" }
        nextOffset: { type: integer }

    # Stations.
    StationOrder:
      type: string
      description: playlist plays the play order as it stands; random plays each loop in a shuffled order the server keeps.
      enum: [playlist, random]

    StationVisibility:
      type: string
      description: private is the owner's; household every profile of the owner's household; server every household, set by an admin only.
      enum: [private, household, server]

    StationTiming:
      type: string
      description: >-
        When a program starts after the one before ends. continuous: at
        once, with no gap. half_hour: at the next hour or half hour. hour:
        at the top of the next hour. A program ending exactly on a
        boundary is followed at that boundary.
      enum: [continuous, half_hour, hour]

    Weekday:
      type: string
      enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]

    StationTimeRange:
      type: object
      description: >-
        A range of the day in the server's local time, as 18:00 to 22:00.
        A to at or before from runs past midnight, and belongs to the day
        it starts on.
      required: [from, to]
      properties:
        id:
          $ref: "#/components/schemas/Id"
          description: >-
            Always sent. On createStation and replaceStation: the range's id, a
            UUIDv7 the client chose; absent, the server chooses one. A range
            replaceStation is given keeps its id when it sends it again; an id
            in use by another station's range, or given twice, answers 409.
        from: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        to: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }

    Station:
      type: object
      description: |
        A station and what is on it. days and times are its schedule: both
        empty is continuous; otherwise programs start only on those days
        (any day when days is empty) within those times (all day when times
        is empty), and one still running when its window closes plays to
        its end. timing places each program after the one before ends.
        Hours, half hours, days and times are the server's local time.

        The identity image is imageUrl when present, else the client's
        own, drawn from the name. A
        client offers Edit station, Reschedule now and Delete only when
        ownerId is the active profile, and shows visibility server as a
        read-only Server.
      required: [id, name, kind, ownerId, householdId, playlistId, order, visibility, timing, days, times, onAir, createdAt, modifiedAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        kind: { $ref: "#/components/schemas/PlaylistKind" }
        ownerId: { $ref: "#/components/schemas/Id", description: The adult profile that owns it. }
        householdId: { $ref: "#/components/schemas/Id", description: The owner's household. }
        playlistId:
          $ref: "#/components/schemas/Id"
          description: >-
            The owner's playlist it plays. A station made without a
            playlistId owns its own playlist, which no playlist listing
            shows; the owner edits what the station plays through that
            playlist's entries (addPlaylistEntry, replacePlaylistEntry,
            removePlaylistEntry), and deleting the station deletes it.
        order: { $ref: "#/components/schemas/StationOrder" }
        visibility: { $ref: "#/components/schemas/StationVisibility" }
        timing: { $ref: "#/components/schemas/StationTiming" }
        days:
          type: array
          items: { $ref: "#/components/schemas/Weekday" }
        times:
          type: array
          items: { $ref: "#/components/schemas/StationTimeRange" }
        rating:
          type: string
          description: >-
            For display: the highest rating of anything the playlist
            contains, on the MPAA scale for movies and the TV Parental
            Guidelines for tv. Absent for music, for an empty playlist, and
            when anything it contains is unrated or rated off that scale.
            Recalculated hourly and by rescheduleStation only. Which kids
            see the station does not follow it; see listStations.
        onAir: { $ref: "#/components/schemas/StationOnAir" }
        imageUrl:
          type: string
          description: >-
            Server-relative URL of the custom image the owner set, served by
            getStationImage with the device token like artwork; it changes
            whenever the image does. Absent while none is set, and while
            getStationImage would not find it.
        createdAt: { type: string, format: date-time }
        modifiedAt: { type: string, format: date-time }
        createdBy: { $ref: "#/components/schemas/Id", description: "The profile that created it; absent when none did, as for what the server made, or when that profile is gone." }
        modifiedBy: { $ref: "#/components/schemas/Id", description: "The profile that last changed it; absent when none did, as for what the server made, or when that profile is gone." }

    StationInput:
      type: object
      required: [name]
      properties:
        id:
          $ref: "#/components/schemas/Id"
          description: >-
            On createStation only: the new station's id, a UUIDv7 the client
            chose; absent, the server chooses one. An id already in use answers
            409. On replaceStation, an id other than the path's answers 400.
        ownPlaylistId:
          $ref: "#/components/schemas/Id"
          description: >-
            On createStation without playlistId only: the id of the playlist
            the station owns, a UUIDv7 the client chose; absent, the server
            chooses one. An id already in use answers 409; with playlistId, or
            on replaceStation, it answers 400.
        name: { type: string, minLength: 1, maxLength: 100 }
        playlistId:
          $ref: "#/components/schemas/Id"
          description: >-
            One of the active adult's playlists, or one shared with them. Absent on create makes the
            station its own empty playlist of kind; absent on replace keeps
            the station's.
        order: { $ref: "#/components/schemas/StationOrder", default: playlist }
        visibility:
          type: string
          description: Absent is private on create and keeps the station's on replace. server is set by setStationServerWide only.
          enum: [private, household]
        timing:
          $ref: "#/components/schemas/StationTiming"
          description: >-
            Absent on create is the kind's: hour for movies, half_hour for
            tv, continuous for music. Absent on replace keeps the
            station's, or takes the new kind's when kind changes.
        days:
          type: array
          uniqueItems: true
          description: Absent or empty is every day.
          items: { $ref: "#/components/schemas/Weekday" }
        times:
          type: array
          description: >-
            Absent or empty is all day. Under hour or half_hour timing each
            range must hold a start boundary (a whole hour, or a half hour),
            as 20:00 to 20:25 does and 20:05 to 20:25 does not; one that
            holds none never airs and is refused (400).
          items: { $ref: "#/components/schemas/StationTimeRange" }
        kind:
          $ref: "#/components/schemas/PlaylistKind"
          description: >-
            Required on create without playlistId. With a playlistId it
            must be that playlist's kind. On replace, a station that owns
            its playlist changes kind only while that playlist is empty
            (409 otherwise); one playing another playlist takes a new
            playlistId instead.

    StationStatus:
      type: string
      description: >-
        on_air: now is playing. between_programs: inside the schedule,
        waiting for next; the client shows the identity image with "Up
        next at time: title", and a client tuned in asks again at next
        startsAt, so the program plays as it starts. off_schedule: outside
        the schedule; the client
        shows the identity image with "Back day at time" from next startsAt.
      enum: [on_air, between_programs, off_schedule]

    StationOnAir:
      type: object
      description: >-
        What the station is doing when the server answered. A program the
        active profile may not see is left out, as if the station were
        between programs then. next is the first of upNext, absent when
        nothing more is scheduled, as for an empty playlist.
      required: [status, upNext]
      properties:
        status: { $ref: "#/components/schemas/StationStatus" }
        now: { $ref: "#/components/schemas/StationProgram", description: Present when on_air. }
        positionMs: { type: integer, format: int64, minimum: 0, description: "The live position in now when the server answered; present when on_air." }
        next: { $ref: "#/components/schemas/StationProgram" }
        upNext:
          type: array
          maxItems: 10
          description: The programs after now in the order they play, at most ten.
          items: { $ref: "#/components/schemas/StationProgram" }

    StationProgram:
      type: object
      description: >-
        One scheduled program: item for a movie or episode, with show for
        an episode, or song, filled as a play-order row. Its title and art
        are read as PlaylistEntry describes.
      required: [itemId, editionId, kind, startsAt, endsAt, durationMs]
      properties:
        itemId: { $ref: "#/components/schemas/Id" }
        editionId: { $ref: "#/components/schemas/Id" }
        editionName: { type: string, description: "The edition's name; present only while its title has more than one edition with files." }
        kind: { $ref: "#/components/schemas/PlaylistEntryKind" }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        durationMs: { type: integer, format: int64 }
        item: { $ref: "#/components/schemas/Item" }
        show: { $ref: "#/components/schemas/Item" }
        song: { $ref: "#/components/schemas/MusicSong" }

    StationProgramPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/StationProgram" }
        nextOffset: { type: integer }

    StationPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Station" }
        nextOffset: { type: integer }
        total: { type: integer, description: "Rows matching the request, ignoring limit and offset." }

    StationPlaybackRequest:
      type: object
      required: [snapshot]
      properties:
        audioTrackId: { $ref: "#/components/schemas/Id" }
        subtitleTrackId: { $ref: "#/components/schemas/Id" }
        snapshot: { $ref: "#/components/schemas/CapabilitySnapshot" }
        live:
          type: boolean
          description: >-
            The client plays a movies or tv station as one continuous
            stream. Absent means false.

    StationPlayback:
      type: object
      required: [stream, onAir]
      properties:
        stream: { $ref: "#/components/schemas/PlaybackStream" }
        onAir: { $ref: "#/components/schemas/StationOnAir", description: "What is on, with now the program tuned in to, and next." }

    StationServerWideInput:
      type: object
      required: [serverWide]
      properties:
        serverWide: { type: boolean }

    SsoOption:
      type: object
      required: [id, name]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string, description: 'The button reads "Sign in with <name>".' }

    SsoReturnTo:
      type: string
      enum: [viewer, admin]
      default: viewer
      description: The sign-in page the callback returns to, `/` or `/admin/`.

    SsoExchangeRequest:
      type: object
      required: [code, deviceName, platform]
      properties:
        code: { type: string, minLength: 1, maxLength: 200 }
        deviceName: { type: string, minLength: 1, maxLength: 100 }
        platform: { $ref: "#/components/schemas/Platform" }

    SsoProvider:
      type: object
      required: [id, name, issuer, clientId, clientSecretSet, linksByEmail, enabled, createdAt, modifiedAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        issuer: { type: string }
        clientId: { type: string }
        clientSecretSet: { type: boolean, description: A client secret is saved; the secret itself is never served. }
        requiredGroup: { type: string, description: "When set, the ID token's groups claim must hold it." }
        linksByEmail:
          type: boolean
          description: >-
            The operator controls this provider's accounts, so a first sign-in
            links the one account with the ID token's email when the token's
            email_verified claim is true.
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        modifiedAt: { type: string, format: date-time }
        createdBy: { $ref: "#/components/schemas/Id", description: "The profile that created it; absent when none did, as for what the server made, or when that profile is gone." }
        modifiedBy: { $ref: "#/components/schemas/Id", description: "The profile that last changed it; absent when none did, as for what the server made, or when that profile is gone." }

    SsoProviderInput:
      type: object
      required: [name, issuer, clientId]
      properties:
        id:
          $ref: "#/components/schemas/Id"
          description: >-
            On createSsoProvider: the new provider's id, a UUIDv7 the client chose; absent, the
            server chooses one. An id already in use answers 409. On replaceSsoProvider,
            an id other than the path's answers 400.
        name: { type: string, minLength: 1, maxLength: 100 }
        issuer: { type: string, minLength: 1, maxLength: 2048 }
        clientId: { type: string, minLength: 1, maxLength: 512 }
        clientSecret:
          type: string
          maxLength: 1024
          description: |
            Write-only. On replace, absent keeps the saved secret, an empty
            string removes it (a public client) and anything else replaces it.
        requiredGroup: { type: string, maxLength: 256, description: Empty or absent requires none. }
        linksByEmail: { type: boolean, default: false }
        enabled: { type: boolean, default: true }

    SsoProviderPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SsoProvider" }
        nextOffset: { type: integer }

    AccountIdentity:
      type: object
      required: [id, accountId, providerId, subject, createdAt, modifiedAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        accountId: { $ref: "#/components/schemas/Id" }
        providerId: { $ref: "#/components/schemas/Id" }
        subject: { type: string, description: The provider's ID for the user. }
        email: { type: string, description: As the provider gave it when the identity was linked. }
        createdAt: { type: string, format: date-time }
        modifiedAt: { type: string, format: date-time }

    AccountIdentityPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AccountIdentity" }
        nextOffset: { type: integer }

    # Live updates and handoff.
    EventKind:
      type: string
      description: |
        watch_state: the profile's position or watched mark on `itemId`
        changed, by hand, by a video's first position report, seek or end.
        playback: a video session of the profile `started`, `ended` or was
        `moved` to another device. station: `stationId`'s settings,
        schedule or program on air changed; without `stationId`, the
        stations the profile sees. watch_together: one it finds was
        `opened`, `joined` or `ended`. playlist: `playlistId` or its
        entries or shares changed; without `playlistId`, the profile's
        playlists. library: a scan of `libraryId` finished having added,
        updated or removed something in it, once per scan. household: the
        device household's profiles, a profile's preferences or profile
        offers changed, or the offers made to the profile.
      enum: [watch_state, playback, station, watch_together, playlist, library, household]

    Event:
      type: object
      required: [kind]
      properties:
        kind: { $ref: "#/components/schemas/EventKind" }
        change:
          type: string
          description: >-
            What happened. On a playback event: started, moved or ended. On
            a watch_together event: opened, joined or ended.
        itemId: { $ref: "#/components/schemas/Id" }
        sessionId:
          $ref: "#/components/schemas/Id"
          description: >-
            The playback session of a playback event. On a watch_together
            `opened`, the session it was opened from: the device playing
            that session joins at once and plays, as Watch together in
            "Playing on" asks.
        deviceId: { $ref: "#/components/schemas/Id", description: The device of a playback event's session. }
        stationId: { $ref: "#/components/schemas/Id" }
        playlistId: { $ref: "#/components/schemas/Id" }
        watchTogetherId: { $ref: "#/components/schemas/Id" }
        libraryId: { $ref: "#/components/schemas/Id" }

    EventPage:
      type: object
      required: [cursor, resync, events]
      properties:
        cursor: { type: string, description: Where the next poll continues from. }
        resync: { type: boolean, description: "`after` could not be continued; reload everything shown." }
        events:
          type: array
          items: { $ref: "#/components/schemas/Event" }

    SyncRanges:
      type: object
      description: What this server syncs with.
      required: [apiMin, apiMax, schemaMin, schemaMax]
      properties:
        apiMin: { type: string, description: "The oldest API version, as info.version, whose action batches the server replays." }
        apiMax: { type: string, description: "The newest such version, the server's own." }
        schemaMin: { type: integer, minimum: 1, description: The oldest sync schema the server serves. }
        schemaMax: { type: integer, minimum: 1, description: The newest sync schema the server serves. }

    SyncScalar:
      description: >-
        A column value as SQLite holds it: a JSON integer, number, string or
        null, never a boolean, array or object; true and false are 1 and 0.
        A key part is never null. A BLOB column (an id) is its canonical
        lowercase UUID string.
      x-go-type: any

    SyncTable:
      type: object
      description: Rows of one table of the sync schema, each a value per column.
      required: [name, columns, rows]
      properties:
        name: { type: string }
        columns:
          type: array
          items: { type: string }
        rows:
          type: array
          items:
            type: array
            x-go-type: "[]any"
            items: { $ref: "#/components/schemas/SyncScalar" }

    SyncTombstones:
      type: object
      description: Rows deleted from one table of the sync schema, each by its primary key, its columns in the table's key order.
      required: [table, keys]
      properties:
        table: { type: string }
        keys:
          type: array
          items:
            type: array
            x-go-type: "[]any"
            minItems: 1
            maxItems: 3
            items: { $ref: "#/components/schemas/SyncScalar" }

    SyncChanges:
      type: object
      description: One page of a pass of getSyncChanges, or the mode to take instead.
      required: [mode, ranges]
      properties:
        mode: { type: string, enum: [diff, snapshot, unsupported] }
        ranges: { $ref: "#/components/schemas/SyncRanges" }
        version:
          type: integer
          format: int64
          minimum: 0
          description: With diff, the watermark; see getSyncChanges. Absent otherwise.
        cursor:
          type: string
          description: With diff, present while the pass has more pages; pass it back as `cursor`.
        tables:
          type: array
          description: With diff, the rows that changed, by table.
          items: { $ref: "#/components/schemas/SyncTable" }
        tombstones:
          type: array
          description: With diff, the rows deleted, by table.
          items: { $ref: "#/components/schemas/SyncTombstones" }

    SyncBell:
      type: object
      required: [changed, ranges]
      properties:
        changed: { type: boolean, description: True when getSyncChanges since `after` has something to answer. }
        ranges: { $ref: "#/components/schemas/SyncRanges" }

    SyncActionBatch:
      type: object
      required: [apiVersion, actions]
      properties:
        apiVersion: { type: string, maxLength: 64, description: "The API version, as info.version, of the spec the client was built from." }
        actions:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/SyncAction" }

    SyncTouched:
      type: object
      description: >-
        A row of the sync schema an action may change, by its primary key,
        its columns in the table's key order: a JSON integer for an
        INTEGER key column, a canonical lowercase UUID string for an id
        (BLOB) one, a string for a TEXT one.
      required: [table, key]
      properties:
        table: { type: string, maxLength: 64 }
        key:
          type: array
          x-go-type: "[]any"
          minItems: 1
          maxItems: 3
          items: { $ref: "#/components/schemas/SyncScalar" }

    SyncAction:
      type: object
      description: One queued write, the request it replays and the replica rows it wrote.
      required: [id, seq, operationId, method, path, actingProfileId, at, touched]
      properties:
        id: { type: string, format: uuid, description: "Chosen by the client, once per action." }
        seq: { type: integer, format: int64, minimum: 0, description: Its place in the client's queue. }
        operationId: { type: string, maxLength: 64 }
        method: { type: string, enum: [PUT, POST, DELETE] }
        path: { type: string, pattern: "^/", maxLength: 2048, description: "Relative to /api/v2, path parameters filled in and query included." }
        body: { description: "The request body; absent for none." }
        actingProfileId: { $ref: "#/components/schemas/Id" }
        at:
          type: string
          format: date-time
          description: >-
            When the action was taken on the device. An operation that orders
            writes by time reads its own instant, the `at` of its body or
            query, which the client sets to the same.
        touched:
          type: array
          maxItems: 5000
          description: The replica rows the client wrote for the action, including those it deleted.
          items: { $ref: "#/components/schemas/SyncTouched" }

    SyncActionResult:
      type: object
      required: [id, result]
      properties:
        id: { type: string, format: uuid }
        result: { type: string, enum: [accepted, rejected] }
        code:
          type: string
          description: >-
            With rejected, an Error code the operation answered, or
            not_replayable or unsupported_version, as replaySyncActions
            describes. Not an enum, so a later server may add codes.
        message: { type: string, description: "With rejected, the Error message." }

    SyncActionResults:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/SyncActionResult" }

    PlaybackSession:
      type: object
      description: A playback session as the profile's other devices see it.
      required: [id, itemId, deviceId, deviceName, platform, thisDevice, positionMs, modifiedAt, createdAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        itemId: { $ref: "#/components/schemas/Id" }
        deviceId: { $ref: "#/components/schemas/Id" }
        deviceName: { type: string, description: As Living Room in Playing on Living Room at 41:12. }
        platform: { $ref: "#/components/schemas/Platform" }
        thisDevice: { type: boolean, description: The calling device plays it. }
        positionMs: { type: integer, format: int64, minimum: 0, description: The last position the device reported. }
        createdAt: { type: string, format: date-time }
        modifiedAt: { type: string, format: date-time, description: When the device last reported. }
        endedAt: { type: string, format: date-time }
        movedToDeviceName:
          type: string
          description: The device Move here took it to, as Moved to Kitchen iPad; set only on a session ended that way.

    PlaybackSessionPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PlaybackSession" }
        nextOffset: { type: integer }

    DownloadQuality:
      type: string
      description: >-
        original, a size of the picture by its height, or aac256 for music.
        See resolveDownloads.
      enum: [original, 1080p, 720p, 480p, 360p, aac256]

    DownloadTarget:
      type: object
      description: Exactly one of itemId, collectionId and playlistId; editionId only with the itemId of a title.
      properties:
        itemId: { $ref: "#/components/schemas/Id" }
        editionId: { $ref: "#/components/schemas/Id" }
        collectionId: { $ref: "#/components/schemas/Id" }
        playlistId: { $ref: "#/components/schemas/Id" }

    DownloadResolveInput:
      type: object
      required: [targets, quality, snapshot]
      properties:
        targets:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: "#/components/schemas/DownloadTarget" }
        quality: { $ref: "#/components/schemas/DownloadQuality" }
        snapshot: { $ref: "#/components/schemas/CapabilitySnapshot" }

    DownloadTitle:
      type: object
      description: >-
        One title a request covers, and what the device would keep of it:
        quality to available, estimated set while sizeBytes is a prediction.
        watched and positionMs are the profile's progress, as WatchState
        has it for the edition named.
      required: [itemId, kind, libraryId, available, watched, positionMs]
      properties:
        itemId: { $ref: "#/components/schemas/Id" }
        kind: { type: string, enum: [movie, episode, song, video] }
        libraryId: { $ref: "#/components/schemas/Id" }
        editionId: { $ref: "#/components/schemas/Id" }
        runtimeMs: { type: integer, format: int64 }
        available: { type: boolean, description: The device can keep a file of it now. }
        quality: { $ref: "#/components/schemas/DownloadQuality" }
        verdict: { $ref: "#/components/schemas/Verdict" }
        container: { type: string, description: "The kept file's format: the file's own, mp4, or m4a." }
        sizeBytes: { type: integer, format: int64 }
        estimated: { type: boolean }
        watched: { type: boolean }
        positionMs: { type: integer, format: int64 }

    DownloadResolution:
      type: object
      required: [titles, sizeBytes]
      properties:
        titles:
          type: array
          items: { $ref: "#/components/schemas/DownloadTitle" }
        sizeBytes: { type: integer, format: int64, description: Of every available title. }

    DownloadSyncInput:
      type: object
      required: [itemIds]
      properties:
        itemIds:
          type: array
          minItems: 1
          maxItems: 5000
          items: { $ref: "#/components/schemas/Id" }

    DownloadSync:
      type: object
      required: [keep, remove]
      properties:
        keep:
          type: array
          items: { $ref: "#/components/schemas/Id" }
        remove:
          type: array
          items: { $ref: "#/components/schemas/Id" }

    DownloadInput:
      type: object
      required: [itemId, quality, snapshot]
      properties:
        id:
          $ref: "#/components/schemas/Id"
          description: >-
            The new download's id, a UUIDv7 the client chose; absent, the
            server chooses one. Used only when a new download is made: a file
            already claimed answers its download, with that download's id. An
            id already in use by another download answers 409.
        itemId: { $ref: "#/components/schemas/Id" }
        editionId:
          $ref: "#/components/schemas/Id"
          description: An edition of the item; absent is the default.
        audioTrackId:
          $ref: "#/components/schemas/Id"
          description: The audio a conversion keeps; absent is the default track. The file itself keeps all of its own.
        quality: { $ref: "#/components/schemas/DownloadQuality" }
        snapshot: { $ref: "#/components/schemas/CapabilitySnapshot" }

    DownloadBatchTitle:
      type: object
      required: [itemId]
      properties:
        id:
          $ref: "#/components/schemas/Id"
          description: >-
            The new download's id, a UUIDv7 the client chose; absent, the
            server chooses one. Used only when a new download is made: a file
            already claimed answers its download, with that download's id. An
            id already in use by another download answers 409, as that title's
            error conflict.
        itemId: { $ref: "#/components/schemas/Id" }
        editionId:
          $ref: "#/components/schemas/Id"
          description: An edition of the item; absent is the default.
        audioTrackId:
          $ref: "#/components/schemas/Id"
          description: The audio a conversion keeps; absent is the default track.

    DownloadBatchInput:
      type: object
      required: [titles, quality, snapshot]
      properties:
        titles:
          type: array
          minItems: 1
          maxItems: 5000
          items: { $ref: "#/components/schemas/DownloadBatchTitle" }
        quality: { $ref: "#/components/schemas/DownloadQuality" }
        snapshot: { $ref: "#/components/schemas/CapabilitySnapshot" }

    DownloadBatchResult:
      type: object
      description: What one title answered; exactly one of download and error.
      required: [itemId]
      properties:
        itemId: { $ref: "#/components/schemas/Id" }
        download: { $ref: "#/components/schemas/Download" }
        error: { $ref: "#/components/schemas/Error" }

    DownloadBatch:
      type: object
      required: [results]
      properties:
        results:
          type: array
          description: One per title, in request order.
          items: { $ref: "#/components/schemas/DownloadBatchResult" }

    DownloadSubtitle:
      type: object
      description: A text subtitle of the title, as WebVTT, fetched as the file is.
      required: [trackId, isForced, url]
      properties:
        trackId: { $ref: "#/components/schemas/Id" }
        language: { type: string }
        title: { type: string }
        isForced: { type: boolean, description: "Shown by default, as when streaming." }
        url: { type: string }

    Download:
      type: object
      description: |
        A device's claim on one title's file for a profile. Once status is
        ready, url is the file: a GET with the device's token as
        `Authorization: Bearer`, in ranges as the client likes, resumed
        with Range and If-Range (its ETag); after a failure the client asks
        again from where it stopped. The device's text subtitles are
        fetched the same way. A device locked at Who's watching is answered
        403 device_locked until a profile is picked, and a signed-out one
        401. A download that went answers 404: the client creates it again.
        estimated is set while sizeBytes is a prediction; progress is the
        share of a conversion made.

        Instead of polling, a client may fetch the file before it is ready
        with `?wait=1`, at `/api/v2/downloads/{id}/file`, url's path once
        ready: the request is held until the conversion is ready and then
        served as above. A conversion that failed, or fails while held,
        answers 500 internal with its error as the message. A download that
        goes while held answers 404. Without wait, a file not yet ready
        answers 409.
      required: [id, profileId, itemId, mediaFileId, quality, status, verdict, container, sizeBytes, estimated, progress, subtitles, createdAt, modifiedAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        profileId: { $ref: "#/components/schemas/Id" }
        itemId: { $ref: "#/components/schemas/Id" }
        editionId: { $ref: "#/components/schemas/Id" }
        mediaFileId: { $ref: "#/components/schemas/Id" }
        quality: { $ref: "#/components/schemas/DownloadQuality" }
        status: { type: string, enum: [queued, converting, ready, failed] }
        verdict: { $ref: "#/components/schemas/Verdict" }
        container: { type: string }
        sizeBytes: { type: integer, format: int64 }
        estimated: { type: boolean }
        progress: { type: number, format: double, minimum: 0, maximum: 1 }
        error: { type: string, description: Why the conversion failed. }
        url: { type: string, description: Set once ready. }
        subtitles:
          type: array
          items: { $ref: "#/components/schemas/DownloadSubtitle" }
        createdAt: { type: string, format: date-time }
        modifiedAt: { type: string, format: date-time }
        createdBy: { $ref: "#/components/schemas/Id", description: "The profile that created it; absent when none did, as for what the server made, or when that profile is gone." }
        modifiedBy: { $ref: "#/components/schemas/Id", description: "The profile that last changed it; absent when none did, as for what the server made, or when that profile is gone." }
        expiresAt: { type: string, format: date-time, description: Absent while the conversion is still to finish. }

    DownloadPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Download" }
        nextOffset: { type: integer }

    Conversion:
      type: object
      description: >-
        One file the server makes for downloads, shared by every download
        of the same file at the same quality. height and bitrate are the
        converted picture's, 0 when it is copied; a song's bitrate is its
        audio's.
      required: [id, mediaFileId, status, verdict, container, height, bitrate, sizeBytes, estimated, progress, downloads, createdAt, modifiedAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        mediaFileId: { $ref: "#/components/schemas/Id" }
        status: { type: string, enum: [queued, converting, ready, failed] }
        verdict: { $ref: "#/components/schemas/Verdict" }
        container: { type: string, enum: [mp4, m4a] }
        codec: { type: string, description: The converted picture's codec. }
        height: { type: integer }
        bitrate: { type: integer, format: int64 }
        sizeBytes: { type: integer, format: int64 }
        estimated: { type: boolean }
        progress: { type: number, format: double, minimum: 0, maximum: 1 }
        downloads: { type: integer, description: The downloads that need it. }
        error: { type: string }
        createdAt: { type: string, format: date-time }
        modifiedAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }

    ConversionPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Conversion" }
        nextOffset: { type: integer }
