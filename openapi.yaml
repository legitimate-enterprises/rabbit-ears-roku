        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Links.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdultLinkPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createAdultLink
      tags: [admin]
      summary: >-
        Links two joined, unrevoked adults whose own households differ, so
        each sees the other: among the people they share with and watch
        together with, and as an adult to offer their household's profiles
        to. A pair linked already, or adults of one household, answer 409.
      security:
        - device: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdultLinkInput" }
      responses:
        "201":
          description: Linked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdultLink" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /adult-links/{accountId}/{otherAccountId}:
    parameters:
      - $ref: "#/components/parameters/AccountId"
