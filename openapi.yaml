      properties:
        showId: { $ref: "#/components/schemas/Id" }
        seasons: { type: integer, description: "Seasons, specials included." }
        episodes: { type: integer }
        unwatched: { type: integer, description: Episodes not marked watched. }
        inProgress: { type: boolean, description: "An episode has a resume position, watched or not." }
        lastPlayedAt: { type: string, format: date-time, description: Latest across the show's episodes; absent when none was played. }
        nextEpisodeId:
          $ref: "#/components/schemas/Id"
          description: >-
            Of the episodes watched or in progress, the latest played is next
