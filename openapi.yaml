        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /collections:
    get:
      operationId: listCollections
      tags: [collections]
      summary: The movie collections the active profile may see, by name.
      description: |
        A collection is a set of movies from the Movies libraries, either a
        TMDB franchise collection or a custom one kept on the server. A TMDB
        collection is server-wide, read-only, and listed once the library
        holds two of its movies; it never names parts the library lacks. A
