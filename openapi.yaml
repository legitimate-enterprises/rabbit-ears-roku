      tags: [playlists]
      summary: One household share, by the household. Owner only, as listPlaylistHouseholdShares.
      responses:
        "200":
          description: Household share.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistHouseholdShare" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }
    put:
      operationId: replacePlaylistHouseholdShare
      tags: [playlists]
      summary: Changes a household share's access. Owner only; its kids still only read.
      x-replayable: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaylistShareChange" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistHouseholdShare" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }
    delete:
      operationId: deletePlaylistHouseholdShare
      tags: [playlists]
      summary: Stops sharing with that household. Owner only. The stations that play the playlist of those it no longer reaches any other way are deleted with the share.
      x-replayable: true
      responses:
        "204": { description: No longer shared. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /profiles/{profileId}/playlists/{playlistId}/image:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
      - $ref: "#/components/parameters/PlaylistId"
    get:
      operationId: getPlaylistImage
      tags: [playlists]
      summary: The playlist's custom image, which Playlist.imageUrl points at.
      description: >-
        Anyone the playlist is shown to. Not found while it has none, and,
        for a title's artwork, while that title is not one of the
        playlist's entries or the active profile may not see it.
      parameters:
        - $ref: "#/components/parameters/ImageVersion"
        - name: If-None-Match
          in: header
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/CustomImage" }
        "304": { $ref: "#/components/responses/CustomImageCurrent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: replacePlaylistImage
      tags: [playlists]
      summary: Sets the playlist's custom image. Owner only; anyone else answers 403.
      description: |
        The image file itself as application/octet-stream, or as JSON one
        of the playlist's titles and which of its artwork, or an image
        link; see CustomImageInput. A file, uploaded or fetched, must be a
        JPEG, PNG, GIF or WebP image of at most 50 megapixels; it is kept
        as a JPEG at most 1600 pixels on its longer side, without its
        metadata. A body that is not answers 400 on body, a link that does
        not answers 400 on url.
      x-upload: true
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
          application/json:
            schema: { $ref: "#/components/schemas/CustomImageInput" }
      responses:
        "200":
          description: The playlist with its new imageUrl.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Playlist" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deletePlaylistImage
      tags: [playlists]
      summary: Removes the custom image, so the playlist shows its first entry's poster again. Owner only; anyone else answers 403.
      responses:
        "204": { description: "Removed, or there was none." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

