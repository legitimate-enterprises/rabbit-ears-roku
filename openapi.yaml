  /conversions/{conversionId}:
    parameters:
      - $ref: "#/components/parameters/ConversionId"
    get:
      operationId: getConversion
      tags: [admin]
      security:
        - device: [admin]
      responses:
        "200":
          description: Conversion.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
