        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteConversion
      tags: [admin]
      security:
        - device: [admin]
      summary: Stops a conversion and removes it, its file and the downloads that need it.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: Live updates. What changed for the active profile since `after`, held until something has.
      description: |
        Plain HTTP long polling, as Watch together's, so every client can
        follow, Roku included. A signed-in client asks without `after` for
        the `cursor` to start from, then asks again with the cursor of each
        answer as soon as it arrives. With `after`, the answer waits until
        an event the active profile hears exists, at most 25 seconds, then
        answers with those events, oldest first, or with none.

        An event names what changed by kind and ids, never by title. The
        client reads the change through the ordinary operations, which
        decide what its profile may see, and refreshes what it shows
        without a spinner or a scroll jump. Events are scoped: a profile
        hears of its own watch state and playback sessions, of the
        playlists it owns or is shared, of the stations it may see and of
        the Watch togethers listWatchTogethers finds. An event naming an item the
        profile's kid filter hides is never sent to it.

        A client hears the kinds watch_state, playback, station,
        watch_together and playlist, and of the later kinds only those it
        names in `kinds`: a kind added to EventKind is only ever sent to a
        client that asks for it. The cursor moves past events of a kind
        not asked for as past those of another profile.

        The server keeps the last 512 events in memory. `resync` is true
        when `after` cannot be continued, being from before a restart or
        further back than that: the client reloads all it shows and
        follows on from `cursor`. A client stops asking while signed out,
        locked or in the background. On return it asks again with its last
        cursor, which the server continues from or answers with `resync`,
        or it reloads once and starts again without `after`. A failed poll
        is retried with a growing delay.
      parameters:
        - name: after
          in: query
          description: The `cursor` of the last answer; opaque.
          schema: { type: string, maxLength: 64 }
        - name: kinds
          in: query
          description: >-
            The later kinds the client follows besides the first five, as
            `kinds=library`; repeated for more than one.
          schema:
            type: array
            maxItems: 16
            items: { $ref: "#/components/schemas/EventKind" }
      responses:
        "200":
          description: Events.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /sync/changes:
    get:
      operationId: getSyncChanges
      tags: [sync]
      summary: What changed in this device's replica since a version.
      description: |
        A native client keeps a replica: a local SQLite database of what its
        household may see, in a sync schema the server defines. It fills it
        from getSyncSnapshot, then keeps it current from this operation, on
        every start, return to the foreground, reconnection and ring of
        waitSyncVersion.

        Every change the server makes moves a version, one global counter.
        A pass asks with `since`, the version the replica holds, and without
        `cursor`. An answer with mode `diff` and a `cursor` has more to read:
        the client asks again with the same `since` and `schema` and that
        cursor, until an answer comes without one. Each row appears at most
        once per pass, in its state at the time it was read; it replaces the
        replica's row of the same key in that table. Each tombstone deletes
        the replica's row of that key, if it holds one. The replica has no
        foreign keys, so rows and tombstones apply in the order given or any
        other.

        `version` is the watermark: a client that applied every page of a
        pass holds everything up to `version`, and asks from it next time.
        A page with a `cursor` reports `since` as its `version`, so a client
        that stops mid-pass keeps its `since` and loses nothing by starting
        the pass again.

        Mode `snapshot` carries no rows: the client replaces its replica with
        getSyncSnapshot, then catches up from that snapshot's version. It is
        the answer, on any page, when `since` is absent; when `since` is older
        than the deletions the server keeps (90 days) or newer than the
        server's version, as after a restore; when a change after
        `since` altered which rows the household's replica holds, such as a
        membership, adult link, share, profile offer, a station made,
        deleted or changing visibility, owner or playlist, or a device moving
        household, or when the server was upgraded; and, on a
        first page, when more rows changed since `since` than half the
        replica holds.

        Mode `unsupported` carries no rows: `schema` is outside
        `ranges.schemaMin` to `ranges.schemaMax`. A client below schemaMin
        updates before it syncs again; one above schemaMax waits for the
        server to be upgraded.
      parameters:
        - name: schema
          in: query
          required: true
          description: The sync schema the client's replica uses.
          schema: { type: integer, minimum: 1 }
        - name: since
          in: query
          description: The `version` the replica holds; absent for none.
          schema: { type: integer, format: int64, minimum: 0 }
        - name: cursor
          in: query
          description: The `cursor` of the previous page of this pass; opaque.
          schema: { type: string, maxLength: 128 }
        - name: limit
          in: query
          description: At most this many rows and tombstones on the page.
          schema: { type: integer, minimum: 1, maximum: 5000, default: 1000 }
      responses:
        "200":
          description: A page of changes, or the mode the client must take instead.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncChanges" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /sync/snapshot:
    get:
      operationId: getSyncSnapshot
      tags: [sync]
      summary: This device's whole replica as a SQLite database.
      description: |
        The replica of the device's household in sync schema `schema`, as
        one SQLite database: the schema's tables holding every row the
        household may see, its views, among them those that apply each
        profile's kid filter such as profile_item and profile_station, and
        its indexes. Every id column, `household_id` included, holds the
        id's 16 bytes as a BLOB; getSyncChanges sends the same ids as
        canonical UUID strings, which the client writes back as those bytes.
        Its one-row table replica_meta holds `schema`, `version`, the
        version the snapshot was taken at, and `household_id`. The client replaces
        its replica with the file whole, then asks getSyncChanges with
        `since` set to replica_meta's `version`. A `schema` outside
        SyncRanges' schemaMin to schemaMax answers 400.
      parameters:
        - name: schema
          in: query
          required: true
          description: The sync schema the client's replica uses.
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: The replica.
          content:
            application/vnd.sqlite3:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /sync/version:
    get:
      operationId: waitSyncVersion
      tags: [sync]
      summary: Wait until this device's replica has changes to read.
      description: >-
        A long poll, held as listEvents is, at most 25 seconds. It answers
        `changed` true as soon as getSyncChanges since `after` would answer
        a row, a tombstone or mode `snapshot`, else false when the time is
        up; it carries no data. A client asks with the version its replica
        holds while it is in the foreground, runs getSyncChanges on true,
        and asks again at once on false. A write elsewhere that the
        household cannot see does not ring, except a deletion from a table
        keyed by a single id, which reaches every household as a tombstone.
      parameters:
        - name: after
          in: query
          required: true
          description: The `version` the replica holds.
          schema: { type: integer, format: int64, minimum: 0 }
      responses:
        "200":
          description: Whether there are changes to read.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncBell" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /sync/actions:
    post:
      operationId: replaySyncActions
      tags: [sync]
      summary: Replay writes a client queued, in order.
      description: |
        A client writes to its replica at once and queues each write as an
        action naming an operation marked `x-replayable`, to send when it is
        online. The server runs the actions in `seq` order, each as the
        request it names would run, with the same validation, permissions
        and rules, as `actingProfileId`, which must be a profile of the
        device's household that is not revoked, with that profile's
        permissions at the time of the replay. A profile's PIN is not asked,
        and a device locked at Who's watching replays too and stays locked.

        Each action the server answers gets one result: `accepted` when the
        operation succeeded, `rejected` with the operation's Error `code`
        when it answered 4xx. An operation not marked `x-replayable`, or a
        `path` and `method` that are not `operationId`'s, is rejected with
        `not_replayable`; an `actingProfileId` outside the household, or
        revoked, with `not_found`. When an operation fails on the server, a 5xx, the
        batch stops there: that action and every later one are absent from
        `results`, and the client sends them again later. The client
        removes from its queue only the actions answered.

        The server remembers each answered action's `id` for 90 days per
        device: an action sent again answers its stored result without
        running again. A batch whose `apiVersion` is outside SyncRanges'
        apiMin to apiMax rejects every action with `unsupported_version`,
        runs and remembers none.

        After each answered action, accepted or rejected, the server marks
        every row in its `touched` as changed, or a deletion when the row
        no longer exists, so the next getSyncChanges brings the replica's
        copy of each to what the server holds; a row that exists but the
        household may not see is left alone. A client keeps no rollback of
        its own.

        A batch that fails validation, names in `touched` a table that is
        not one of the sync schema's, a key of the wrong length or a key
        part of the wrong type (an integer for an integer column, a
        canonical UUID string for an id column, a string for a text one), or
        whose `seq` does not strictly increase, answers 400 and runs nothing.
      x-while-locked: true
      x-upload: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyncActionBatch" }
      responses:
        "200":
          description: A result for each action answered, in the batch's order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncActionResults" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    device:
      type: http
      scheme: bearer
      description: Device token. The `admin` scope requires an admin adult.

  parameters:
    LogLevel:
      name: level
      in: query
      description: Minimum level; entries at or above it match.
      schema: { $ref: "#/components/schemas/LogLevel" }
    LogSource:
      name: source
      in: query
      schema: { type: string }
    LogSince:
      name: since
      in: query
      schema: { type: string, format: date-time }
    LogUntil:
      name: until
      in: query
      schema: { type: string, format: date-time }
    LogQuery:
      name: q
      in: query
      description: Case-insensitive substring of the message.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    ProfileId:
      name: profileId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    LibraryId:
      name: libraryId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    GenreId:
      name: genreId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    OccasionId:
      name: occasionId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    PersonId:
      name: personId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    MediaFileId:
      name: mediaFileId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    DownloadId:
      name: downloadId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    ConversionId:
      name: conversionId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    JoinCodeParam:
      name: code
      in: path
      required: true
      schema: { type: string, pattern: "^[0-9A-Z]{4}-[0-9A-Z]{4}$" }
    DeviceLinkId:
      name: linkId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    OfferId:
      name: offerId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    LinkToken:
      name: token
      in: query
      required: true
      description: The link's poll token. In the query so a TV can load the QR image by URL alone.
      schema: { type: string, minLength: 1, maxLength: 200 }
    ArtistId:
      name: artistId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    AlbumId:
      name: albumId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    SongId:
      name: songId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    ChannelId:
      name: channelId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    VideoId:
      name: videoId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    PlaylistId:
      name: playlistId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    PlaylistEntryId:
      name: entryId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    ShareProfileId:
      name: shareProfileId
      in: path
      required: true
      description: The profile the playlist is shared with.
      schema: { $ref: "#/components/schemas/Id" }
    ShareHouseholdId:
      name: householdId
      in: path
      required: true
      description: The household the playlist is shared with.
      schema: { $ref: "#/components/schemas/Id" }
    CollectionId:
      name: collectionId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    WatchTogetherId:
      name: watchTogetherId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    WatchTogetherRttMs:
      name: rttMs
      in: query
      description: >-
        The member's latest round trip to the server, in milliseconds, from
        a request that was not held. Without it the member needs the full
        second.
      schema: { type: integer, minimum: 0 }
    WatchTogetherFloorMs:
      name: floorMs
      in: query
      description: >-
        The least lead, in milliseconds, the member's player needs to start
        on time, for a platform that starts imprecisely. Used with `rttMs`.
      schema: { type: integer, minimum: 0 }
    StationId:
      name: stationId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    ImageVersion:
      name: v
      in: query
      description: Read by nothing; imageUrl carries it, the image's id, so that a new image has a new address.
      schema: { type: string, maxLength: 64 }
    SsoProviderId:
      name: providerId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    MusicLetter:
      name: letter
      in: query
      description: Only those filed under this letter of `listMusicLetters`.
      schema: { type: string, pattern: "^[A-Z#]$" }

  responses:
    BadRequest:
      description: The request failed validation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing, unknown or revoked device token, or bad credentials.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated but not allowed, such as a non-admin on an admin operation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such resource visible to this device.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    CustomImage:
      description: >-
        The image, a JPEG the server keeps, or the title's artwork, which can
        change under the same address and so is revalidated at every use.
      headers:
        ETag:
          required: true
          schema: { type: string }
        Cache-Control:
          required: true
          schema: { type: string }
      content:
        image/*:
          schema: { type: string, format: binary }
    CustomImageCurrent:
      description: The client's copy, named by If-None-Match, is current.
      headers:
        ETag:
          required: true
          schema: { type: string }
        Cache-Control:
          required: true
          schema: { type: string }
    Conflict:
      description: The write collides with existing state.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Too many attempts; try again after Retry-After seconds.
      headers:
        Retry-After:
          required: true
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotImplemented:
      description: Not available in this server version.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    SignedIn:
      description: Device signed in.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SignInResult" }
    PlaybackUpdated:
      description: Whether to keep playing or switch to a new stream.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlaybackUpdate" }

  schemas:
    Id:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      x-go-type: uid.ID
      x-go-type-import:
        path: github.com/legitimate-enterprises/rabbit-ears/server/internal/uid

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - bad_request
            - unauthorized
            - forbidden
            - not_found
            - conflict
            - pin_required
            - pin_locked
            - device_locked
            - too_many_requests
            - payload_too_large
            - not_implemented
            - internal
            - off_air
        message: { type: string }
        fields:
          type: array
          description: Per-field problems for bad_request.
          items: { $ref: "#/components/schemas/FieldError" }
        resumesAt:
          type: string
          format: date-time
          description: With off_air, when the station's next program starts; absent when none is scheduled.

    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string }
        message: { type: string }

    Health:
      type: object
      required: [status, version, setupRequired]
      properties:
        status: { type: string, enum: [ok] }
        version: { type: string, description: Server SemVer. }
        setupRequired: { type: boolean, description: True until first run has created the admin. }
        serverName: { type: string, description: Set at first run. }

    Attribution:
      type: object
      required: [provider, text, url]
      properties:
        provider: { type: string, example: TMDB }
        text: { type: string, description: The notice to show verbatim. }
        url: { type: string, description: Where the provider lives. }

    Platform:
      type: string
      enum: [web, macos, ios, tvos, roku, android]

    SetupRequest:
      type: object
      required: [serverName, name, email, password, deviceName, platform]
      properties:
        serverName: { type: string, minLength: 1, maxLength: 100 }
        name: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 72 }
        deviceName: { type: string, minLength: 1, maxLength: 100 }
        platform: { $ref: "#/components/schemas/Platform" }

    SignInRequest:
      type: object
      required: [email, password, deviceName, platform]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }
        deviceName: { type: string, minLength: 1, maxLength: 100 }
        platform: { $ref: "#/components/schemas/Platform" }

    PasswordInput:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 8, maxLength: 72 }

    PasswordChange:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1 }
        newPassword: { type: string, minLength: 8, maxLength: 72 }

    PasswordConfirmation:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 1 }

    AccountDeletion:
      type: object
      description: |
        What deleting the active adult's own account takes with it. The
        account always goes with everything of its own: its devices, watch
        state, playlists with their shares and the stations that play them,
        the shares it was given, its stations, its single sign-on links,
        its device links and its Watch together. Custom collections belong
        to the household and go only with it.
      required: [outcome, kidNames]
      properties:
        outcome:
          type: string
          enum: [account, transfer, household, refused]
          description: |
            account: the household stays as it is. transfer: the account
            owns the household, which passes to `newOwnerName`, its adult
            who joined it earliest; its kids stay. household: the account is
            the household's only adult, so the household goes too, with its
            kids, the adults invited to it and everything of theirs, but for
            the kids and adults another household holds too, who stay with
            all of theirs.
            refused: the account is the server's only admin and stays until
            another account is made an admin.
        newOwnerName: { type: string, description: "The adult the household passes to, on transfer." }
        kidNames:
          type: array
          description: The kids deleted with the household, never one another household holds; empty unless the household goes.
          items: { type: string }

    AcceptRequest:
      type: object
      required: [name, password, deviceName, platform]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        password: { type: string, minLength: 8, maxLength: 72 }
        deviceName: { type: string, minLength: 1, maxLength: 100 }
        platform: { $ref: "#/components/schemas/Platform" }

    SignInResult:
      type: object
      required: [token, me]
      properties:
        token: { type: string, description: Bearer token for this device. Shown once. }
        me: { $ref: "#/components/schemas/Me" }
        households:
          type: array
          description: >-
            Present only when the adult is in more than one household: each
            of them, their own first, which the device starts in. moveDevice
            moves the device to another.
          items: { $ref: "#/components/schemas/HouseholdChoice" }

    HouseholdChoice:
      type: object
      required: [id, name]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string }

    DeviceHouseholdInput:
      type: object
      required: [householdId]
      properties:
        householdId: { $ref: "#/components/schemas/Id" }

    JoinPreview:
      type: object
      required: [name, expiresAt]
      properties:
        name: { type: string, description: Prefilled name of the invitee. }
        invitedBy: { type: string }
        expiresAt: { type: string, format: date-time }

    Me:
      type: object
      required: [device, account, activeProfileId, profiles]
      properties:
        device: { $ref: "#/components/schemas/Device" }
        account: { $ref: "#/components/schemas/Account" }
        activeProfileId:
          $ref: "#/components/schemas/Id"
          description: The profile this device currently acts as; the adult after sign in.
        household: { $ref: "#/components/schemas/Household" }
        profiles:
          type: array
          description: |
            The household's adults and kids, owner first. Pending adults
            are included only while the owner is the active profile.
          items: { $ref: "#/components/schemas/Account" }
        locked:
          type: boolean
          description: Whether this device is locked at Who's watching, waiting for a profile to be unlocked.

    PinRequest:
      type: object
      required: [pin]
      properties:
        pin: { type: string, pattern: "^[0-9]{4}$" }

    UnlockRequest:
      type: object
      properties:
        pin: { type: string, pattern: "^[0-9]{4}$", description: Required when the profile has a PIN. }

    CeilingSuggestion:
      type: object
      required: [age, movieCeiling, tvCeiling]
      properties:
        age: { type: integer, description: Whole years today. }
        movieCeiling: { $ref: "#/components/schemas/MovieRating" }
        tvCeiling: { $ref: "#/components/schemas/TvRating" }

    AccountKind:
      type: string
      enum: [adult, kid]

    FilterMode:
      type: string
      enum: [ratings, allow_list]

    MovieRating:
      type: string
      description: MPAA rating used as a kid's movie ceiling.
      enum: [G, PG, PG-13, R, NC-17]

    TvRating:
      type: string
      description: TV Parental Guidelines rating used as a kid's TV ceiling.
      enum: [TV-Y, TV-Y7, TV-G, TV-PG, TV-14, TV-MA]

    Account:
      type: object
      required: [id, kind, name, isAdmin, hasPin, pinLocked, pending, filterMode, createdAt, modifiedAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        kind: { $ref: "#/components/schemas/AccountKind" }
        email: { type: string, description: Adults only. }
        name: { type: string }
        isAdmin: { type: boolean }
        householdId:
          $ref: "#/components/schemas/Id"
          description: >-
            An adult's own household, where they are an adult; one of a
            kid's households, which stands no differently from the others.
        householdIds:
          type: array
          description: >-
            On the admin operations on accounts only: every household the
            profile is in, `householdId` first.
          items: { $ref: "#/components/schemas/Id" }
        households:
          type: integer
          minimum: 1
          description: >-
            On getMe, listProfiles and the profile operations: how many
            households the profile is in. More than one marks a profile
            shared with another household.
        present:
          type: boolean
          description: >-
            On getMe, listProfiles and the profile operations: an adult whose
            own household is not the device's, there to watch only. They
            manage nothing in it, so a client hides its household settings
            while they are active.
        birthday: { type: string, format: date }
        hasPin: { type: boolean }
        pinLocked: { type: boolean, description: Locked after five failed PIN attempts. }
        pending: { type: boolean, description: An adult who has not accepted a join link yet. }
        inviteExpiresAt:
          type: string
          format: date-time
          description: When a pending adult's usable join code expires, in the owner's profile list only; absent when none is usable.
        filterMode: { $ref: "#/components/schemas/FilterMode" }
        movieCeiling: { $ref: "#/components/schemas/MovieRating" }
        tvCeiling: { $ref: "#/components/schemas/TvRating" }
        color:
          $ref: "#/components/schemas/ProfileColor"
          description: Always present. The profile's own color, else the one the server gives it.
        avatarUrl:
          type: string
          description: >-
            Server-relative URL of the adult's Gravatar picture, served by
            getProfileAvatar with the device token like artwork. Present on
            getMe, listProfiles and getProfile only, for an adult whose
            email has a Gravatar while the gravatar setting is on; absent
            for kids. Clients never contact gravatar.com.
        hideKidsContent:
          type: boolean
          description: >-
            Adults only: whether this adult's browsing leaves out kids'
            content (Item.kidsContent movies and shows with their seasons
            and episodes, and YouTubeChannel.forKids channels with their
            videos), in every list that browses titles: items, search,
            collections, genres, people, playlists, stations and YouTube.
            Opening one item, playing it and listItems with
            kidsContent=true are not affected. Set with
            setProfilePreferences.
        autoplay:
          type: boolean
          description: >-
            Always present. Whether Up next plays the next item when a
            movie, episode or video ends, after a 10-second countdown; on
            for a new profile. Set with setProfilePreferences.
        revokedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        modifiedAt: { type: string, format: date-time }
        createdBy: { $ref: "#/components/schemas/Id", description: "The profile that created it; absent when none did, as for what the server made, or when that profile is gone." }
        modifiedBy: { $ref: "#/components/schemas/Id", description: "The profile that last changed it; absent when none did, as for what the server made, or when that profile is gone." }

    ProfileColor:
      type: string
      description: >-
        One of the server's eight profile colors: #3C4170, #2E6B5B,
        #6B3A2E, #5B4A8A, #8A5A2B, #2E5B8A, #6B2E5A, #4A6B2E. Any other
        value is a bad_request.
      pattern: "^#[0-9A-F]{6}$"

    ProfilePreferences:
      type: object
      description: Each field absent keeps the profile's.
      properties:
        color: { $ref: "#/components/schemas/ProfileColor" }
        hideKidsContent:
          type: boolean
          description: The active adult's own only; on any other profile it answers 403.
        autoplay:
          type: boolean
          description: The active profile's own, or an adult's for a kid of the household.

    AccountInput:
      type: object
      description: Households are set by joining and by profiles, never here.
      required: [kind, name]
      properties:
        id:
          $ref: "#/components/schemas/Id"
          description: >-
            On createAccount: the new account's id, a UUIDv7 the client chose; absent, the
            server chooses one. An id already in use answers 409. On replaceAccount,
            an id other than the path's answers 400.
        kind: { $ref: "#/components/schemas/AccountKind" }
        email: { type: string, format: email, description: Required for adults. }
        name: { type: string, minLength: 1, maxLength: 100 }
        isAdmin: { type: boolean, default: false }
        birthday: { type: string, format: date, description: Absent keeps the stored birthday. }
        filterMode: { $ref: "#/components/schemas/FilterMode", description: Absent keeps the stored mode; ratings for a new account. }
        movieCeiling:
          $ref: "#/components/schemas/MovieRating"
          description: Kids only. Absent under ratings is the ceiling suggested for the kid's age, when the kid has a birthday.
        tvCeiling:
          $ref: "#/components/schemas/TvRating"
          description: Kids only. Absent under ratings is the ceiling suggested for the kid's age, when the kid has a birthday.
        revoked:
          type: boolean
          description: >-
            True revokes the account and its devices, false restores the
            account, and absent keeps it as it is.

    ProfileInput:
      type: object
      required: [name, birthday]
      properties:
        id:
          $ref: "#/components/schemas/Id"
          description: >-
            On createProfile: the new kid's id, a UUIDv7 the client chose; absent, the
            server chooses one. An id already in use answers 409. On replaceProfile,
            an id other than the path's answers 400.
        name: { type: string, minLength: 1, maxLength: 100 }
        birthday: { type: string, format: date }
        filterMode: { $ref: "#/components/schemas/FilterMode", description: Absent keeps the stored mode; ratings for a new kid. }
        movieCeiling: { $ref: "#/components/schemas/MovieRating" }
        tvCeiling: { $ref: "#/components/schemas/TvRating" }
        color:
          $ref: "#/components/schemas/ProfileColor"
          description: Absent gives a new kid the color least used in the household and keeps an existing kid's.

    AccountPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Account" }
        nextOffset: { type: integer }

    AllowList:
      type: object
      required: [itemIds]
      properties:
        itemIds:
          type: array
          items: { $ref: "#/components/schemas/Id" }

    FavoriteKind:
      type: string
      description: The kinds of item a profile favorites.
      enum: [movie, show, season, episode, artist, album, song, video]

    Favorite:
      type: object
      required: [itemId, kind, createdAt]
      properties:
        itemId: { $ref: "#/components/schemas/Id" }
        kind: { $ref: "#/components/schemas/FavoriteKind" }
        createdAt: { type: string, format: date-time, description: When the profile favorited it. }

    FavoritePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Favorite" }
        nextOffset: { type: integer }

    AllowedFor:
      type: object
      required: [profileIds]
      properties:
        profileIds:
          type: array
          description: >-
            The kids of the device household on a manual allow list whose
            list holds the item itself, by id.
          items: { $ref: "#/components/schemas/Id" }

    Household:
      type: object
      required: [id, name, adultId, createdAt, modifiedAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        adultId: { $ref: "#/components/schemas/Id", description: The owner. }
        createdAt: { type: string, format: date-time }
        modifiedAt: { type: string, format: date-time }
        createdBy: { $ref: "#/components/schemas/Id", description: "The profile that created it; absent when none did, as for what the server made, or when that profile is gone." }
        modifiedBy: { $ref: "#/components/schemas/Id", description: "The profile that last changed it; absent when none did, as for what the server made, or when that profile is gone." }

    HouseholdInput:
      type: object
      required: [name, adultId]
      properties:
        id:
          $ref: "#/components/schemas/Id"
          description: >-
            On createHousehold: the new household's id, a UUIDv7 the client chose; absent, the
            server chooses one. An id already in use answers 409. On replaceHousehold,
            an id other than the path's answers 400.
        name: { type: string, minLength: 1, maxLength: 100 }
        adultId: { $ref: "#/components/schemas/Id" }

    ProfileOffer:
      type: object
      description: >-
        An adult's offer of a profile of their household to an adult linked
        with them. It names what neither side may otherwise read.
      required: [id, profileId, profileName, profileKind, householdId, householdName, fromProfileId, fromName, toProfileId, toName, createdAt, modifiedAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        profileId: { $ref: "#/components/schemas/Id" }
        profileName: { type: string }
        profileKind: { $ref: "#/components/schemas/AccountKind" }
        householdId: { $ref: "#/components/schemas/Id", description: The offering household. }
        householdName: { type: string }
        fromProfileId: { $ref: "#/components/schemas/Id", description: The adult who offered. }
        fromName: { type: string }
        toProfileId: { $ref: "#/components/schemas/Id", description: The adult offered to. }
        toName: { type: string }
        createdAt: { type: string, format: date-time }
        modifiedAt: { type: string, format: date-time }
        createdBy: { $ref: "#/components/schemas/Id", description: "The profile that created it; absent when none did, as for what the server made, or when that profile is gone." }
        modifiedBy: { $ref: "#/components/schemas/Id", description: "The profile that last changed it; absent when none did, as for what the server made, or when that profile is gone." }

    ProfileOfferInput:
      type: object
      required: [profileId, toProfileId]
      properties:
        id:
          $ref: "#/components/schemas/Id"
          description: >-
            On createProfileOffer: the new offer's id, a UUIDv7 the client chose; absent, the
            server chooses one. An id already in use answers 409.
        profileId: { $ref: "#/components/schemas/Id" }
        toProfileId: { $ref: "#/components/schemas/Id", description: A linked adult. }

    ProfileOfferList:
      type: object
      required: [incoming, outgoing]
      properties:
        incoming:
          type: array
          description: Made to the active adult.
          items: { $ref: "#/components/schemas/ProfileOffer" }
        outgoing:
          type: array
          description: Of the device household's profiles; empty for an adult only present there.
          items: { $ref: "#/components/schemas/ProfileOffer" }

    AdultLink:
      type: object
      description: Two adults of different households who see each other.
      required: [accountId, otherAccountId, tv, createdAt]
      properties:
        accountId: { $ref: "#/components/schemas/Id", description: The lower id of the two. }
        otherAccountId: { $ref: "#/components/schemas/Id" }
        tv: { type: boolean, description: Whether they see each other on TVs too; off TVs they always do. }
        createdAt: { type: string, format: date-time }

    AdultLinkInput:
      type: object
      required: [accountId, otherAccountId]
      properties:
        accountId: { $ref: "#/components/schemas/Id" }
        otherAccountId: { $ref: "#/components/schemas/Id" }
        tv: { type: boolean, default: false }

    AdultLinkUpdate:
      type: object
      required: [tv]
      properties:
        tv: { type: boolean }

    AdultLinkPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdultLink" }
        nextOffset: { type: integer }

    HouseholdPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Household" }
        nextOffset: { type: integer }

    Device:
      type: object
      required: [id, name, platform, accountId, householdId, createdAt, modifiedAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        platform: { $ref: "#/components/schemas/Platform" }
        accountId: { $ref: "#/components/schemas/Id" }
        householdId: { $ref: "#/components/schemas/Id" }
        lastSeenAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        modifiedAt: { type: string, format: date-time }

    DeviceInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        revoked: { type: boolean, description: "True revokes the device, false restores it, and absent keeps it as it is." }

    DevicePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Device" }
        nextOffset: { type: integer }

    JoinCode:
      type: object
      required: [id, code, link, accountId, expiresAt, createdAt, modifiedAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        code: { type: string, examples: ["7KQ4-MNP2"] }
        link: { type: string, description: Server-relative join path to send to the invitee. }
        accountId: { $ref: "#/components/schemas/Id" }
        expiresAt: { type: string, format: date-time }
        usedAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        modifiedAt: { type: string, format: date-time }
        createdBy: { $ref: "#/components/schemas/Id", description: "The profile that created it; absent when none did, as for what the server made, or when that profile is gone." }
        modifiedBy: { $ref: "#/components/schemas/Id", description: "The profile that last changed it; absent when none did, as for what the server made, or when that profile is gone." }

    DeviceLinkStatus:
      type: string
      description: |
        Pending until an adult approves or denies the code. Expired once its
        10 minutes pass undecided, or approved but never collected by the
        device within them.
      enum: [pending, approved, denied, expired]

    DeviceLinkInput:
      type: object
      required: [deviceName, platform]
      properties:
        deviceName: { type: string, minLength: 1, maxLength: 100 }
        platform: { $ref: "#/components/schemas/Platform" }

    DeviceLinkCreated:
      type: object
      required: [id, code, link, expiresAt, pollToken]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        code: { type: string, examples: ["7KQ4-MNP2"], description: Join-code format; the device shows it. }
        link:
          type: string
          examples: ["/link?code=7KQ4-MNP2"]
          description: Server-relative web path carrying the code; the QR image holds it as a full URL.
        expiresAt: { type: string, format: date-time }
        pollToken: { type: string, description: Secret for polling and the QR image. Shown once. }

    LocalCheck:
      type: object
      required: [id, key, addresses, expiresAt]
      properties:
        id: { type: string }
        key: { type: string, description: 32 random bytes in base64. Sent once and never again. }
        addresses:
          type: array
          description: Base URLs of the server on its own network, to try in any order. Empty when it has none.
          items: { type: string, format: uri, examples: ["http://192.168.1.20:8477"] }
        expiresAt: { type: string, format: date-time }

    LocalCheckProof:
      type: object
      required: [nonce, proof]
      properties:
        nonce: { type: string, minLength: 16, maxLength: 64, description: "Chosen by the device, new for each attempt." }
        proof: { type: string, pattern: "^[0-9a-f]{64}$" }

    LocalCheckConfirmation:
      type: object
      required: [proof]
      properties:
        proof: { type: string, pattern: "^[0-9a-f]{64}$" }

    DeviceLinkPoll:
      type: object
      required: [status, expiresAt]
      properties:
        status: { $ref: "#/components/schemas/DeviceLinkStatus" }
        expiresAt: { type: string, format: date-time }
        signIn:
          $ref: "#/components/schemas/SignInResult"
          description: The new device's token and Me, on the one poll that hands them over; absent otherwise.

    DeviceLinkPreview:
      type: object
      required: [deviceName, platform, createdAt, expiresAt, modifiedAt]
      properties:
        deviceName: { type: string }
        platform: { $ref: "#/components/schemas/Platform" }
        createdAt: { type: string, format: date-time, description: When the device asked. }
        modifiedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }

    DeviceLink:
      type: object
      required: [id, code, deviceName, platform, status, expiresAt, createdAt, modifiedAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        code: { type: string }
        deviceName: { type: string }
        platform: { $ref: "#/components/schemas/Platform" }
        status: { $ref: "#/components/schemas/DeviceLinkStatus" }
        accountId: { $ref: "#/components/schemas/Id", description: The adult who approved or denied it. }
        householdId: { $ref: "#/components/schemas/Id", description: "That adult's household, which the device shows." }
        deviceId: { $ref: "#/components/schemas/Id", description: The device created once it collected its token. }
        decidedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        modifiedAt: { type: string, format: date-time }

    DeviceLinkPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DeviceLink" }
        nextOffset: { type: integer }

    HouseholdAdultInput:
      type: object
      required: [name, email]
      properties:
        id:
          $ref: "#/components/schemas/Id"
          description: >-
            The new adult's account id, a UUIDv7 the client chose; absent, the
            server chooses one. An id already in use answers 409.
        joinCodeId:
          $ref: "#/components/schemas/Id"
          description: >-
            The new join code's id, a UUIDv7 the client chose; absent, the
            server chooses one. An id already in use answers 409.
        name: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email }
        expiresInDays: { type: integer, enum: [1, 7, 30], default: 7 }

    HouseholdInvite:
      type: object
      required: [account, joinCode]
      properties:
        account: { $ref: "#/components/schemas/Account" }
        joinCode: { $ref: "#/components/schemas/JoinCode" }

    MakeAdultInput:
      type: object
      required: [email]
      properties:
        joinCodeId:
          $ref: "#/components/schemas/Id"
          description: >-
            The new join code's id, a UUIDv7 the client chose; absent, the
            server chooses one. An id already in use answers 409.
        email: { type: string, format: email }
        expiresInDays: { type: integer, enum: [1, 7, 30], default: 7 }

    JoinCodeInput:
      type: object
      required: [accountId]
      properties:
        id:
          $ref: "#/components/schemas/Id"
          description: >-
            On createJoinCode: the new join code's id, a UUIDv7 the client chose; absent, the
            server chooses one. An id already in use answers 409.
        accountId: { $ref: "#/components/schemas/Id" }
        expiresInDays: { type: integer, enum: [1, 7, 30], default: 7 }

    JoinCodeResendInput:
      type: object
      properties:
        joinCodeId:
          $ref: "#/components/schemas/Id"
          description: >-
            The new join code's id, a UUIDv7 the client chose; absent, the
            server chooses one. An id already in use answers 409.

    JoinCodePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/JoinCode" }
        nextOffset: { type: integer }

    LibraryKind:
      type: string
      enum: [movies, tv, music, youtube]

    Library:
      type: object
      required: [id, name, kind, scanHour, watchFiles, folders, stats, createdAt, modifiedAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        kind: { $ref: "#/components/schemas/LibraryKind" }
        scanHour: { type: integer, description: "Nightly scan hour, server local time." }
        watchFiles: { type: boolean }
        folders:
          type: array
          description: Empty unless the caller is an admin.
          items: { $ref: "#/components/schemas/Folder" }
        stats: { $ref: "#/components/schemas/LibraryStats" }
        lastScannedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        modifiedAt: { type: string, format: date-time }
        createdBy: { $ref: "#/components/schemas/Id", description: "The profile that created it; absent when none did, as for what the server made, or when that profile is gone." }
        modifiedBy: { $ref: "#/components/schemas/Id", description: "The profile that last changed it; absent when none did, as for what the server made, or when that profile is gone." }

    LibraryStats:
      type: object
      description: Read-only summary of what a library holds; counts of kinds the library does not have are 0.
      required: [movies, shows, seasons, episodes, files, bytes, unmatched]
      properties:
        movies: { type: integer }
        shows: { type: integer }
        seasons: { type: integer }
        episodes: { type: integer }
        files: { type: integer, description: Number of media files. }
        bytes: { type: integer, format: int64, description: Combined size of the media files. }
        unmatched: { type: integer, description: Movies and shows without matched provider metadata. }
        artists: { type: integer }
        albums: { type: integer }
        songs: { type: integer }
        channels: { type: integer }
        videos: { type: integer }

    LibraryInput:
      type: object
      required: [name, kind]
      properties:
        id:
          $ref: "#/components/schemas/Id"
          description: >-
            On createLibrary: the new library's id, a UUIDv7 the client chose; absent, the
            server chooses one. An id already in use answers 409. On replaceLibrary,
            an id other than the path's answers 400.
        name: { type: string, minLength: 1, maxLength: 100 }
        kind: { $ref: "#/components/schemas/LibraryKind" }
        scanHour: { type: integer, minimum: 0, maximum: 23, default: 3 }
        watchFiles: { type: boolean, default: true }

    LibraryPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Library" }
        nextOffset: { type: integer }

    Folder:
      type: object
      required: [id, libraryId, path, createdAt, modifiedAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        libraryId: { $ref: "#/components/schemas/Id" }
        path: { type: string }
        createdAt: { type: string, format: date-time }
        modifiedAt: { type: string, format: date-time }
        createdBy: { $ref: "#/components/schemas/Id", description: "The profile that created it; absent when none did, as for what the server made, or when that profile is gone." }
        modifiedBy: { $ref: "#/components/schemas/Id", description: "The profile that last changed it; absent when none did, as for what the server made, or when that profile is gone." }

    FolderPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Folder" }

    FolderInput:
      type: object
      required: [path]
      properties:
        id:
          $ref: "#/components/schemas/Id"
          description: >-
            On addLibraryFolder: the new folder's id, a UUIDv7 the client chose; absent, the
            server chooses one. An id already in use answers 409. On replaceLibraryFolder,
            an id other than the path's answers 400.
        path: { type: string, minLength: 2, pattern: "^/" }

    ItemKind:
      type: string
      enum: [movie, show, season, episode]

    ItemSort:
      type: string
      description: |
        title (the default) is by title, movies and shows by
        Item.sortTitle, episodes and seasons by number; added is newest
        first, as Recently added.
      enum: [title, added]

    Resolution:
      type: string
      description: "uhd is 4K: video at least 3200 wide or 2000 tall."
      enum: [uhd]

    Item:
      type: object
      required: [id, libraryId, kind, parsedTitle, addedAt, modifiedAt, createdAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        libraryId: { $ref: "#/components/schemas/Id" }
        parentId: { $ref: "#/components/schemas/Id" }
        kind: { $ref: "#/components/schemas/ItemKind" }
        path: { type: string, description: The base name unless the caller is an admin. }
        parsedTitle: { type: string, description: Title parsed from the file or folder name. }
        sortTitle:
          type: string
          description: >-
            Movies and shows only: what they sort and file letters by. It is
            the title shown (metadata.title, else parsedTitle) less one
            leading English article ("the", "a" or "an", in any case)
            followed by whitespace and more text, so "The Matrix" files
            under M and "A Quiet Place" under Q, and changes with it.
            Clients sort by it ignoring case, file one starting with
            anything but a letter A to Z under #, and show the title.
        parsedYear: { type: integer }
        seasonNumber: { type: integer, description: Season 0 holds specials. }
        episodeNumber: { type: integer }
        metadata: { $ref: "#/components/schemas/ItemMetadata" }
        genres:
          type: array
          description: Provider genres of a movie or show, by name.
          items: { $ref: "#/components/schemas/Genre" }
        collections:
          type: array
          description: >-
            On getItem of a movie only: the collections it is in that the
            active profile may see, by name.
          items: { $ref: "#/components/schemas/Collection" }
        editions:
          type: array
          description: >-
            On getItem of a movie or episode only: its editions that have
            files, the default first, then by name. An episode has one.
          items: { $ref: "#/components/schemas/Edition" }
        addedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        modifiedAt: { type: string, format: date-time }
        unavailable:
          type: boolean
          description: >-
            A movie or episode with files, every one of them marked missing
            (MediaFile.missingAt): it stays listed and startPlayback answers
            409 until a file is back. Absent means false.
        kidsContent:
          type: boolean
          description: >-
            Movies and shows only: whether it is kids' content, which an
            adult with hideKidsContent does not browse. It is
            kidsContentOverride when set, else whether it is rated G (a
            movie) or TV-Y, TV-Y7 or TV-G (a show). A show's seasons and
            episodes follow it.
        kidsContentOverride:
          type: boolean
          description: Movies and shows only. An adult's setKidsContent; absent when none is set and the rating decides.
        posterUrl:
          type: string
          description: >-
            Server-relative URL of the poster the item shows, served by
            getArtwork; it changes exactly when the image does. It is the
            item's own under the metadata settings, else its nearest
            ancestor's: a season's or episode's show, a song's album, a
            video's channel. An artist's is its newest album's that the
            active profile may hear. Absent when there is none.
        backdropUrl:
          type: string
          description: >-
            Server-relative URL of the backdrop the item shows, served by
            getArtwork, chosen as posterUrl is; an artist has none. Absent
            when there is none.

    # Bulk actions on a selection.
    WatchStateBatchInput:
      type: object
      required: [itemIds, watched]
      properties:
        itemIds:
          type: array
          minItems: 1
          maxItems: 2000
          items: { $ref: "#/components/schemas/Id" }
        watched: { type: boolean }
        at:
          type: string
          format: date-time
          description: When the marks were made, as WatchStateInput.at; an item whose state changed later keeps it.

    KidsContentBatchInput:
      type: object
      required: [itemIds, kidsContent]
      properties:
        itemIds:
          type: array
          minItems: 1
          maxItems: 2000
          items: { $ref: "#/components/schemas/Id" }
        kidsContent: { type: boolean }

    PlaylistEntriesInput:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          minItems: 1
          maxItems: 2000
          items: { $ref: "#/components/schemas/PlaylistEntryInput" }

    KidsContentInput:
      type: object
      required: [kidsContent]
      properties:
        kidsContent: { type: boolean }

    Edition:
      type: object
      description: >-
        One cut of a title, read by the scanner from the file names: the
        {edition-Name} tag names it, and untagged files of a movie whose
        runtimes differ by more than 3 minutes are different cuts. Its
        files are interchangeable copies; playback picks one.
      required: [id, name, isDefault, copies]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name:
          type: string
          description: >-
            The tag's name; an untagged cut is "Standard", or "N-minute
            cut" while the title has several untagged cuts.
        isDefault:
          type: boolean
          description: The first untagged cut, else the first edition; what plays when none is named.
        runtimeMs: { type: integer, format: int64, description: Absent when unknown. }
        copies:
          type: array
          description: Its files, the tallest picture first.
          items: { $ref: "#/components/schemas/EditionCopy" }

    EditionCopy:
      type: object
      required: [mediaFileId]
      properties:
        mediaFileId: { $ref: "#/components/schemas/Id" }
        quality:
          type: string
          description: >-
            4K (at least 3200 wide or 2000 tall), 1080p (1600 or 1000),
            720p (1200 or 700) or SD; absent without video.
        width: { type: integer }
        height: { type: integer }
        hdrFormat: { $ref: "#/components/schemas/HdrFormat" }
        unavailable: { type: boolean, description: Its file is marked missing (MediaFile.missingAt). Absent means false. }

    ItemInput:
      type: object
      required: [libraryId, kind, parsedTitle]
      properties:
        libraryId: { $ref: "#/components/schemas/Id" }
        parentId: { $ref: "#/components/schemas/Id" }
        kind: { $ref: "#/components/schemas/ItemKind" }
        path: { type: string }
        parsedTitle: { type: string, minLength: 1 }
        parsedYear: { type: integer, minimum: 1870, maximum: 2200 }
        seasonNumber: { type: integer, minimum: 0 }
        episodeNumber: { type: integer, minimum: 0 }

    ItemMetadata:
      type: object
      description: |
        What an item shows under the metadata settings, each field from the
        local or remote data they pick. provider, providerId and a matched
        status are present only while remote data is in use; releaseDate is
        absent when the files give only a year.
      required: [status]
      properties:
        provider: { type: string, enum: [tmdb], default: tmdb }
        providerId: { type: integer, format: int64 }
        status: { type: string, enum: [unmatched, matched] }
        title: { type: string }
        overview: { type: string }
        releaseDate: { type: string, format: date }
        runtimeMinutes: { type: integer, minimum: 0 }
        contentRating: { type: string, description: MPAA or TV Parental Guidelines rating. }
        posterPath: { type: string }
        backdropPath: { type: string }
        fetchedAt: { type: string, format: date-time, readOnly: true }

    ItemPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Item" }
        nextOffset: { type: integer }

    Genre:
      type: object
      required: [id, name]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        tmdbId: { type: integer, format: int64, description: Absent for genres added by hand. }

    GenreInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        tmdbId: { type: integer, format: int64 }

    GenrePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Genre" }
        nextOffset: { type: integer }

    Occasion:
      type: object
      description: >-
        A seasonal label, anchored to a holiday or to a month and day, in
        season from daysBefore days before its anchor through daysAfter days
        after it.
      required: [id, name, daysBefore, daysAfter, keywordIds, phrases, createdAt, modifiedAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        holiday: { type: string, description: A Holiday key; absent when anchored to month and day. }
        month: { type: integer, minimum: 1, maximum: 12 }
        day: { type: integer, minimum: 1, maximum: 31 }
        daysBefore: { type: integer, minimum: 0, maximum: 90 }
        daysAfter: { type: integer, minimum: 0, maximum: 90 }
        keywordIds:
          type: array
          description: TMDB keyword ids; movies and shows carrying any are members.
          items: { type: integer, format: int64 }
        phrases:
          type: array
          description: Phrases to title the occasion's Home row in place of its name, in the order given; ActiveOccasion.headline is one of them.
          items: { type: string }
        colors: { type: array, maxItems: 3, items: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }, description: "Three colors, as #RRGGBB, for the wash behind the occasion's screen; absent or empty keeps the plain background." }
        createdAt: { type: string, format: date-time }
        modifiedAt: { type: string, format: date-time }
        createdBy: { $ref: "#/components/schemas/Id", description: "The profile that created it; absent when none did, as for what the server made, or when that profile is gone." }
        modifiedBy: { $ref: "#/components/schemas/Id", description: "The profile that last changed it; absent when none did, as for what the server made, or when that profile is gone." }

    OccasionInput:
      type: object
      description: >-
        Exactly one of holiday, or month with day. February 29 anchors only
        leap years. phrases are trimmed, and a phrase equal to an earlier one
        ignoring case is dropped; a phrase blank once trimmed is refused.
        colors are none or exactly three. On createOccasion, phrases or colors
        absent give an occasion anchored to a holiday that holiday's built-in
        phrases or colors, and any other occasion none; an empty array gives
        none. On replaceOccasion, phrases or colors absent are left as stored,
        and an empty array clears them.
      required: [name, daysBefore, daysAfter, keywordIds]
      properties:
        id:
          $ref: "#/components/schemas/Id"
          description: >-
            On createOccasion: the new occasion's id, a UUIDv7 the client chose; absent, the
            server chooses one. An id already in use answers 409. On replaceOccasion,
            an id other than the path's answers 400.
        name: { type: string, minLength: 1, maxLength: 100 }
        holiday: { type: string, minLength: 1, maxLength: 50, description: A key of listHolidays. }
        month: { type: integer, minimum: 1, maximum: 12 }
        day: { type: integer, minimum: 1, maximum: 31 }
        daysBefore: { type: integer, minimum: 0, maximum: 90 }
        daysAfter: { type: integer, minimum: 0, maximum: 90 }
        keywordIds:
          type: array
          maxItems: 100
          items: { type: integer, format: int64, minimum: 1 }
        phrases:
          type: array
          maxItems: 200
          items: { type: string, minLength: 1, maxLength: 60 }
        colors: { type: array, maxItems: 3, items: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }, description: "Three colors, as #RRGGBB, for the wash behind the occasion's screen; absent or empty keeps the plain background." }

    OccasionPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Occasion" }
        nextOffset: { type: integer }

    OccasionMember:
      type: object
      required: [item, via]
      properties:
        item: { $ref: "#/components/schemas/Item" }
        via: { $ref: "#/components/schemas/OccasionMemberVia" }

    OccasionMemberVia:
      type: string
      description: keyword when it carries one of the occasion's keywords, else added by hand.
      enum: [keyword, added]

    OccasionMemberPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/OccasionMember" }
        nextOffset: { type: integer }

    ActiveOccasion:
      type: object
      description: An occasion in season, with this year's window around the day asked about.
      required: [id, name, anchorDate, firstDate, lastDate]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        headline:
          type: string
          description: A phrase to title the occasion's Home row; when it is absent, clients use name.
        colors: { type: array, maxItems: 3, items: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }, description: "Three colors, as #RRGGBB, for the wash behind the occasion's screen; absent or empty keeps the plain background." }
        anchorDate: { type: string, format: date }
        firstDate: { type: string, format: date }
        lastDate: { type: string, format: date }

    ActiveOccasionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ActiveOccasion" }

    Holiday:
      type: object
      required: [key, name, dates]
      properties:
        key: { type: string }
        name: { type: string }
        colors: { type: array, maxItems: 3, items: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }, description: "The three colors, as #RRGGBB, an occasion anchored to this holiday starts with." }
        dates:
          type: array
          description: Its date in each year the server knows, oldest first; an occasion is not in season around a year missing here.
          items: { type: string, format: date }

    HolidayList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Holiday" }

    Person:
      type: object
      required: [id, name]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        tmdbId: { type: integer, format: int64, description: Absent for people added by hand. }
        profilePath: { type: string, description: "Provider headshot name; present when the artwork endpoint has an image." }
        headshotUrl: { type: string, description: "Server-relative URL of the person's headshot, served by getArtwork; it changes exactly when the image does. Absent when there is none." }

    PersonInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        tmdbId: { type: integer, format: int64 }
        profilePath: { type: string }

    PersonPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Person" }
        nextOffset: { type: integer }

    Credit:
      type: object
      required: [personId, name]
      properties:
        personId: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        profilePath: { type: string }
        headshotUrl: { type: string, description: "Server-relative URL of the person's headshot, served by getArtwork; it changes exactly when the image does. Absent when there is none." }
        character: { type: string, description: Cast only. }
        job: { type: string, description: "Crew only: Director, Writer, Screenplay or Creator." }
        department: { type: string }

    ItemCredits:
      type: object
      required: [cast, crew]
      properties:
        cast:
          type: array
          description: Billing order.
          items: { $ref: "#/components/schemas/Credit" }
        crew:
          type: array
          items: { $ref: "#/components/schemas/Credit" }

    CreditInput:
      type: object
      required: [personId]
      properties:
        personId: { $ref: "#/components/schemas/Id" }
        character: { type: string }
        job: { type: string }
        department: { type: string }

    ItemCreditsInput:
      type: object
      required: [cast, crew]
      properties:
        cast:
          type: array
          description: Billing order.
          maxItems: 200
          items: { $ref: "#/components/schemas/CreditInput" }
        crew:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/CreditInput" }

    MediaFile:
      type: object
      required: [id, path, sizeBytes, fileModifiedAt, tracks, chapters, createdAt, modifiedAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        itemId:
          $ref: "#/components/schemas/Id"
          description: >-
            The first item it belongs to; a file holding several episodes
            belongs to each. listMediaFiles lists it under every one. Absent
            for a file of no item.
        path: { type: string, description: The base name unless the caller is an admin. }
        sizeBytes: { type: integer, format: int64 }
        fileModifiedAt: { type: string, format: date-time, description: The file's modification time on disk. }
        container: { type: string }
        durationMs: { type: integer, format: int64 }
        bitrate: { type: integer, format: int64, description: Bits per second. }
        probedAt: { type: string, format: date-time }
        tracks:
          type: array
          description: Written by the prober; read-only here.
          items: { $ref: "#/components/schemas/Track" }
        chapters:
          type: array
          items: { $ref: "#/components/schemas/Chapter" }
        missingAt:
          type: string
          format: date-time
          description: >-
            When a scan, or a playback picking a file, first found the file
            gone from disk or its volume out of reach. Absent while it is
            there. A scan never deletes a missing file or its item;
            deleteMediaFile and deleteItem do.
        probeFailedAt:
          type: string
          format: date-time
          description: >-
            When ffprobe last failed to read the file. Absent once a probe of
            it succeeds; until then probedAt is absent and each scan tries
            again.
        probeError: { type: string, description: What ffprobe said when it last failed; admins only. }
        libraryId:
          $ref: "#/components/schemas/Id"
          description: On listMediaFiles by problem only, the library of the first item it belongs to.
        title: { type: string, description: "On listMediaFiles by problem only, the shown title of the first item it belongs to." }
        createdAt: { type: string, format: date-time }
        modifiedAt: { type: string, format: date-time }

    MediaFileInput:
      type: object
      required: [itemId, path, sizeBytes, fileModifiedAt]
      properties:
        itemId:
          $ref: "#/components/schemas/Id"
          description: The file joins this item's first untagged edition and leaves any other item's.
        path: { type: string, pattern: "^/" }
        sizeBytes: { type: integer, format: int64, minimum: 0 }
        fileModifiedAt: { type: string, format: date-time, description: The file's modification time on disk. }
        container: { type: string }
        durationMs: { type: integer, format: int64, minimum: 0 }
        bitrate: { type: integer, format: int64, minimum: 0 }

    MediaFileProblem:
      type: string
      enum: [missing, no_duration, unreadable]

    Attention:
      type: object
      required: [identity, unstreamable, missing, failed]
      properties:
        identity: { type: integer, description: Identity reviews not dismissed. }
        unstreamable: { type: integer, description: "Files listed by problem no_duration and unreadable." }
        missing: { type: integer, description: Files listed by problem missing. }
        failed: { type: integer, description: "Tasks whose last run failed, and conversions listed by failed." }

    MediaFilePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/MediaFile" }
        nextOffset: { type: integer }

    SeekPreview:
      type: object
      description: The seek preview frames the Seek previews task made for one media file.
      required: [id, mediaFileId, intervalMs, count, width, height, createdAt, modifiedAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        mediaFileId: { $ref: "#/components/schemas/Id" }
        intervalMs: { type: integer, description: Milliseconds between frames. }
        count: { type: integer, description: Number of frames. }
        width: { type: integer }
        height: { type: integer }
        createdAt: { type: string, format: date-time }
        modifiedAt: { type: string, format: date-time }

    SeekPreviewPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SeekPreview" }
        nextOffset: { type: integer }

    IdentityReviewReason:
      type: string
      description: |
        conflicting_identity: the ids an item's names and tags state name
        different titles, or another title than its match.
        invalid_identity: a stated id is malformed or unknown to its provider.
        tied_candidates: several provider titles fit the name equally well.
        conflicting_years: a show's episode files name different premiere years.
        ambiguous_move: a file gone from disk looks like several new ones, or
        several gone files like one new one.
        no_match: the provider has no title of this name.
        unrecognized: a file whose name places it under no title.
      enum: [conflicting_identity, invalid_identity, tied_candidates, conflicting_years, ambiguous_move, no_match, unrecognized]

    IdentityEvidence:
      type: object
      description: One fact a review rests on; only the properties that apply are present.
      required: [role]
      properties:
        role:
          type: string
          description: current is the match the item has, stated what a name or tag says, candidate a title or file it could be.
          enum: [current, stated, candidate]
        provider: { type: string, enum: [tmdb, tvdb, imdb, musicbrainz] }
        externalId: { type: string, description: The provider's id. }
        title: { type: string, description: "The provider's title, or a malformed tag as written." }
        year: { type: integer }
        country: { type: string, description: "ISO 3166-1 alpha-2 codes, comma separated." }
        path: { type: string, description: "The folder or file stating it, or a file it could be." }

    IdentityReview:
      type: object
      description: |
        An item, or a file no item could be made for, that needs an admin.
        An item's review ends when the item is matched or unmatched by hand
        or a later scan finds its reason gone; a file's when a scan files
        it or no longer finds it.
      required: [id, libraryId, reason, raisedAt, evidence]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        libraryId: { $ref: "#/components/schemas/Id" }
        itemId: { $ref: "#/components/schemas/Id" }
        itemKind: { type: string, description: The item's kind. }
        title: { type: string, description: The item's title as its names give it. }
        path: { type: string, description: "The file, when no item could be made for it." }
        reason: { $ref: "#/components/schemas/IdentityReviewReason" }
        raisedAt: { type: string, format: date-time }
        dismissedAt: { type: string, format: date-time }
        evidence:
          type: array
          items: { $ref: "#/components/schemas/IdentityEvidence" }

    IdentityReviewInput:
      type: object
      required: [dismissed]
      properties:
        dismissed: { type: boolean }

    IdentityReviewPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/IdentityReview" }
        nextOffset: { type: integer }

    TrackKind:
      type: string
      enum: [video, audio, subtitle]

    ArtworkKind:
      type: string
      description: A poster is portrait, or an episode's still; a backdrop is landscape.
      enum: [poster, backdrop]

    ArtworkStore:
      type: string
      description: Part of an address getArtwork serves; clients take addresses whole from the data.
      enum: [w185, w500, w1280, caa, local, music, youtube]

    HdrFormat:
      type: string
      enum: [hdr10, hdr10plus, dolby_vision, hlg]

    Track:
      type: object
      required: [id, streamIndex, kind, codec, isDefault, isForced]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        streamIndex: { type: integer }
        kind: { $ref: "#/components/schemas/TrackKind" }
        codec: { type: string }
        profile: { type: string }
        level: { type: integer }
        language: { type: string, description: ISO 639-2 code as probed. }
        title: { type: string }
        isDefault: { type: boolean }
        isForced: { type: boolean }
        bitrate: { type: integer, format: int64 }
        width: { type: integer }
        height: { type: integer }
        frameRate: { type: number, format: double }
        bitDepth: { type: integer }
        pixelFormat: { type: string }
        colorPrimaries: { type: string }
        colorTransfer: { type: string }
        hdrFormat: { $ref: "#/components/schemas/HdrFormat" }
        channels: { type: integer }
        channelLayout: { type: string }
        sampleRate: { type: integer }
        subtitleIsText: { type: boolean }

    Chapter:
      type: object
      required: [id, position, startMs, endMs]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        position: { type: integer }
        startMs: { type: integer, format: int64 }
        endMs: { type: integer, format: int64 }
        title: { type: string }

    WatchState:
      type: object
      required: [itemId, positionMs, watched, playCount, changedAt]
      properties:
        itemId: { $ref: "#/components/schemas/Id" }
        positionMs: { type: integer, format: int64 }
        editionId:
          $ref: "#/components/schemas/Id"
          description: >-
            The edition positionMs belongs to; startPlayback resumes only
            when it plays this edition. A position put by putWatchState
            belongs to the default edition.
        watched: { type: boolean, description: "Per title, whichever edition was played." }
        playCount: { type: integer }
        lastPlayedAt: { type: string, format: date-time }
        changedAt: { type: string, format: date-time, description: "The instant of the write that set it, as the client gave it; the latest wins." }

    WatchStateInput:
      type: object
      required: [watched]
      properties:
        watched: { type: boolean }
        positionMs: { type: integer, format: int64, minimum: 0, default: 0 }
        editionId:
          $ref: "#/components/schemas/Id"
          description: The edition, of this item, positionMs was reached in; absent is the default edition.
        at:
          type: string
          format: date-time
          description: >-
            When the change happened, as a device that played offline knows
            it; absent is now, and a time ahead of the server's is taken as
            now. The change applies only over a state that changed no later,
            and is lastPlayedAt; otherwise the stored state stays and is the
            answer.

    PlayInput:
      type: object
      required: [at]
      properties:
        at:
          type: string
          format: date-time
          description: When the play ended; a time ahead of the server's is taken as now.
        editionId:
          $ref: "#/components/schemas/Id"
          description: The edition, of this item, that played; absent is the default edition.

    WatchStatePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/WatchState" }
        nextOffset: { type: integer }

