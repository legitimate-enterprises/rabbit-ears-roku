        in: path
        required: true
        description: The other adult; the two ids name the link in either order.
        schema: { $ref: "#/components/schemas/Id" }
    get:
      operationId: getAdultLink
      tags: [admin]
      security:
        - device: [admin]
      responses:
        "200":
          description: Link.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdultLink" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: replaceAdultLink
      tags: [admin]
      summary: Sets whether the link holds on TVs too.
      security:
        - device: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdultLinkUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdultLink" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteAdultLink
      tags: [admin]
      summary: >-
        Unlinks two adults and deletes the pending profile offers between
        them. Profiles already shared stay where they are.
      security:
        - device: [admin]
      responses:
        "204": { description: Unlinked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

