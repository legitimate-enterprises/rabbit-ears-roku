        entries or the active profile may not see it.
      parameters:
        - $ref: "#/components/parameters/ImageVersion"
        - name: If-None-Match
          in: header
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/CustomImage" }
        "304": { $ref: "#/components/responses/CustomImageCurrent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: replaceStationImage
      tags: [stations]
      summary: Sets the station's custom image as replacePlaylistImage does, a title being one of its playlist's entries. Only its owner, active; any other profile that sees it gets 403.
      x-upload: true
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
          application/json:
            schema: { $ref: "#/components/schemas/CustomImageInput" }
      responses:
        "200":
          description: The station with its new imageUrl.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Station" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
